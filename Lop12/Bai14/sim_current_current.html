<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng Tương tác Giữa Hai Dòng Điện Song Song</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; color: #f8fafc; overflow: hidden; padding: 6px; display: flex; flex-direction: column; height: 100vh; }
        .controls { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.78rem; }
        .btn { background: #2563eb; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .canvas-container { flex: 1; position: relative; background: #020617; border-radius: 10px; border: 1px solid #1e293b; overflow: hidden; min-height: 180px; }
        canvas { display: block; width: 100%; height: 100%; }

        .status-banner {
            margin-top: 5px;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #1e293b;
            border-radius: 8px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 700;
            color: #34d399;
            transition: all 0.3s;
        }
    
        /* RESPONSIVE DESIGN CHO ĐIỆN THOẠI & MÁY TÍNH BẢNG */
        @media (max-width: 768px) {
            body { padding: 4px !important; overflow-y: auto !important; }
            .controls { flex-direction: column !important; align-items: stretch !important; padding: 5px 8px !important; font-size: 0.75rem !important; gap: 5px !important; }
            .btn { width: 100% !important; text-align: center !important; padding: 6px 8px !important; font-size: 0.75rem !important; }
            .status-banner { font-size: 0.72rem !important; padding: 5px 6px !important; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <span><strong>Tương tác giữa hai dòng điện song song:</strong></span>
        <button class="btn" onclick="toggleCurrents()">Đổi Chiều Dòng Điện: <span id="dirTxt" style="color:#34d399;">Trường Hợp 1: CÙNG CHIỀU (HÚT NHAU)</span></button>
    </div>
    
    <div class="canvas-container">
        <canvas id="c"></canvas>
    </div>

    <div class="status-banner" id="statusBanner">
        🟢 TRƯỜNG HỢP 1: CÙNG CHIỀU (I₁ ▲, I₂ ▲) ➔ LỰC TỪ HÚT NHAU VÀO TRONG
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let sameDir = true;
        let animOffset = 0;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.onresize = resize;

        function updateStatusBanner() {
            const banner = document.getElementById('statusBanner');
            let btnTxt = document.getElementById('dirTxt');
            if (sameDir) {
                btnTxt.innerText = "Trường Hợp 1: CÙNG CHIỀU (HÚT NHAU)";
                btnTxt.style.color = "#34d399";
                banner.innerHTML = '<span style="color:#34d399;">🟢 TRƯỜNG HỢP 1: CÙNG CHIỀU (I₁ ▲, I₂ ▲) ➔ LỰC TỪ HÚT NHAU VÀO TRONG</span>';
            } else {
                btnTxt.innerText = "Trường Hợp 2: NGƯỢC CHIỀU (ĐẨY NHAU)";
                btnTxt.style.color = "#f87171";
                banner.innerHTML = '<span style="color:#f87171;">🔴 TRƯỜNG HỢP 2: NGƯỢC CHIỀU (I₁ ▲, I₂ ▼) ➔ LỰC TỪ ĐẨY NHAU RA NGOÀI</span>';
            }
        }

        function toggleCurrents() {
            sameDir = !sameDir;
            updateStatusBanner();
        }

        function drawArrow(x, y, dirUp, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.translate(x, y);
            if (!dirUp) ctx.rotate(Math.PI);
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.lineTo(-5, 2);
            ctx.lineTo(5, 2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2, cy = canvas.height / 2;
            let bend = sameDir ? 22 : -22;

            animOffset = (animOffset + 1.2) % 30;

            let wireGap = Math.min(80, canvas.width * 0.24);
            let w1X = cx - wireGap;
            let w2X = cx + wireGap;
            let topY = 32;
            let botY = canvas.height - 22;

            // Wire 1 (Left - Current I1 UPWARDS)
            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 6;
            ctx.shadowBlur = 10; ctx.shadowColor = '#f97316';
            ctx.beginPath(); ctx.moveTo(w1X, topY);
            ctx.quadraticCurveTo(w1X + bend, cy, w1X, botY);
            ctx.stroke();

            // Wire 2 (Right - Current I2)
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6;
            ctx.shadowBlur = 10; ctx.shadowColor = '#38bdf8';
            ctx.beginPath(); ctx.moveTo(w2X, topY);
            ctx.quadraticCurveTo(w2X - bend, cy, w2X, botY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Wire Top Labels (Formatted neatly to avoid overlap)
            ctx.fillStyle = '#f97316'; ctx.font = 'bold 12px Plus Jakarta Sans'; ctx.textAlign = 'center';
            ctx.fillText('DÂY 1: I₁ (▲)', w1X, 20);

            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 12px Plus Jakarta Sans'; ctx.textAlign = 'center';
            let i2Label = sameDir ? 'DÂY 2: I₂ (▲)' : 'DÂY 2: I₂ (▼)';
            ctx.fillText(i2Label, w2X, 20);

            // Animated Moving Current Flow Particles
            let totalH = botY - topY;
            
            // Wire 1 Particles (Left - I1 UPWARDS)
            for (let y = botY - 10 - animOffset; y > topY + 10; y -= 32) {
                let t = (y - topY) / totalH;
                let px = (1 - t)**2 * w1X + 2*(1 - t)*t * (w1X + bend) + t**2 * w1X;
                drawArrow(px, y, true, '#ffedd5');
            }

            // Wire 2 Particles (Right - I2 UPWARDS when sameDir, DOWNWARDS when !sameDir)
            if (sameDir) {
                for (let y = botY - 10 - animOffset; y > topY + 10; y -= 32) {
                    let t = (y - topY) / totalH;
                    let px = (1 - t)**2 * w2X + 2*(1 - t)*t * (w2X - bend) + t**2 * w2X;
                    drawArrow(px, y, true, '#e0f2fe');
                }
            } else {
                for (let y = topY + 10 + animOffset; y < botY - 10; y += 32) {
                    let t = (y - topY) / totalH;
                    let px = (1 - t)**2 * w2X + 2*(1 - t)*t * (w2X - bend) + t**2 * w2X;
                    drawArrow(px, y, false, '#e0f2fe');
                }
            }

            // Force Vector Arrows at mid-wire
            let mid1X = w1X + bend * 0.75;
            let mid2X = w2X - bend * 0.75;
            let forceMag = Math.min(36, wireGap * 0.45);
            let color = sameDir ? '#34d399' : '#ef4444';

            ctx.strokeStyle = color; ctx.lineWidth = 3.5;
            ctx.fillStyle = color;

            if (sameDir) {
                // Hút nhau: F21 (Wire 1 -> Right), F12 (Wire 2 -> Left)
                ctx.beginPath(); ctx.moveTo(mid1X, cy); ctx.lineTo(mid1X + forceMag, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(mid1X + forceMag, cy); ctx.lineTo(mid1X + forceMag - 8, cy - 5); ctx.lineTo(mid1X + forceMag - 8, cy + 5); ctx.fill();

                ctx.beginPath(); ctx.moveTo(mid2X, cy); ctx.lineTo(mid2X - forceMag, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(mid2X - forceMag, cy); ctx.lineTo(mid2X - forceMag + 8, cy - 5); ctx.lineTo(mid2X - forceMag + 8, cy + 5); ctx.fill();
            } else {
                // Đẩy nhau: F21 (Wire 1 -> Left), F12 (Wire 2 -> Right)
                ctx.beginPath(); ctx.moveTo(mid1X, cy); ctx.lineTo(mid1X - forceMag, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(mid1X - forceMag, cy); ctx.lineTo(mid1X - forceMag + 8, cy - 5); ctx.lineTo(mid1X - forceMag + 8, cy + 5); ctx.fill();

                ctx.beginPath(); ctx.moveTo(mid2X, cy); ctx.lineTo(mid2X + forceMag, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(mid2X + forceMag, cy); ctx.lineTo(mid2X + forceMag - 8, cy - 5); ctx.lineTo(mid2X + forceMag - 8, cy + 5); ctx.fill();
            }

            // Vector Labels F21 & F12
            ctx.font = 'bold 11px Plus Jakarta Sans'; ctx.textAlign = 'center';
            let label1X = sameDir ? mid1X + forceMag / 2 : mid1X - forceMag / 2;
            let label2X = sameDir ? mid2X - forceMag / 2 : mid2X + forceMag / 2;
            ctx.fillText('F₂₁', label1X, cy - 10);
            ctx.fillText('F₁₂', label2X, cy - 10);

            requestAnimationFrame(draw);
        }

        window.onload = () => { resize(); draw(); updateStatusBanner(); };
    
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                e.preventDefault();
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        window.addEventListener('touchend', function(e) {
            var mouseEvent = new MouseEvent('mouseup', {});
            window.dispatchEvent(mouseEvent);
        });
    </script>
</body>
</html>
