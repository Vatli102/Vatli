<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng Thí nghiệm Oersted Dòng điện - Nam châm</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; color: #f8fafc; overflow: hidden; padding: 6px; display: flex; flex-direction: column; height: 100vh; }
        .controls { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.78rem; gap: 6px; flex-wrap: wrap; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 5px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .btn:hover { background: #334155; }
        .btn.active { background: #2563eb; border-color: #3b82f6; }
        .btn-dir { background: #0f172a; border-color: #38bdf8; }
        .canvas-container { flex: 1; position: relative; background: #020617; border-radius: 10px; border: 1px solid #1e293b; overflow: hidden; min-height: 180px; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .status-banner {
            margin-top: 5px;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #1e293b;
            border-radius: 8px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 700;
            color: #94a3b8;
            transition: all 0.3s;
        }

        /* RESPONSIVE DESIGN CHO ĐIỆN THOẠI & MÁY TÍNH BẢNG */
        @media (max-width: 768px) {
            body { padding: 4px !important; overflow-y: auto !important; }
            .controls { flex-direction: column !important; align-items: stretch !important; padding: 5px 8px !important; font-size: 0.75rem !important; gap: 5px !important; }
            .btn-group { flex-direction: column !important; width: 100% !important; }
            .btn { width: 100% !important; text-align: center !important; padding: 6px 8px !important; font-size: 0.75rem !important; }
            .status-banner { font-size: 0.72rem !important; padding: 5px 6px !important; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <span><strong>Tương tác Dòng điện - Nam châm (Thí nghiệm Oersted 1820):</strong></span>
        <div class="btn-group">
            <button class="btn btn-dir" onclick="toggleDirection()">Đổi Chiều Dòng Điện: <span id="dirLabel" style="color:#38bdf8;">I (Trái ➔ Phải)</span></button>
            <button class="btn" id="btnSwitch" onclick="toggleSwitch()">Bật Dòng Điện (Đóng Công Tắc K)</button>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="c"></canvas>
    </div>

    <div class="status-banner" id="statusBanner">
        ⚪ CÔNG TẮC MỞ (I = 0) ➔ KIM LA BÀN ĐỊNH HƯỚNG BẮC-NAM MẶC ĐỊNH
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let isClosed = false;
        let dirRight = true;
        let angle = 0;
        let targetAngle = 0;
        let animOffset = 0;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.onresize = resize;

        function updateStatusBanner() {
            const banner = document.getElementById('statusBanner');
            if (isClosed) {
                if (dirRight) {
                    banner.innerHTML = '<span style="color:#34d399;">🟢 TRƯỜNG HỢP 1: DÒNG ĐIỆN (➔) SINH TỪ TRƯỜNG ➔ KIM LA BÀN BỊ QUAY LỆCH SANG PHẢI!</span>';
                } else {
                    banner.innerHTML = '<span style="color:#f87171;">🔴 TRƯỜNG HỢP 2: DÒNG ĐIỆN (⬅) SINH TỪ TRƯỜNG ➔ KIM LA BÀN QUAY LỆCH SANG TRÁI!</span>';
                }
            } else {
                banner.innerHTML = '<span style="color:#94a3b8;">⚪ CÔNG TẮC MỞ (I = 0) ➔ KIM LA BÀN ĐỊNH HƯỚNG BẮC-NAM MẶC ĐỊNH</span>';
            }
        }

        function toggleSwitch() {
            isClosed = !isClosed;
            updateTargetAngle();
            updateStatusBanner();
            let btn = document.getElementById('btnSwitch');
            btn.innerText = isClosed ? 'Ngắt Dòng Điện (Mở Công Tắc K)' : 'Bật Dòng Điện (Đóng Công Tắc K)';
            btn.classList.toggle('active', isClosed);
        }

        function toggleDirection() {
            dirRight = !dirRight;
            let lbl = document.getElementById('dirLabel');
            lbl.innerText = dirRight ? 'I (Trái ➔ Phải)' : 'I (Phải ➔ Trái)';
            lbl.style.color = dirRight ? '#38bdf8' : '#f43f5e';
            updateTargetAngle();
            updateStatusBanner();
        }

        function updateTargetAngle() {
            if (!isClosed) {
                targetAngle = 0;
            } else {
                targetAngle = dirRight ? Math.PI / 2.2 : -Math.PI / 2.2;
            }
        }

        function drawHorizontalArrow(x, y, isRight, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.translate(x, y);
            if (!isRight) ctx.rotate(Math.PI);
            ctx.beginPath();
            ctx.moveTo(7, 0);
            ctx.lineTo(-4, -4);
            ctx.lineTo(-4, 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2;
            let h = canvas.height;
            
            // Adaptive Y positioning so needle is NEVER clipped
            let wireY = Math.max(26, h * 0.28);
            let compassY = Math.min(h - 36, Math.max(wireY + 50, h * 0.68));
            let compassR = Math.min(34, (compassY - wireY) * 0.52);

            let wireLeft = 30;
            let wireRight = canvas.width - 30;

            if (isClosed) {
                animOffset = (animOffset + 1.5) % 35;
            }

            // 1. Support Pillar
            ctx.fillStyle = '#334155';
            ctx.fillRect(cx - 24, compassY + compassR, 48, 6);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(cx - 3, compassY + 4, 6, Math.max(10, compassR));

            // 2. Wire Conductor Line
            ctx.strokeStyle = isClosed ? (dirRight ? '#f97316' : '#f43f5e') : '#64748b';
            ctx.lineWidth = 6;
            if (isClosed) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = dirRight ? '#f97316' : '#f43f5e';
            }
            ctx.beginPath();
            ctx.moveTo(wireLeft, wireY);
            ctx.lineTo(wireRight, wireY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Wire terminals
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath(); ctx.arc(wireLeft, wireY, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(wireRight, wireY, 5, 0, Math.PI*2); ctx.fill();

            // Wire Current Arrows & Label
            if (isClosed) {
                let arrowSpacing = 36;
                let startX = wireLeft + 25;
                let endX = wireRight - 25;
                
                for (let x = startX; x <= endX; x += arrowSpacing) {
                    let posX = dirRight 
                        ? startX + ((x - startX + animOffset) % (endX - startX))
                        : endX - ((endX - x + animOffset) % (endX - startX));
                    drawHorizontalArrow(posX, wireY, dirRight, '#ffffff');
                }

                ctx.fillStyle = dirRight ? '#38bdf8' : '#fb7185';
                ctx.font = 'bold 11px Plus Jakarta Sans';
                ctx.textAlign = 'center';
                let dirSymbol = dirRight ? '►►►' : '◄◄◄';
                let dirTxt = dirRight ? 'Dòng I (Trái ➔ Phải)' : 'Dòng I (Phải ➔ Trái)';
                ctx.fillText(`DÂY DẪN: ${dirTxt} ${dirSymbol}`, cx, wireY - 10);
            } else {
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 10px Plus Jakarta Sans';
                ctx.textAlign = 'center';
                ctx.fillText('DÂY DẪN MANG DÒNG ĐIỆN (Chưa đóng K)', cx, wireY - 10);
            }

            // Smooth needle animation
            angle += (targetAngle - angle) * 0.08;

            // 3. Compass Outer Dial
            ctx.save();
            ctx.translate(cx, compassY);
            
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, compassR, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            // Dial compass ticks & Cardinal Labels
            ctx.fillStyle = '#cbd5e1';
            ctx.font = `bold ${Math.max(8, compassR * 0.28)}px Plus Jakarta Sans`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('N', 0, -compassR * 0.7);
            ctx.fillText('S', 0, compassR * 0.7);
            ctx.fillText('W', -compassR * 0.7, 0);
            ctx.fillText('E', compassR * 0.7, 0);

            // 4. Prominent 3D Rotating Compass Needle
            ctx.rotate(angle);
            let nLen = compassR * 0.85;
            
            // North Pole (Red Pointer)
            let nGrad = ctx.createLinearGradient(0, -5, nLen, 5);
            nGrad.addColorStop(0, '#f87171');
            nGrad.addColorStop(0.5, '#ef4444');
            nGrad.addColorStop(1, '#b91c1c');
            ctx.fillStyle = nGrad;
            ctx.beginPath();
            ctx.moveTo(nLen, 0); ctx.lineTo(0, -6); ctx.lineTo(0, 6);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.max(7, compassR * 0.26)}px Plus Jakarta Sans`;
            ctx.fillText('N', nLen * 0.5, 0);

            // South Pole (Silver / Blue-Grey Pointer)
            let sGrad = ctx.createLinearGradient(-nLen, -5, 0, 5);
            sGrad.addColorStop(0, '#64748b');
            sGrad.addColorStop(0.5, '#cbd5e1');
            sGrad.addColorStop(1, '#f1f5f9');
            ctx.fillStyle = sGrad;
            ctx.beginPath();
            ctx.moveTo(-nLen, 0); ctx.lineTo(0, -6); ctx.lineTo(0, 6);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.font = `bold ${Math.max(7, compassR * 0.26)}px Plus Jakarta Sans`;
            ctx.fillText('S', -nLen * 0.5, 0);

            // Gold Center Pin & Pivot Cap
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fef08a';
            ctx.beginPath(); ctx.arc(-1, -1, 2, 0, Math.PI*2); ctx.fill();

            ctx.restore();

            requestAnimationFrame(draw);
        }

        window.onload = () => { resize(); draw(); updateStatusBanner(); };
    
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                e.preventDefault();
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, {passive: false});

        window.addEventListener('touchend', function(e) {
            var mouseEvent = new MouseEvent('mouseup', {});
            window.dispatchEvent(mouseEvent);
        });
    </script>
</body>
</html>
