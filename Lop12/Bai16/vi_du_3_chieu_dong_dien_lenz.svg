<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 840" width="100%" height="100%">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrowB0" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrowBc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  <rect x="1" y="1" width="878" height="838" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="16" />

  <!-- Top Title Banner -->
  <rect x="140" y="14" width="600" height="36" rx="8" fill="#0f172a" />
  <text x="440" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
    MINH HỌA VÍ DỤ 3: CHIỀU DÒNG ĐIỆN CẢM ỨNG TRONG VÒNG DÂY ĐỒNG
  </text>

  <!-- ================= ROW 1: TRƯỜNG HỢP A (LẠI GẦN) ================= -->
  <g transform="translate(20, 62)">
    <rect width="840" height="370" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.8" filter="url(#cardShadow)" />
    
    <!-- Row Header -->
    <path d="M 0 14 Q 0 0 14 0 L 826 0 Q 840 0 840 14 L 840 40 L 0 40 Z" fill="#047857" />
    <text x="420" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      a) CỰC BẮC (N) LẠI GẦN VÒNG DÂY (TỪ THÔNG Φ TĂNG)
    </text>

    <!-- LEFT SIDE: 3D EXPERIMENTAL DIAGRAM -->
    <g transform="translate(175, 52)">
      <!-- Bar Magnet (Vertical: S top, N bottom) -->
      <g transform="translate(-30, 0)">
        <!-- S Pole (Top) -->
        <rect x="0" y="0" width="60" height="38" rx="4" fill="url(#sGrad)" />
        <text x="30" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
        <!-- N Pole (Bottom) -->
        <rect x="0" y="38" width="60" height="38" rx="4" fill="url(#nGrad)" />
        <text x="30" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
        <rect x="0" y="0" width="60" height="76" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Velocity vector v (Downwards) -->
      <path d="M 48 20 L 48 64" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrowV)" />
      <text x="60" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#d97706">v (đi xuống)</text>

      <!-- Field Vector B0 (Downwards) -->
      <g transform="translate(-75, 82)">
        <path d="M 0 0 L 0 58" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrowB0)" />
        <rect x="-44" y="16" width="42" height="24" rx="5" fill="#e0f2fe" stroke="#7dd3fc" />
        <text x="-23" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#0369a1" text-anchor="middle">B₀ ↓</text>
      </g>

      <!-- Field Vector Bc (Upwards - Opposing increase) -->
      <g transform="translate(75, 82)">
        <path d="M 0 58 L 0 0" stroke="#059669" stroke-width="4" marker-end="url(#arrowBc)" />
        <rect x="8" y="16" width="42" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7" />
        <text x="29" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">Bc ↑</text>
      </g>

      <!-- 3D Perspective Copper Ring -->
      <g transform="translate(0, 180)">
        <!-- Back half of copper loop -->
        <path d="M -130 0 A 130 34 0 0 1 130 0" fill="none" stroke="#78350f" stroke-width="7" />
        <!-- Front half of copper loop -->
        <path d="M 130 0 A 130 34 0 0 1 -130 0" fill="none" stroke="#f59e0b" stroke-width="7" />
        
        <!-- Current Ic Arrow on front rim (Right-to-Left => Counter-Clockwise CCW) -->
        <path d="M 45 33 L -10 33" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
        <path d="M -10 33 L 6 25" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
        <path d="M -10 33 L 6 41" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

        <!-- Equivalent North Pole Badge -->
        <rect x="-152" y="-14" width="72" height="28" rx="6" fill="#fef2f2" stroke="#f87171" />
        <text x="-116" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#dc2626" text-anchor="middle">MẶT BẮC</text>

        <!-- Ring Label -->
        <text x="140" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#b45309">VÒNG ĐỒNG</text>
      </g>

      <!-- Current Direction Pill Badge -->
      <g transform="translate(-135, 232)">
        <rect x="0" y="0" width="270" height="32" rx="8" fill="#fef2f2" stroke="#fca5a5" />
        <text x="135" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#dc2626" text-anchor="middle">
          Chiều Ic: Ngược chiều KĐH (↺)
        </text>
      </g>
    </g>

    <!-- RIGHT SIDE: 4-STEP LOGIC CARD (WIDE & COMFORTABLE) -->
    <g transform="translate(370, 52)">
      <rect width="450" height="300" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4" />
      <text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#166534">
        LẬP LUẬN THEO ĐỊNH LUẬT LENZ (4 BƯỚC):
      </text>

      <!-- Step 1 -->
      <g transform="translate(20, 58)">
        <circle cx="10" cy="-4" r="10" fill="#047857" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Từ trường ngoài <tspan font-weight="800" fill="#0284c7">B₀ hướng thẳng đứng xuống dưới</tspan>.
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">
          (Đường sức từ đi ra từ cực Bắc N ở dưới của nam châm)
        </text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(20, 114)">
        <circle cx="10" cy="-4" r="10" fill="#047857" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Nam châm lại gần ➔ Số đường sức qua mạch tăng.
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#d97706">
          ➔ Từ thông qua vòng dây tăng (ΔΦ &gt; 0).
        </text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(20, 170)">
        <circle cx="10" cy="-4" r="10" fill="#047857" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Định luật Lenz: Từ trường cảm ứng Bc chống lại sự tăng
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#059669">
          ➔ Bc ngược chiều B₀ ➔ Bc hướng lên trên (Bc ↑).
        </text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(20, 226)">
        <circle cx="10" cy="-4" r="10" fill="#047857" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Quy tắc nắm tay phải (ngón cái chỉ theo Bc ↑):
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#dc2626">
          ➔ Dòng điện Ic chạy NGƯỢC CHIỀU KIM ĐỒNG HỒ (↺).
        </text>
      </g>

      <!-- Bottom conclusion badge -->
      <rect x="20" y="256" width="410" height="30" rx="6" fill="#dcfce7" stroke="#86efac" />
      <text x="225" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#15803d" text-anchor="middle">
        ➔ Mặt trên là cực Bắc để ĐẨY cản trở nam châm lại gần.
      </text>
    </g>
  </g>

  <!-- ================= ROW 2: TRƯỜNG HỢP B (RA XA) ================= -->
  <g transform="translate(20, 450)">
    <rect width="840" height="370" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.8" filter="url(#cardShadow)" />
    
    <!-- Row Header -->
    <path d="M 0 14 Q 0 0 14 0 L 826 0 Q 840 0 840 14 L 840 40 L 0 40 Z" fill="#c2410c" />
    <text x="420" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      b) CỰC BẮC (N) RA XA VÒNG DÂY (TỪ THÔNG Φ GIẢM)
    </text>

    <!-- LEFT SIDE: 3D EXPERIMENTAL DIAGRAM -->
    <g transform="translate(175, 52)">
      <!-- Bar Magnet (Vertical: S top, N bottom) -->
      <g transform="translate(-30, 0)">
        <!-- S Pole (Top) -->
        <rect x="0" y="0" width="60" height="38" rx="4" fill="url(#sGrad)" />
        <text x="30" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
        <!-- N Pole (Bottom) -->
        <rect x="0" y="38" width="60" height="38" rx="4" fill="url(#nGrad)" />
        <text x="30" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
        <rect x="0" y="0" width="60" height="76" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Velocity vector v (Upwards) -->
      <path d="M 48 64 L 48 20" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrowV)" />
      <text x="60" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#d97706">v (đi lên)</text>

      <!-- Field Vector B0 (Downwards) -->
      <g transform="translate(-75, 82)">
        <path d="M 0 0 L 0 58" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrowB0)" />
        <rect x="-44" y="16" width="42" height="24" rx="5" fill="#e0f2fe" stroke="#7dd3fc" />
        <text x="-23" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#0369a1" text-anchor="middle">B₀ ↓</text>
      </g>

      <!-- Field Vector Bc (Downwards - Compensating decrease) -->
      <g transform="translate(75, 82)">
        <path d="M 0 0 L 0 58" stroke="#059669" stroke-width="4" marker-end="url(#arrowBc)" />
        <rect x="8" y="16" width="42" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7" />
        <text x="29" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">Bc ↓</text>
      </g>

      <!-- 3D Perspective Copper Ring -->
      <g transform="translate(0, 180)">
        <!-- Back half of copper loop -->
        <path d="M -130 0 A 130 34 0 0 1 130 0" fill="none" stroke="#78350f" stroke-width="7" />
        <!-- Front half of copper loop -->
        <path d="M 130 0 A 130 34 0 0 1 -130 0" fill="none" stroke="#f59e0b" stroke-width="7" />
        
        <!-- Current Ic Arrow on front rim (Left-to-Right => Clockwise CW) -->
        <path d="M -45 33 L 10 33" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
        <path d="M 10 33 L -6 25" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
        <path d="M 10 33 L -6 41" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

        <!-- Equivalent South Pole Badge -->
        <rect x="-152" y="-14" width="72" height="28" rx="6" fill="#f0f9ff" stroke="#7dd3fc" />
        <text x="-116" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0284c7" text-anchor="middle">MẶT NAM</text>

        <!-- Ring Label -->
        <text x="140" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#b45309">VÒNG ĐỒNG</text>
      </g>

      <!-- Current Direction Pill Badge -->
      <g transform="translate(-135, 232)">
        <rect x="0" y="0" width="270" height="32" rx="8" fill="#fff7ed" stroke="#fdba74" />
        <text x="135" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#c2410c" text-anchor="middle">
          Chiều Ic: Cùng chiều KĐH (↻)
        </text>
      </g>
    </g>

    <!-- RIGHT SIDE: 4-STEP LOGIC CARD (WIDE & COMFORTABLE) -->
    <g transform="translate(370, 52)">
      <rect width="450" height="300" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4" />
      <text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#9a3412">
        LẬP LUẬN THEO ĐỊNH LUẬT LENZ (4 BƯỚC):
      </text>

      <!-- Step 1 -->
      <g transform="translate(20, 58)">
        <circle cx="10" cy="-4" r="10" fill="#c2410c" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Từ trường ngoài <tspan font-weight="800" fill="#0284c7">B₀ hướng thẳng đứng xuống dưới</tspan>.
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">
          (Đường sức từ đi ra từ cực Bắc N ở dưới của nam châm)
        </text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(20, 114)">
        <circle cx="10" cy="-4" r="10" fill="#c2410c" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Nam châm ra xa ➔ Số đường sức qua mạch giảm.
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#d97706">
          ➔ Từ thông qua vòng dây giảm (ΔΦ &lt; 0).
        </text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(20, 170)">
        <circle cx="10" cy="-4" r="10" fill="#c2410c" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Định luật Lenz: Từ trường cảm ứng Bc bù đắp sự suy giảm
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#059669">
          ➔ Bc cùng chiều B₀ ➔ Bc hướng xuống dưới (Bc ↓).
        </text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(20, 226)">
        <circle cx="10" cy="-4" r="10" fill="#c2410c" />
        <text x="10" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
        <text x="28" y="-4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
          Quy tắc nắm tay phải (ngón cái chỉ theo Bc ↓):
        </text>
        <text x="28" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#c2410c">
          ➔ Dòng điện Ic chạy CÙNG CHIỀU KIM ĐỒNG HỒ (↻).
        </text>
      </g>

      <!-- Bottom conclusion badge -->
      <rect x="20" y="256" width="410" height="30" rx="6" fill="#ffedd5" stroke="#fdba74" />
      <text x="225" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#c2410c" text-anchor="middle">
        ➔ Mặt trên là cực Nam để HÚT cản trở nam châm rời xa.
      </text>
    </g>
  </g>

</svg>
