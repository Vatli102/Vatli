<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="16" />
  <rect x="1" y="1" width="878" height="668" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="16" />

  <!-- Top Title Banner (Bỏ từ Quy trình) -->
  <rect x="140" y="14" width="600" height="36" rx="8" fill="#0f172a" />
  <text x="440" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">
    4 BƯỚC XÁC ĐỊNH CHIỀU DÒNG ĐIỆN CẢM ỨNG (ĐỊNH LUẬT LENZ)
  </text>

  <!-- ================= ROW 1: BƯỚC 1 & BƯỚC 2 ================= -->
  
  <!-- STEP 1 -->
  <g transform="translate(20, 62)">
    <rect width="405" height="280" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 14 Q 0 0 14 0 L 391 0 Q 405 0 405 14 L 405 40 L 0 40 Z" fill="url(#step1Grad)" />
    <text x="202" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      BƯỚC 1: XÁC ĐỊNH TỪ TRƯỜNG BAN ĐẦU B₀
    </text>
    
    <text x="20" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#0369a1">
      • Xác định chiều vectơ B₀ xuyên qua mạch kín:
    </text>
    
    <g transform="translate(20, 85)">
      <rect width="365" height="52" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="14" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">
        Quy ước từ trường nam châm:
      </text>
      <text x="14" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#0284c7">
        "Vào cực Nam (S) — Ra cực Bắc (N)"
      </text>
    </g>

    <!-- Mini Graphic: Vertical Magnet & Vector B0 -->
    <g transform="translate(145, 155)">
      <!-- S Pole (Top) -->
      <rect x="0" y="0" width="46" height="28" rx="3" fill="#0284c7" />
      <text x="23" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
      <!-- N Pole (Bottom) -->
      <rect x="0" y="28" width="46" height="28" rx="3" fill="#ef4444" />
      <text x="23" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>
      <rect x="0" y="0" width="46" height="56" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2" />

      <!-- Vector B0 pointing straight downwards -->
      <path d="M 64 12 L 64 54" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowBlue)" />
      <rect x="76" y="24" width="38" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
      <text x="95" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0284c7" text-anchor="middle">B₀ ↓</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 430 202 L 450 202" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 2 -->
  <g transform="translate(455, 62)">
    <rect width="405" height="280" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 14 Q 0 0 14 0 L 391 0 Q 405 0 405 14 L 405 40 L 0 40 Z" fill="url(#step2Grad)" />
    <text x="202" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      BƯỚC 2: XÉT BIẾN THIÊN TỪ THÔNG Φ
    </text>
    
    <text x="20" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#b45309">
      • Xét từ thông qua khung dây tăng hay giảm:
    </text>
    
    <g transform="translate(20, 85)">
      <rect width="365" height="76" rx="8" fill="#fffbeb" stroke="#fef3c7" />
      <text x="14" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">
        1. Khi nam châm LẠI GẦN vòng dây:
      </text>
      <text x="14" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">
        ➔ Số đường sức tăng ➔ <tspan font-weight="800" fill="#d97706">Từ thông TĂNG (ΔΦ &gt; 0)</tspan>.
      </text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="365" height="76" rx="8" fill="#fffbeb" stroke="#fef3c7" />
      <text x="14" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">
        2. Khi nam châm RA XA vòng dây:
      </text>
      <text x="14" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">
        ➔ Số đường sức giảm ➔ <tspan font-weight="800" fill="#d97706">Từ thông GIẢM (ΔΦ &lt; 0)</tspan>.
      </text>
    </g>
  </g>

  <!-- ================= ROW 2: BƯỚC 3 & BƯỚC 4 ================= -->
  
  <!-- STEP 3 -->
  <g transform="translate(20, 365)">
    <rect width="405" height="285" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 14 Q 0 0 14 0 L 391 0 Q 405 0 405 14 L 405 40 L 0 40 Z" fill="url(#step3Grad)" />
    <text x="202" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      BƯỚC 3: XÁC ĐỊNH TỪ TRƯỜNG CẢM ỨNG Bc
    </text>
    
    <text x="20" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#065f46">
      • Áp dụng Định luật Lenz (chống lại sự biến thiên):
    </text>

    <g transform="translate(20, 85)">
      <rect width="365" height="80" rx="8" fill="#ecfdf5" stroke="#d1fae5" />
      <text x="14" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#047857">
        1. Nếu từ thông TĂNG (ΔΦ &gt; 0):
      </text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#064e3b">
        ➔ Bc NGƯỢC CHIỀU B₀ (Bc ↑↓ B₀)
      </text>
      <text x="14" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#059669">
        (Từ trường cảm ứng sinh ra để chống lại sự tăng).
      </text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="365" height="80" rx="8" fill="#ecfdf5" stroke="#d1fae5" />
      <text x="14" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#047857">
        2. Nếu từ thông GIẢM (ΔΦ &lt; 0):
      </text>
      <text x="14" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#064e3b">
        ➔ Bc CÙNG CHIỀU B₀ (Bc ↑↑ B₀)
      </text>
      <text x="14" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#059669">
        (Từ trường cảm ứng sinh ra để bù đắp sự suy giảm).
      </text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 430 507 L 450 507" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- STEP 4 -->
  <g transform="translate(455, 365)">
    <rect width="405" height="285" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.8" filter="url(#shadow)" />
    <path d="M 0 14 Q 0 0 14 0 L 391 0 Q 405 0 405 14 L 405 40 L 0 40 Z" fill="url(#step4Grad)" />
    <text x="202" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">
      BƯỚC 4: TÌM CHIỀU DÒNG CẢM ỨNG Ic
    </text>
    
    <text x="20" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#3730a3">
      • Áp dụng Quy tắc nắm tay phải với vectơ Bc:
    </text>

    <g transform="translate(20, 85)">
      <rect width="365" height="80" rx="8" fill="#eef2ff" stroke="#e0e7ff" />
      <text x="14" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca">
        • Ngón tay cái choãi ra:
      </text>
      <text x="28" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
        Chỉ theo chiều của vectơ từ trường cảm ứng <tspan font-weight="800" fill="#059669">Bc</tspan>.
      </text>
      <text x="14" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#4338ca">
        • Chiều khum của 4 ngón tay:
      </text>
    </g>

    <!-- Ring with Current Ic Graphic -->
    <g transform="translate(130, 192)">
      <ellipse cx="65" cy="24" rx="65" ry="20" fill="none" stroke="#d97706" stroke-width="4.5" />
      <!-- Current Arrow -->
      <path d="M 115 34 L 128 24 L 118 14" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
      <text x="136" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#ef4444">Ic</text>
      
      <!-- Bc Arrow pointing up -->
      <path d="M 65 24 L 65 -16" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)" />
      <rect x="75" y="-8" width="36" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7" />
      <text x="93" y="7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">Bc ↑</text>
    </g>

    <text x="20" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#4338ca" text-anchor="middle">
      <tspan x="202">➔ Cho biết chiều của dòng điện cảm ứng Ic trong mạch.</tspan>
    </text>
  </g>

</svg>
