<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%" style="background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <!-- Magnetic Field Line Arrow (Cyan/Blue) -->
    <marker id="arrow-field-line" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <!-- Central Vector B Arrow (Deep Royal Blue) -->
    <marker id="arrow-b-vector" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <!-- Normal Vector n Arrow (Crimson Red) -->
    <marker id="arrow-n-vector" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <!-- Loop Positive Direction Arrow -->
    <marker id="arrow-loop-pos" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Khung viền bản vẽ -->
  <rect x="2" y="2" width="756" height="436" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= ĐƯỜNG SỨC TỪ PHÍA DƯỚI MẶT PHẲNG (NÉT ĐỨT) ================= -->
  <!-- Đường sức từ 1 (Trái) -->
  <line x1="160" y1="380" x2="230" y2="280" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Đường sức từ 2 (Giữa trái) -->
  <line x1="250" y1="380" x2="320" y2="280" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Đường sức từ trung tâm qua O -->
  <line x1="310" y1="380" x2="380" y2="280" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Đường sức từ 4 (Giữa phải) -->
  <line x1="400" y1="380" x2="470" y2="280" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Đường sức từ 5 (Phải) -->
  <line x1="490" y1="380" x2="560" y2="280" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,5"/>


  <!-- ================= MẶT PHẲNG KHUNG DÂY KÍN (C) DIỆN TÍCH S ================= -->
  <g id="khung-day-C">
    <!-- Diện tích S mặt phẳng giới hạn bởi khung dây -->
    <ellipse cx="380" cy="280" rx="230" ry="85" fill="url(#surface-grad)" stroke="#0284c7" stroke-width="2.5"/>
    
    <!-- Nhãn khung dây kín (C) -->
    <rect x="120" y="325" width="135" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="187" y="342" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Khung dây kín (C)</text>

    <!-- Nhãn diện tích S -->
    <rect x="525" y="325" width="115" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="582" y="342" font-size="12.5" font-weight="800" fill="#0284c7" text-anchor="middle">Diện tích S</text>

    <!-- Chiều dương quy ước (+) trên vòng dây -->
    <path d="M 380 365 A 230 85 0 0 0 510 350" fill="none" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow-loop-pos)"/>
    <rect x="390" y="380" width="165" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="472" y="396" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">(+) Chiều dương quy ước</text>
  </g>


  <!-- ================= GỐC TỌA ĐỘ O & KÍ HIỆU GÓC VUÔNG ================= -->
  <circle cx="380" cy="280" r="4.5" fill="#0f172a"/>
  <text x="362" y="295" font-size="14" font-weight="800" fill="#0f172a">O</text>

  <!-- Góc vuông của vectơ pháp tuyến n với mặt phẳng S -->
  <path d="M 380 252 L 404 255 L 404 283" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="392" cy="268" r="1.8" fill="#dc2626"/>


  <!-- ================= ĐƯỜNG SỨC TỪ PHÍA TRÊN MẶT PHẲNG (NÉT LIỀN) ================= -->
  <!-- Đường sức từ 1 -->
  <line x1="230" y1="280" x2="310" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-field-line)"/>
  <!-- Đường sức từ 2 -->
  <line x1="320" y1="280" x2="400" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-field-line)"/>
  <!-- Đường sức từ 4 -->
  <line x1="470" y1="280" x2="550" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-field-line)"/>
  <!-- Đường sức từ 5 -->
  <line x1="560" y1="280" x2="640" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-field-line)"/>
  
  <!-- Nhãn các đường sức từ -->
  <text x="645" y="155" font-size="12" font-weight="700" fill="#0284c7">Đường sức từ</text>


  <!-- ================= VECTƠ PHÁP TUYẾN n ================= -->
  <line x1="380" y1="280" x2="380" y2="70" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow-n-vector)"/>
  
  <!-- Ký hiệu vectơ n -->
  <g transform="translate(355, 55)">
    <line x1="0" y1="-13" x2="13" y2="-13" stroke="#dc2626" stroke-width="1.8"/>
    <polygon points="10,-16 15,-13 10,-10" fill="#dc2626"/>
    <text x="0" y="0" font-size="18" font-weight="800" fill="#dc2626">n</text>
  </g>
  <rect x="235" y="65" width="135" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="302" y="81" font-size="11.5" font-weight="800" fill="#dc2626" text-anchor="middle">Vectơ pháp tuyến</text>
  <text x="302" y="96" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">(n ⊥ S, |n| = 1)</text>


  <!-- ================= VECTƠ CẢM ỨNG TỪ B ================= -->
  <!-- Vectơ B hợp với n góc alpha = 35 độ -->
  <line x1="380" y1="280" x2="505" y2="102" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-b-vector)"/>
  
  <!-- Ký hiệu vectơ B -->
  <g transform="translate(520, 95)">
    <line x1="0" y1="-13" x2="14" y2="-13" stroke="#1d4ed8" stroke-width="1.8"/>
    <polygon points="11,-16 16,-13 11,-10" fill="#1d4ed8"/>
    <text x="0" y="0" font-size="18" font-weight="800" fill="#1d4ed8">B</text>
  </g>
  <rect x="520" y="105" width="145" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="592" y="121" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Vectơ cảm ứng từ</text>
  <text x="592" y="136" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">(Từ trường đều B)</text>


  <!-- ================= CUNG GÓC ALPHA ================= -->
  <!-- Tâm (380, 280), bán kính R = 110. Bắt đầu từ n (380, 170) đến B (380 + 110*sin(35)=443.1, 280 - 110*cos(35)=189.9) -->
  <path d="M 380 170 A 110 110 0 0 1 443.1 189.9" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  
  <!-- Khung nhãn góc alpha -->
  <rect x="398" y="142" width="40" height="28" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="418" y="161" font-size="16" font-weight="800" fill="#ea580c" text-anchor="middle">α</text>

  <rect x="375" y="18" width="230" height="26" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="490" y="35" font-size="12.5" font-weight="800" fill="#c2410c" text-anchor="middle">Góc xác định từ thông: α = (n, B)</text>
</svg>
