<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%" style="background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="coil-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-b0" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-bc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-current" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Container Border -->
  <rect x="2" y="2" width="816" height="436" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= VÙNG 1: THÍ NGHIỆM 1 (NAM CHÂM LẠI GẦN VÒNG DÂY) ================= -->
  <g id="exp-1" transform="translate(15, 12)">
    <!-- Hộp chứa TN 1 -->
    <rect x="0" y="0" width="385" height="416" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Tiêu đề TN 1 -->
    <rect x="0" y="0" width="385" height="38" rx="14" fill="#0284c7"/>
    <rect x="0" y="22" width="385" height="16" fill="#0284c7"/>
    <text x="192" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      THÍ NGHIỆM 1: NAM CHÂM LẠI GẦN VÒNG DÂY
    </text>

    <!-- 1. Thanh nam châm N-S -->
    <!-- Cực Nam (S) - Xanh dương -->
    <rect x="25" y="70" width="55" height="32" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="52" y="91" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    
    <!-- Cực Bắc (N) - Đỏ -->
    <rect x="80" y="70" width="55" height="32" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
    <text x="107" y="91" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>

    <!-- Mũi tên vận tốc v (chuyển động lại gần -> sang phải) -->
    <line x1="50" y1="52" x2="115" y2="52" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-v)"/>
    <text x="82" y="45" font-size="11.5" font-weight="800" fill="#ea580c" text-anchor="middle">Vận tốc v ➔</text>

    <!-- Các đường sức từ B_0 của nam châm -->
    <path d="M 135 76 Q 180 70 230 74" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-b0)"/>
    <path d="M 135 86 L 230 86" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-b0)"/>
    <path d="M 135 96 Q 180 102 230 98" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-b0)"/>
    <text x="180" y="116" font-size="10.5" font-weight="700" fill="#dc2626">Từ trường B₀ ➔</text>

    <!-- 2. Vòng dây dẫn kín (C) -->
    <g transform="translate(245, 45)">
      <!-- Vòng elip 3D -->
      <ellipse cx="40" cy="45" rx="35" ry="42" fill="url(#coil-grad)" stroke="#0284c7" stroke-width="3"/>
      
      <!-- Mũi tên chiều dòng điện cảm ứng I_c (ngược chiều kim đồng hồ nhìn từ nam châm -> ở cạnh trước hướng lên) -->
      <path d="M 40 87 A 35 42 0 0 0 75 45" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-current)"/>
      <text x="40" y="-8" font-size="11.5" font-weight="800" fill="#0284c7" text-anchor="middle">Vòng dây kín (C)</text>
      <text x="82" y="70" font-size="11" font-weight="800" fill="#0284c7">I_c</text>

      <!-- Từ trường cảm ứng B_c chống lại sự tăng -> hướng sang TRÁI -->
      <line x1="30" y1="45" x2="-25" y2="45" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-bc)"/>
      <text x="-5" y="36" font-size="10" font-weight="800" fill="#16a34a">B_c ⬅</text>

      <!-- Cực từ mặt trước vòng dây: Cực N (Đẩy nam châm) -->
      <rect x="25" y="95" width="30" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="40" y="108" font-size="10" font-weight="800" fill="#dc2626" text-anchor="middle">Mặt N</text>
    </g>

    <!-- 3. Dây dẫn nối xuống Điện kế G -->
    <path d="M 285 132 L 285 175 L 210 175 L 210 200" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 285 45 L 335 45 L 335 175 L 260 175 L 260 200" fill="none" stroke="#475569" stroke-width="2"/>

    <!-- Điện kế G -->
    <g transform="translate(195, 200)">
      <!-- Thân đồng hồ -->
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
      <!-- Mặt thang đo -->
      <path d="M 12 35 A 30 30 0 0 1 68 35" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <line x1="40" y1="12" x2="40" y2="18" stroke="#0f172a" stroke-width="1.5"/>
      <text x="40" y="10" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">0</text>
      <!-- Vạch - và + -->
      <text x="18" y="24" font-size="8" font-weight="700" fill="#64748b">-</text>
      <text x="62" y="24" font-size="8" font-weight="700" fill="#64748b">+</text>
      <!-- Kim điện kế lệch sang PHẢI (+) -->
      <line x1="40" y1="42" x2="58" y2="20" stroke="#dc2626" stroke-width="2.2"/>
      <circle cx="40" cy="42" r="3.5" fill="#0f172a"/>
      <text x="40" y="54" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">Điện kế G</text>
    </g>

    <!-- 4. Hộp tóm tắt kết quả TN 1 -->
    <g transform="translate(12, 275)">
      <rect x="0" y="0" width="361" height="128" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="12" y="20" font-size="11.5" font-weight="800" fill="#15803d">KẾT QUẢ THÍ NGHIỆM 1 (LẠI GẦN):</text>
      <text x="12" y="38" font-size="11" font-weight="600" fill="#166534">• Nam châm lại gần ➔ Số đường sức xuyên qua tăng.</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#15803d">• Từ thông tăng: <tspan font-weight="800">ΔΦ &gt; 0</tspan>.</text>
      <text x="12" y="74" font-size="11" font-weight="600" fill="#166534">• Kim điện kế G <tspan font-weight="800" fill="#15803d">bị lệch</tspan> ➔ Xuất hiện dòng cảm ứng I_c.</text>
      <text x="12" y="92" font-size="11" font-weight="600" fill="#166534">• Mặt trước vòng dây là <tspan font-weight="800" fill="#dc2626">cực Bắc (N)</tspan> để cản nam châm.</text>
      <text x="12" y="112" font-size="11" font-weight="800" fill="#15803d">➔ Từ trường cảm ứng B_c ngược chiều B₀ (B_c ⇈ B₀).</text>
    </g>
  </g>


  <!-- ================= VÙNG 2: THÍ NGHIỆM 2 (NAM CHÂM RA XA VÒNG DÂY) ================= -->
  <g id="exp-2" transform="translate(420, 12)">
    <!-- Hộp chứa TN 2 -->
    <rect x="0" y="0" width="385" height="416" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Tiêu đề TN 2 -->
    <rect x="0" y="0" width="385" height="38" rx="14" fill="#d97706"/>
    <rect x="0" y="22" width="385" height="16" fill="#d97706"/>
    <text x="192" y="24" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      THÍ NGHIỆM 2: NAM CHÂM RA XA VÒNG DÂY
    </text>

    <!-- 1. Thanh nam châm N-S -->
    <!-- Cực Nam (S) - Xanh dương -->
    <rect x="25" y="70" width="55" height="32" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="52" y="91" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
    
    <!-- Cực Bắc (N) - Đỏ -->
    <rect x="80" y="70" width="55" height="32" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
    <text x="107" y="91" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">N</text>

    <!-- Mũi tên vận tốc v (chuyển động ra xa -> sang trái) -->
    <line x1="110" y1="52" x2="45" y2="52" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-v)"/>
    <text x="82" y="45" font-size="11.5" font-weight="800" fill="#ea580c" text-anchor="middle">⬅ Vận tốc v</text>

    <!-- Các đường sức từ B_0 của nam châm -->
    <path d="M 135 76 Q 180 70 230 74" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-b0)"/>
    <path d="M 135 86 L 230 86" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-b0)"/>
    <path d="M 135 96 Q 180 102 230 98" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-b0)"/>
    <text x="180" y="116" font-size="10.5" font-weight="700" fill="#dc2626">Từ trường B₀ ➔</text>

    <!-- 2. Vòng dây dẫn kín (C) -->
    <g transform="translate(245, 45)">
      <!-- Vòng elip 3D -->
      <ellipse cx="40" cy="45" rx="35" ry="42" fill="url(#coil-grad)" stroke="#d97706" stroke-width="3"/>
      
      <!-- Mũi tên chiều dòng điện cảm ứng I_c (cùng chiều kim đồng hồ -> ở cạnh trước hướng xuống) -->
      <path d="M 40 3 A 35 42 0 0 1 75 45" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-current)"/>
      <text x="40" y="-8" font-size="11.5" font-weight="800" fill="#d97706" text-anchor="middle">Vòng dây kín (C)</text>
      <text x="82" y="40" font-size="11" font-weight="800" fill="#d97706">I_c</text>

      <!-- Từ trường cảm ứng B_c bù đắp sự giảm -> hướng cùng chiều B_0 (sang PHẢI) -->
      <line x1="5" y1="45" x2="65" y2="45" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-bc)"/>
      <text x="25" y="36" font-size="10" font-weight="800" fill="#16a34a">B_c ➔</text>

      <!-- Cực từ mặt trước vòng dây: Cực S (Hút giữ nam châm) -->
      <rect x="25" y="95" width="30" height="18" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="40" y="108" font-size="10" font-weight="800" fill="#0284c7" text-anchor="middle">Mặt S</text>
    </g>

    <!-- 3. Dây dẫn nối xuống Điện kế G -->
    <path d="M 285 132 L 285 175 L 210 175 L 210 200" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 285 45 L 335 45 L 335 175 L 260 175 L 260 200" fill="none" stroke="#475569" stroke-width="2"/>

    <!-- Điện kế G -->
    <g transform="translate(195, 200)">
      <!-- Thân đồng hồ -->
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
      <!-- Mặt thang đo -->
      <path d="M 12 35 A 30 30 0 0 1 68 35" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <line x1="40" y1="12" x2="40" y2="18" stroke="#0f172a" stroke-width="1.5"/>
      <text x="40" y="10" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">0</text>
      <!-- Vạch - và + -->
      <text x="18" y="24" font-size="8" font-weight="700" fill="#64748b">-</text>
      <text x="62" y="24" font-size="8" font-weight="700" fill="#64748b">+</text>
      <!-- Kim điện kế lệch sang TRÁI (-) -->
      <line x1="40" y1="42" x2="22" y2="20" stroke="#dc2626" stroke-width="2.2"/>
      <circle cx="40" cy="42" r="3.5" fill="#0f172a"/>
      <text x="40" y="54" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">Điện kế G</text>
    </g>

    <!-- 4. Hộp tóm tắt kết quả TN 2 -->
    <g transform="translate(12, 275)">
      <rect x="0" y="0" width="361" height="128" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <text x="12" y="20" font-size="11.5" font-weight="800" fill="#b45309">KẾT QUẢ THÍ NGHIỆM 2 (RA XA):</text>
      <text x="12" y="38" font-size="11" font-weight="600" fill="#78350f">• Nam châm ra xa ➔ Số đường sức xuyên qua giảm.</text>
      <text x="12" y="56" font-size="11" font-weight="700" fill="#b45309">• Từ thông giảm: <tspan font-weight="800">ΔΦ &lt; 0</tspan>.</text>
      <text x="12" y="74" font-size="11" font-weight="600" fill="#78350f">• Kim điện kế G <tspan font-weight="800" fill="#b45309">lệch ngược chiều</tspan> ➔ I_c đổi chiều.</text>
      <text x="12" y="92" font-size="11" font-weight="600" fill="#78350f">• Mặt trước vòng dây là <tspan font-weight="800" fill="#0284c7">cực Nam (S)</tspan> để hút nam châm.</text>
      <text x="12" y="112" font-size="11" font-weight="800" fill="#b45309">➔ Từ trường cảm ứng B_c cùng chiều B₀ (B_c ⇈ B₀).</text>
    </g>
  </g>
</svg>
