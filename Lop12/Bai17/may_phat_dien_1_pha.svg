<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- 3D Magnet Pole N (Red Metallic 3D) -->
    <linearGradient id="magN-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="magN-top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="magN-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- 3D Magnet Pole S (Blue Metallic 3D) -->
    <linearGradient id="magS-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="magS-top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="magS-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- 3D Copper Coil Gradient (Metallic Gold/Copper) -->
    <linearGradient id="copper3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- 3D Steel Shaft Cylinder Gradient -->
    <linearGradient id="steelShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- 3D Brass Slip Ring Gradient -->
    <linearGradient id="brassRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glow Filter for Bulb -->
    <filter id="glowBulb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="drop3D" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="5" in="SourceAlpha"/>
      <feOffset dx="3" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrowB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowRot" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Nền toàn khung -->
  <rect width="920" height="540" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- TIÊU ĐỀ 3D HIỆN ĐẠI -->
  <g transform="translate(460, 32)">
    <rect x="-240" y="-18" width="480" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop3D)"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">SƠ ĐỒ NGUYÊN LÝ MÁY PHÁT ĐIỆN XOAY CHIỀU 1 PHA (3D)</text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. PHẦN CẢM: HAI CỰC NAM CHÂM 3D (POLE PIECES) -->
  <!-- ============================================================== -->

  <!-- CỰC BẮC N (BÊN TRÁI 3D) -->
  <g id="poleN-3D" filter="url(#drop3D)">
    <!-- Mặt đỉnh 3D (Top Face) -->
    <polygon points="50,160 90,120 200,120 160,160" fill="url(#magN-top)" stroke="#b91c1c" stroke-width="1.5"/>
    <!-- Mặt bên 3D (Back/Side Face) -->
    <polygon points="200,120 200,310 160,350 160,160" fill="url(#magN-side)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Mặt trước lõm cung ôm khung dây (Front Curved Face) -->
    <path d="M 50 160 L 160 160 C 185 220, 185 290, 160 350 L 50 350 Z" fill="url(#magN-front)" stroke="#991b1b" stroke-width="2"/>
    <!-- Chữ N to nổi bật 3D -->
    <text x="105" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(2px 3px 2px rgba(0,0,0,0.4))">N</text>
    <!-- Nhãn Cực Bắc -->
    <rect x="50" y="365" width="110" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="105" y="384" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">Cực Bắc (N)</text>
  </g>

  <!-- CỰC NAM S (BÊN PHẢI 3D) -->
  <g id="poleS-3D" filter="url(#drop3D)">
    <!-- Mặt đỉnh 3D (Top Face) -->
    <polygon points="760,160 800,120 910,120 870,160" transform="translate(-150,0)" fill="url(#magS-top)" stroke="#1d4ed8" stroke-width="1.5"/>
    <!-- Mặt bên 3D (Side Face) -->
    <polygon points="760,160 760,350 720,310 720,120" fill="url(#magS-side)" stroke="#1e3a8a" stroke-width="1.5"/>
    <!-- Mặt trước lõm ôm khung dây (Front Curved Face) -->
    <path d="M 870 160 L 760 160 C 735 220, 735 290, 760 350 L 870 350 Z" fill="url(#magS-front)" stroke="#1e40af" stroke-width="2"/>
    <!-- Chữ S to nổi bật 3D -->
    <text x="815" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(2px 3px 2px rgba(0,0,0,0.4))">S</text>
    <!-- Nhãn Cực Nam -->
    <rect x="760" y="365" width="110" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="815" y="384" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">Cực Nam (S)</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. TỪ TRƯỜNG B 3D XUYÊN TỪ N SANG S -->
  <!-- ============================================================== -->
  <g id="magnetic-field-3D">
    <path d="M 180 190 L 740 190" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowB)"/>
    <path d="M 185 240 L 735 240" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowB)"/>
    <path d="M 185 285 L 735 285" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowB)"/>
    <path d="M 180 330 L 740 330" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowB)"/>

    <!-- Nhãn Vectơ B -->
    <rect x="400" y="145" width="120" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="460" y="163" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle">Từ trường đều B</text>
  </g>

  <!-- ============================================================== -->
  <!-- 3. TRỤC QUAY HÌNH TRỤ 3D & MŨI TÊN QUAY OMEGA -->
  <!-- ============================================================== -->
  <!-- Trục quay phía trên -->
  <rect x="454" y="70" width="12" height="75" rx="4" fill="url(#steelShaft)" stroke="#334155" stroke-width="1"/>
  <!-- Mũi tên quay 3D omega -->
  <path d="M 425 105 A 35 14 0 1 1 495 105" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowRot)"/>
  <text x="515" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#9333ea">ω</text>
  <text x="460" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Trục quay OO'</text>

  <!-- ============================================================== -->
  <!-- 4. KHUNG DÂY DẪN ĐỒNG 3D (ARMATURE COIL ABCD) NGHIÊNG GÓC -->
  <!-- ============================================================== -->
  <g id="coil-3D" filter="url(#drop3D)">
    <!-- Diện tích khung dây (Mặt phẳng mờ 3D) -->
    <polygon points="340,210 580,180 580,330 340,360" fill="rgba(245, 158, 11, 0.12)" stroke="none"/>

    <!-- 4 Cạnh khung dây đồng 3D sáng bóng -->
    <!-- Cạnh trên AB -->
    <line x1="340" y1="210" x2="580" y2="180" stroke="url(#copper3D)" stroke-width="6" stroke-linecap="round"/>
    <!-- Cạnh phải BC -->
    <line x1="580" y1="180" x2="580" y2="330" stroke="url(#copper3D)" stroke-width="6" stroke-linecap="round"/>
    <!-- Cạnh dưới CD -->
    <line x1="580" y1="330" x2="340" y2="360" stroke="url(#copper3D)" stroke-width="6" stroke-linecap="round"/>
    <!-- Cạnh trái DA -->
    <line x1="340" y1="360" x2="340" y2="210" stroke="url(#copper3D)" stroke-width="6" stroke-linecap="round"/>

    <!-- Nhãn 4 đỉnh A, B, C, D to rõ -->
    <circle cx="340" cy="210" r="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="340" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">A</text>

    <circle cx="580" cy="180" r="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="580" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">B</text>

    <circle cx="580" cy="330" r="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="580" y="334" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">C</text>

    <circle cx="340" cy="360" r="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="340" y="364" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">D</text>

    <!-- Mũi tên chiều dòng điện cảm ứng tức thời i(t) -->
    <line x1="340" y1="310" x2="340" y2="250" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrowI)"/>
    <text x="315" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#16a34a">i(t)</text>

    <line x1="580" y1="230" x2="580" y2="290" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrowI)"/>
    <text x="605" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#16a34a">i(t)</text>
  </g>

  <!-- ============================================================== -->
  <!-- 5. BỘ GÓP ĐIỆN 3D: HAI VÀNH KHUYÊN & HAI CHỔI QUÉT -->
  <!-- ============================================================== -->
  <!-- Trục quay phía dưới -->
  <rect x="454" y="340" width="12" height="120" rx="4" fill="url(#steelShaft)" stroke="#334155" stroke-width="1"/>

  <!-- Dây nối từ khung dây xuống 2 vành khuyên -->
  <path d="M 435 348 L 435 385" stroke="#d97706" stroke-width="3"/>
  <path d="M 485 343 L 485 415" stroke="#d97706" stroke-width="3"/>

  <!-- VÀNH KHUYÊN 1 (SLIP RING 1) 3D -->
  <g transform="translate(460, 390)" filter="url(#drop3D)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="url(#brassRing)" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="0" cy="-3" rx="30" ry="10" fill="none" stroke="#fef08a" stroke-width="1"/>
    <!-- Chổi quét than 1 (Carbon Brush 1) -->
    <rect x="-48" y="-7" width="22" height="14" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Dây dẫn ra mạch ngoài từ chổi 1 -->
    <path d="M -48 0 L -100 0 L -100 80" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- VÀNH KHUYÊN 2 (SLIP RING 2) 3D -->
  <g transform="translate(460, 425)" filter="url(#drop3D)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="url(#brassRing)" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="0" cy="-3" rx="30" ry="10" fill="none" stroke="#fef08a" stroke-width="1"/>
    <!-- Chổi quét than 2 (Carbon Brush 2) -->
    <rect x="26" y="-7" width="22" height="14" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Dây dẫn ra mạch ngoài từ chổi 2 -->
    <path d="M 48 0 L 100 0 L 100 45" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Hộp chú thích Vành khuyên & Chổi quét -->
  <g transform="translate(540, 400)">
    <rect x="0" y="0" width="170" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#drop3D)"/>
    <text x="85" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">• 2 Vành khuyên (quay)</text>
    <text x="85" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">• 2 Chổi quét than (cố định)</text>
  </g>

  <!-- ============================================================== -->
  <!-- 6. MẠCH TIÊU THỤ NGOÀI: BÓNG ĐÈN PHÁT SÁNG 3D (LOAD) -->
  <!-- ============================================================== -->
  <g transform="translate(460, 470)" filter="url(#drop3D)">
    <!-- Dây nối hai đầu vào đui đèn -->
    <path d="M -100 0 L -30 0" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M 100 0 L 30 0" fill="none" stroke="#dc2626" stroke-width="3"/>

    <!-- Vầng sáng hào quang tỏa ra từ bóng đèn -->
    <circle cx="0" cy="0" r="32" fill="#fef08a" opacity="0.45" filter="url(#glowBulb)"/>
    <circle cx="0" cy="0" r="22" fill="#fde047" opacity="0.6"/>

    <!-- Quả bóng đèn thủy tinh -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <!-- Dây tóc phát sáng rực rỡ -->
    <path d="M -6 4 L -3 -6 L 0 4 L 3 -6 L 6 4" fill="none" stroke="#ea580c" stroke-width="2"/>

    <!-- Đui đèn kim loại -->
    <rect x="-8" y="14" width="16" height="8" rx="2" fill="#64748b" stroke="#334155"/>

    <text x="0" y="-22" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#d97706" text-anchor="middle">Tải tiêu thụ (Đèn sáng)</text>
    <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#16a34a" text-anchor="middle">Dòng xoay chiều AC ra tải</text>
  </g>

  <!-- Watermark -->
  <text x="900" y="525" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
