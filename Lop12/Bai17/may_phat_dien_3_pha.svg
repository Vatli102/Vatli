<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic 3D Stator Gradients -->
    <linearGradient id="statorOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="statorInnerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="statorRim3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Magnet Rotor Gradients -->
    <linearGradient id="rotorNorth" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="rotorSouth" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="rotorSide3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Phase 1 Coils (Red Copper) -->
    <linearGradient id="coil1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Phase 2 Coils (Green Copper) -->
    <linearGradient id="coil2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="80%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Phase 3 Coils (Blue Copper) -->
    <linearGradient id="coil3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="coilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9" />
    </marker>
    <marker id="rotArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="560" rx="16" fill="url(#bgGlow)"/>
  <rect width="850" height="560" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- ==================== STATOR 3D BASE ==================== -->
  <g transform="translate(380, 280)" filter="url(#shadow3D)">
    <!-- 3D Stator Depth/Cylinder Extrusion -->
    <ellipse cx="0" cy="18" rx="215" ry="215" fill="#0b1120"/>
    <path d="M -215,0 C -215,120 215,120 215,0 L 215,20 C 215,140 -215,140 -215,20 Z" fill="url(#statorRim3D)"/>

    <!-- Stator Main Body Outer Ring -->
    <circle cx="0" cy="0" r="215" fill="url(#statorOuterGrad)" stroke="#64748b" stroke-width="3"/>
    <!-- Stator Inner Bore -->
    <circle cx="0" cy="0" r="145" fill="url(#statorInnerGrad)" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Stator Laminated Core Texture / Teeth Details -->
    <g opacity="0.35" stroke="#000" stroke-width="2">
      <line x1="0" y1="-215" x2="0" y2="-145" />
      <line x1="186" y1="-107" x2="125" y2="-72" />
      <line x1="186" y1="107" x2="125" y2="72" />
      <line x1="0" y1="215" x2="0" y2="145" />
      <line x1="-186" y1="107" x2="-125" y2="72" />
      <line x1="-186" y1="-107" x2="-125" y2="-72" />
    </g>

    <!-- Angle Guide Circles & Radial 120-degree guides -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#475569" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-145" stroke="#f87171" stroke-dasharray="5,3" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="125.6" y2="72.5" stroke="#4ade80" stroke-dasharray="5,3" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="-125.6" y2="72.5" stroke="#38bdf8" stroke-dasharray="5,3" stroke-width="1.5" opacity="0.8"/>

    <!-- Angle Arc 120° Indicator -->
    <path d="M 0,-50 A 50 50 0 0,1 43.3,25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="32" y="-18" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">120°</text>

    <path d="M 43.3,25 A 50 50 0 0,1 -43.3,25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="0" y="65" text-anchor="middle" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">120°</text>

    <!-- ==================== 3D STATOR COILS ==================== -->
    <!-- COIL 1 (Pha 1) -->
    <g transform="translate(0, -145)" filter="url(#coilShadow)">
      <path d="M -22, -45 L 22, -45 L 28, 15 L -28, 15 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="-32" y="-35" width="64" height="42" rx="10" fill="url(#coil1Grad)" stroke="#fca5a5" stroke-width="2"/>
      <line x1="-30" y1="-26" x2="30" y2="-26" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-2" x2="30" y2="-2" stroke="#fecaca" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="-14" r="14" fill="#991b1b" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-9" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900">1</text>
    </g>

    <!-- COIL 2 (Pha 2) -->
    <g transform="translate(125.6, 72.5) rotate(120)" filter="url(#coilShadow)">
      <path d="M -22, -45 L 22, -45 L 28, 15 L -28, 15 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="-32" y="-35" width="64" height="42" rx="10" fill="url(#coil2Grad)" stroke="#86efac" stroke-width="2"/>
      <line x1="-30" y1="-26" x2="30" y2="-26" stroke="#bbf7d0" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#bbf7d0" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#bbf7d0" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-2" x2="30" y2="-2" stroke="#bbf7d0" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="-14" r="14" fill="#166534" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-9" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" transform="rotate(-120, 0, -14)">2</text>
    </g>

    <!-- COIL 3 (Pha 3) -->
    <g transform="translate(-125.6, 72.5) rotate(240)" filter="url(#coilShadow)">
      <path d="M -22, -45 L 22, -45 L 28, 15 L -28, 15 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="-32" y="-35" width="64" height="42" rx="10" fill="url(#coil3Grad)" stroke="#7dd3fc" stroke-width="2"/>
      <line x1="-30" y1="-26" x2="30" y2="-26" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
      <line x1="-30" y1="-2" x2="30" y2="-2" stroke="#bae6fd" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="-14" r="14" fill="#075985" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-9" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" transform="rotate(-240, 0, -14)">3</text>
    </g>

    <!-- ==================== 3D ROTOR MAGNET ==================== -->
    <g transform="rotate(-30)" filter="url(#shadow3D)">
      <path d="M -35,-85 L -35,85 L -20,95 L -20,-75 Z" fill="url(#rotorSide3D)"/>
      <path d="M 35,-85 L 35,85 L 50,95 L 50,-75 Z" fill="url(#rotorSide3D)"/>

      <path d="M -35,-85 L 35,-85 L 35,0 L -35,0 Z" fill="url(#rotorNorth)" stroke="#fca5a5" stroke-width="1.5"/>
      <path d="M -35,0 L 35,0 L 35,85 L -35,85 Z" fill="url(#rotorSouth)" stroke="#93c5fd" stroke-width="1.5"/>

      <path d="M -35,-85 C -15,-98 15,-98 35,-85 Z" fill="#b91c1c"/>
      <path d="M -35,85 C -15,98 15,98 35,85 Z" fill="#1e3a8a"/>

      <circle cx="0" cy="0" r="26" fill="url(#shaftGrad)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

      <text x="0" y="-45" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" filter="url(#glowEffect)">N</text>
      <text x="0" y="58" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" filter="url(#glowEffect)">S</text>
    </g>

    <path d="M -70,-55 A 90 90 0 0,1 60,-70" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" marker-end="url(#rotArrow)"/>
    <text x="0" y="-85" text-anchor="middle" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900">ω</text>
  </g>

  <!-- ==================== LABELS & CALLOUT CARDS ==================== -->
  <rect x="25" y="20" width="800" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="425" y="48" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">
    SƠ ĐỒ CẤU TẠO MÁY PHÁT ĐIỆN XOAY CHIỀU 3 PHA (3D)
  </text>

  <!-- Callout 1: STATO (Cuộn dây) -->
  <g transform="translate(35, 95)">
    <rect width="215" height="115" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3D)"/>
    <rect x="0" y="0" width="215" height="34" rx="12" fill="#0284c7"/>
    <text x="107" y="23" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900">STATO (PHẦN ỨNG)</text>
    <text x="12" y="58" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• 3 cuộn dây giống hệt nhau</text>
    <text x="12" y="80" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• Đặt lệch nhau 120° (2π/3)</text>
    <text x="12" y="102" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• Đứng yên trên vành tròn</text>
    <path d="M 215,55 L 290,110 L 340,135" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Callout 2: RÔTO (Nam châm) -->
  <g transform="translate(35, 400)">
    <rect width="215" height="115" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow3D)"/>
    <rect x="0" y="0" width="215" height="34" rx="12" fill="#d97706"/>
    <text x="107" y="23" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900">RÔTO (PHẦN CẢM)</text>
    <text x="12" y="58" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• Là 1 nam châm điện / v.cửu</text>
    <text x="12" y="80" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• Quay đều quanh trục (tốc độ ω)</text>
    <text x="12" y="102" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">• Tạo ra từ trường quay</text>
    <path d="M 215,430 L 290,380 L 340,310" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>

  <!-- Callout 3: 3 PHA ĐẦU RA (Outputs) -->
  <g transform="translate(620, 150)">
    <rect width="205" height="265" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#shadow3D)"/>
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#334155"/>
    <text x="102" y="24" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900">3 SUẤT ĐIỆN ĐỘNG</text>
    
    <rect x="12" y="48" width="181" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="70" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800">Pha 1 (e₁):</text>
    <text x="20" y="94" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">e₁ = E₀cos(ωt)</text>

    <rect x="12" y="118" width="181" height="60" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="20" y="140" fill="#86efac" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800">Pha 2 (e₂):</text>
    <text x="20" y="164" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">e₂ = E₀cos(ωt - 2π/3)</text>

    <rect x="12" y="188" width="181" height="60" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="20" y="210" fill="#7dd3fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800">Pha 3 (e₃):</text>
    <text x="20" y="234" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="700">e₃ = E₀cos(ωt + 2π/3)</text>
  </g>

  <path d="M 405,140 C 480,100 540,175 620,175" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 495,335 C 540,320 570,248 620,248" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 265,335 C 320,420 560,420 620,318" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6,4"/>

</svg>
