<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <!-- Markers -->
    <marker id="arrAxis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    
    <!-- Gradient for trendline -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background Box -->
  <rect width="100%" height="100%" fill="#ffffff" rx="14" />
  <rect x="1" y="1" width="538" height="378" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="14" />

  <!-- PLOT AREA: Origin O at (75, 310) -->
  <g>
    <!-- Coordinate Grid (Lưới toạ độ nhạt) -->
    <g stroke="#f1f5f9" stroke-width="1.2">
      <!-- Vertical Grid Lines -->
      <line x1="135" y1="45" x2="135" y2="310" />
      <line x1="195" y1="45" x2="195" y2="310" />
      <line x1="255" y1="45" x2="255" y2="310" />
      <line x1="315" y1="45" x2="315" y2="310" />
      <line x1="375" y1="45" x2="375" y2="310" />
      <line x1="435" y1="45" x2="435" y2="310" />

      <!-- Horizontal Grid Lines -->
      <line x1="75" y1="268" x2="465" y2="268" />
      <line x1="75" y1="226" x2="465" y2="226" />
      <line x1="75" y1="184" x2="465" y2="184" />
      <line x1="75" y1="142" x2="465" y2="142" />
      <line x1="75" y1="100" x2="465" y2="100" />
      <line x1="75" y1="58" x2="465" y2="58" />
    </g>

    <!-- Axes -->
    <!-- X Axis: I (A) -->
    <line x1="75" y1="310" x2="480" y2="310" stroke="#1e293b" stroke-width="2" marker-end="url(#arrAxis)" />
    <text x="486" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e293b">I (A)</text>

    <!-- Y Axis: F (mN) -->
    <line x1="75" y1="310" x2="75" y2="30" stroke="#1e293b" stroke-width="2" marker-end="url(#arrAxis)" />
    <text x="75" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">F (mN)</text>

    <!-- Origin O -->
    <text x="58" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e293b">O</text>

    <!-- X-Axis Ticks & Labels -->
    <!-- 0.5 -->
    <line x1="135" y1="307" x2="135" y2="313" stroke="#64748b" stroke-width="1.5" />
    <text x="135" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">0,5</text>

    <!-- 1.0 -->
    <line x1="195" y1="306" x2="195" y2="314" stroke="#1e293b" stroke-width="1.5" />
    <text x="195" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">1,0</text>

    <!-- 1.5 -->
    <line x1="255" y1="307" x2="255" y2="313" stroke="#64748b" stroke-width="1.5" />
    <text x="255" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">1,5</text>

    <!-- 2.0 -->
    <line x1="315" y1="306" x2="315" y2="314" stroke="#1e293b" stroke-width="1.5" />
    <text x="315" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">2,0</text>

    <!-- 2.5 (ĐẶC BIỆT CỦA ĐỀ BÀI) -->
    <line x1="375" y1="305" x2="375" y2="315" stroke="#dc2626" stroke-width="2" />
    <rect x="358" y="316" width="34" height="19" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="375" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#dc2626" text-anchor="middle">2,5</text>

    <!-- 3.0 -->
    <line x1="435" y1="306" x2="435" y2="314" stroke="#1e293b" stroke-width="1.5" />
    <text x="435" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">3,0</text>

    <!-- Y-Axis Ticks & Labels -->
    <!-- 2 -->
    <line x1="71" y1="268" x2="77" y2="268" stroke="#64748b" stroke-width="1.5" />
    <text x="64" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">2</text>

    <!-- 4 -->
    <line x1="70" y1="226" x2="78" y2="226" stroke="#1e293b" stroke-width="1.5" />
    <text x="64" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="end">4</text>

    <!-- 6 -->
    <line x1="71" y1="184" x2="77" y2="184" stroke="#64748b" stroke-width="1.5" />
    <text x="64" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="end">6</text>

    <!-- 8 -->
    <line x1="70" y1="142" x2="78" y2="142" stroke="#1e293b" stroke-width="1.5" />
    <text x="64" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="end">8</text>

    <!-- 10 (ĐẶC BIỆT CỦA ĐỀ BÀI) -->
    <line x1="69" y1="100" x2="79" y2="100" stroke="#dc2626" stroke-width="2" />
    <rect x="38" y="90" width="30" height="20" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
    <text x="53" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#dc2626" text-anchor="middle">10</text>

    <!-- 12 -->
    <line x1="70" y1="58" x2="78" y2="58" stroke="#1e293b" stroke-width="1.5" />
    <text x="64" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="end">12</text>

    <!-- Projection Lines for Point (2.5 A ; 10 mN) -->
    <line x1="375" y1="100" x2="375" y2="310" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" />
    <line x1="75" y1="100" x2="375" y2="100" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" />

    <!-- Trendline: Straight line through origin (75, 310) to (445, 45) -->
    <line x1="75" y1="310" x2="455" y2="54" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Experimental Points -->
    <circle cx="75" cy="310" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="195" cy="226" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="315" cy="142" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />

    <!-- Key Point M (2.5 A ; 10 mN) -->
    <circle cx="375" cy="100" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Coordinate badge at (2.5 ; 10) -->
    <g transform="translate(315, 60)">
      <rect width="120" height="24" rx="5" fill="#1e293b" stroke="#ffffff" stroke-width="1" />
      <text x="60" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
        (2,5 A ; 10 mN)
      </text>
    </g>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(415, 350)">
    <rect width="110" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="55" y="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">
      vatli102.com
    </text>
  </g>
</svg>
