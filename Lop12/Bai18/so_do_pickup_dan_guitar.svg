<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <!-- Guitar Body Gradient -->
        <linearGradient id="guitarBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="40%" stop-color="#b91c1c"/>
            <stop offset="100%" stop-color="#450a0a"/>
        </linearGradient>

        <!-- Magnet Gradients -->
        <linearGradient id="magNorth" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="50%" stop-color="#f87171"/>
            <stop offset="100%" stop-color="#dc2626"/>
        </linearGradient>
        <linearGradient id="magSouth" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="50%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <!-- Copper Coil Gradient -->
        <linearGradient id="copperCoil" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>

        <!-- String Gradient -->
        <linearGradient id="stringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#cbd5e1"/>
            <stop offset="50%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Markers -->
        <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
        </marker>
        <marker id="arrowVibe" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
        </marker>
        <marker id="arrowSig" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
        </marker>
    </defs>

    <!-- Nền Bao Ngoài -->
    <rect width="920" height="450" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(460, 28)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="0.5">CẤU TẠO VÀ NGUYÊN LÝ BỘ CẢM ÂM PICKUP ĐÀN GHI TA ĐIỆN</text>
        <line x1="-180" y1="10" x2="180" y2="10" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- ============================================================== -->
    <!-- PHẦN BÊN TRÁI: HÌNH ẢNH CÂY ĐÀN GUITAR ĐIỆN VÀ VỊ TRÍ PICKUP -->
    <!-- ============================================================== -->
    <g transform="translate(35, 65)" filter="url(#shadow)">
        <rect x="0" y="0" width="370" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="0" y="0" width="370" height="32" rx="14" fill="#f1f5f9"/>
        <text x="185" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#334155">1. ĐÀN GHI TA ĐIỆN &amp; VỊ TRÍ BỘ PICKUP</text>

        <!-- Vẽ cây đàn Guitar điện nằm nghiêng -->
        <g transform="translate(20, 42)">
            <!-- Thân đàn (Guitar Body) -->
            <path d="M 80 140 C 40 180, 20 120, 50 80 C 70 50, 110 50, 140 80 C 180 60, 210 100, 190 140 C 170 180, 120 180, 80 140 Z" fill="url(#guitarBodyGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
            <!-- Tấm ốp bảo vệ (Pickguard) màu trắng -->
            <path d="M 85 130 C 65 150, 50 120, 70 90 C 85 70, 115 70, 130 90 C 155 80, 165 110, 150 135 C 135 155, 105 150, 85 130 Z" fill="#f8fafc" stroke="#e2e8f0"/>

            <!-- Cần đàn (Neck) vươn sang trái-trên -->
            <polygon points="120,80 130,85 240,25 235,15" fill="#d97706" stroke="#92400e" stroke-width="1"/>
            <!-- Đầu đàn (Headstock) -->
            <polygon points="235,15 240,25 260,15 255,5" fill="#b45309" stroke="#78350f"/>
            <!-- Các khóa đàn -->
            <circle cx="242" cy="12" r="2.5" fill="#cbd5e1"/>
            <circle cx="248" cy="10" r="2.5" fill="#cbd5e1"/>
            <circle cx="254" cy="8" r="2.5" fill="#cbd5e1"/>

            <!-- 6 Dây đàn kim loại (Guitar Strings) -->
            <line x1="90" y1="130" x2="250" y2="12" stroke="#64748b" stroke-width="1.2"/>
            <line x1="92" y1="132" x2="252" y2="14" stroke="#64748b" stroke-width="1.2"/>
            <line x1="94" y1="134" x2="254" y2="16" stroke="#64748b" stroke-width="1.2"/>

            <!-- CÁC BỘ CẢM ÂM PICKUP TRÊN THÂN ĐÀN -->
            <!-- Pickup Neck -->
            <rect x="122" y="85" width="22" height="10" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
            <circle cx="127" cy="90" r="1.5" fill="#cbd5e1"/>
            <circle cx="133" cy="90" r="1.5" fill="#cbd5e1"/>
            <circle cx="139" cy="90" r="1.5" fill="#cbd5e1"/>

            <!-- Pickup Middle -->
            <rect x="110" y="100" width="22" height="10" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
            <circle cx="115" cy="105" r="1.5" fill="#cbd5e1"/>
            <circle cx="121" cy="105" r="1.5" fill="#cbd5e1"/>
            <circle cx="127" cy="105" r="1.5" fill="#cbd5e1"/>

            <!-- Pickup Bridge (khoanh đỏ nổi bật) -->
            <rect x="98" y="115" width="22" height="10" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
            <circle cx="103" cy="120" r="1.5" fill="#cbd5e1"/>
            <circle cx="109" cy="120" r="1.5" fill="#cbd5e1"/>
            <circle cx="115" cy="120" r="1.5" fill="#cbd5e1"/>

            <!-- Khung phóng to chỉ vào Pickup -->
            <circle cx="109" cy="120" r="18" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 127 120 L 210 140" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

            <!-- Núm xoay volume / tone -->
            <circle cx="85" cy="155" r="5" fill="#e2e8f0" stroke="#64748b"/>
            <circle cx="100" cy="160" r="5" fill="#e2e8f0" stroke="#64748b"/>

            <!-- Dây cáp tín hiệu ra Ampli -->
            <path d="M 130 170 C 150 200, 180 180, 220 195" fill="none" stroke="#8b5cf6" stroke-width="3"/>
            <path d="M 215 195 L 225 195" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrowSig)"/>

            <!-- Hộp Ampli & Loa thu nhỏ -->
            <g transform="translate(230, 160)">
                <rect x="0" y="0" width="85" height="50" rx="6" fill="#1e293b" stroke="#64748b"/>
                <circle cx="25" cy="25" r="15" fill="#0f172a" stroke="#475569"/>
                <circle cx="25" cy="25" r="6" fill="#94a3b8"/>
                <text x="56" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#a78bfa">AMPLI &amp;</text>
                <text x="56" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#a78bfa">LOA</text>
            </g>

            <!-- Chú thích vị trí -->
            <rect x="200" y="125" width="130" height="26" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
            <text x="265" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#b91c1c">Bộ cảm âm (Pickup)</text>
        </g>
    </g>

    <!-- ============================================================== -->
    <!-- PHẦN BÊN PHẢI: PHÓNG TO CHI TIẾT CẤU TẠO VÀ NGUYÊN LÝ PICKUP -->
    <!-- ============================================================== -->
    <g transform="translate(425, 65)" filter="url(#shadow)">
        <rect x="0" y="0" width="460" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="0" y="0" width="460" height="32" rx="14" fill="#eff6ff"/>
        <text x="230" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#1e40af">2. CHI TIẾT CẤU TẠO &amp; HIỆN TƯỢNG CẢM ỨNG TRONG PICKUP</text>

        <g transform="translate(25, 45)">
            <!-- 1. DÂY ĐÀN BẰNG THÉP (Steel String) -->
            <!-- Dây đàn ở giữa -->
            <line x1="20" y1="25" x2="390" y2="25" stroke="url(#stringGrad)" stroke-width="6" stroke-linecap="round"/>
            <!-- Dây đàn dao động nét đứt -->
            <path d="M 20 25 Q 205 10 390 25" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
            <path d="M 20 25 Q 205 40 390 25" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
            <!-- Mũi tên dao động hai chiều -->
            <line x1="205" y1="5" x2="205" y2="0" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowVibe)"/>
            <line x1="205" y1="45" x2="205" y2="50" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowVibe)"/>
            
            <!-- Nhãn Dây đàn thép -->
            <rect x="235" y="6" width="165" height="22" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
            <text x="317" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">Dây đàn thép (bị từ hóa)</text>

            <!-- 2. ĐƯỜNG SỨC TỪ CỦA TỪ TRƯỜNG B -->
            <path d="M 180 80 C 140 40, 150 10, 205 12" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 3"/>
            <path d="M 205 12 L 205 16" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrowB)"/>
            <path d="M 230 80 C 270 40, 260 10, 205 12" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="4 3"/>

            <!-- 3. LÕI NAM CHÂM VĨNH CỬU (Permanent Magnet) -->
            <g transform="translate(180, 70)">
                <!-- Cực Bắc N (Đỏ) -->
                <rect x="0" y="0" width="50" height="40" rx="4" fill="url(#magNorth)" stroke="#b91c1c"/>
                <text x="25" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff">N</text>
                
                <!-- Cực Nam S (Xanh) -->
                <rect x="0" y="40" width="50" height="40" rx="4" fill="url(#magSouth)" stroke="#1d4ed8"/>
                <text x="25" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff">S</text>
            </g>

            <!-- 4. CUỘN DÂY CẢM ỨNG (Coil) QUẤN QUANH NAM CHÂM -->
            <g transform="translate(160, 80)">
                <!-- Vòng 1 -->
                <rect x="0" y="0" width="90" height="10" rx="5" fill="url(#copperCoil)" stroke="#92400e" stroke-width="1"/>
                <!-- Vòng 2 -->
                <rect x="0" y="14" width="90" height="10" rx="5" fill="url(#copperCoil)" stroke="#92400e" stroke-width="1"/>
                <!-- Vòng 3 -->
                <rect x="0" y="28" width="90" height="10" rx="5" fill="url(#copperCoil)" stroke="#92400e" stroke-width="1"/>
                <!-- Vòng 4 -->
                <rect x="0" y="42" width="90" height="10" rx="5" fill="url(#copperCoil)" stroke="#92400e" stroke-width="1"/>

                <!-- Dây dẫn ra tín hiệu xoay chiều -->
                <path d="M 0 5 L -80 5" fill="none" stroke="#d97706" stroke-width="2.5"/>
                <path d="M 0 47 L -80 47" fill="none" stroke="#d97706" stroke-width="2.5"/>
            </g>

            <!-- Hộp tín hiệu đầu ra xoay chiều (AC Signal Output) -->
            <g transform="translate(15, 85)">
                <rect x="0" y="0" width="135" height="50" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
                <text x="67.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#6b21a8">Tín hiệu cảm ứng:</text>
                <text x="67.5" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#7c3aed">e(t) → Đến Ampli</text>
            </g>

            <!-- Chú thích Cuộn dây & Nam châm -->
            <g transform="translate(260, 85)">
                <rect x="0" y="0" width="145" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
                <text x="72.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#b45309">Cuộn dây cảm ứng</text>
                <text x="72.5" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#475569">(Hàng ngàn vòng dây)</text>
                <text x="72.5" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#1e40af">Nam châm vĩnh cửu</text>
            </g>
        </g>
    </g>

    <!-- ============================================================== -->
    <!-- KHUNG TÓM TẮT 4 BƯỚC NGUYÊN LÝ VẬT LÍ Ở ĐÁY -->
    <!-- ============================================================== -->
    <g transform="translate(35, 335)">
        <rect x="0" y="0" width="850" height="85" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
        
        <text x="425" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#065f46">
            CHU TRÌNH BIẾN ĐỔI DAO ĐỘNG CƠ HỌC THÀNH TÍN HIỆU ÂM THANH:
        </text>

        <!-- 4 Bước nối tiếp -->
        <g transform="translate(15, 35)">
            <!-- Bước 1 -->
            <rect x="0" y="0" width="195" height="38" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="97.5" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#047857">1. Nam châm từ hóa dây</text>
            <text x="97.5" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#475569">Dây thép thành nam châm nhỏ</text>

            <!-- Mũi tên 1->2 -->
            <text x="201" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#059669">→</text>

            <!-- Bước 2 -->
            <rect x="210" y="0" width="195" height="38" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="307.5" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#047857">2. Gảy đàn → Dây dao động</text>
            <text x="307.5" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#475569">Từ thông qua cuộn dây biến thiên</text>

            <!-- Mũi tên 2->3 -->
            <text x="411" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#059669">→</text>

            <!-- Bước 3 -->
            <rect x="420" y="0" width="195" height="38" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="517.5" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#047857">3. Cảm ứng điện từ sinh e(t)</text>
            <text x="517.5" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#475569">Dòng xoay chiều cùng tần số âm</text>

            <!-- Mũi tên 3->4 -->
            <text x="621" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#059669">→</text>

            <!-- Bước 4 -->
            <rect x="630" y="0" width="190" height="38" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="725" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#047857">4. Khuếch đại qua Ampli</text>
            <text x="725" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#475569">Phát ra sóng âm thanh ở Loa</text>
        </g>
    </g>

    <!-- Watermark -->
    <text x="900" y="438" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
