<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <!-- Pot Gradient -->
        <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="50%" stop-color="#64748b"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>

        <!-- Heat Gradient -->
        <linearGradient id="heatGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="60%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#eab308"/>
        </linearGradient>

        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <linearGradient id="coilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>

        <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
        </marker>
    </defs>

    <rect width="880" height="410" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(440, 26)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5">NGUYÊN LÝ HOẠT ĐỘNG VÀ SINH NHIỆT CỦA BẾP CẢM ỨNG TỪ</text>
        <line x1="-160" y1="8" x2="160" y2="8" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- KHU VỰC CẮT BỔ CHI TIẾT BẾP TỪ VÀ NỒI NẤU -->
    <g transform="translate(230, 55)" filter="url(#shadow)">
        <!-- 1. NỒI NẤU KIM LOẠI NHIỄM TỪ (FERROMAGNETIC POT) -->
        <g transform="translate(40, 0)">
            <!-- Thân nồi -->
            <path d="M 10 30 L 25 110 Q 160 120 295 110 L 310 30 Z" fill="url(#potGrad)" stroke="#1e293b" stroke-width="1.5"/>
            <!-- Nước / Thức ăn bên trong đang sôi có bong bóng -->
            <path d="M 20 60 Q 160 65 300 60 L 290 108 Q 160 118 30 108 Z" fill="#38bdf8" opacity="0.35"/>
            <circle cx="90" cy="80" r="4" fill="#ffffff" opacity="0.7"/>
            <circle cx="160" cy="75" r="5" fill="#ffffff" opacity="0.7"/>
            <circle cx="230" cy="82" r="3.5" fill="#ffffff" opacity="0.7"/>
            <!-- Vung nồi & Quai nồi -->
            <path d="M -5 45 Q 10 35 15 50" fill="none" stroke="#475569" stroke-width="4"/>
            <path d="M 325 45 Q 310 35 305 50" fill="none" stroke="#475569" stroke-width="4"/>

            <!-- ĐÁY NỒI BẰNG VẬT LIỆU TỪ TÍNH (ĐỎ RỰC TỎA NHIỆT) -->
            <rect x="22" y="108" width="276" height="14" rx="4" fill="url(#heatGrad)" stroke="#b91c1c" stroke-width="1.2"/>
            
            <!-- CÁC XOÁY DÒNG ĐIỆN FOUCAULT TRONG ĐÁY NỒI -->
            <g transform="translate(50, 110)">
                <ellipse cx="40" cy="5" rx="28" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
                <ellipse cx="110" cy="5" rx="28" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
                <ellipse cx="180" cy="5" rx="28" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
            </g>

            <rect x="75" y="72" width="170" height="24" rx="6" fill="#fef2f2" stroke="#ef4444"/>
            <text x="160" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#dc2626">Dòng xoáy Foucault sinh nhiệt</text>
        </g>

        <!-- 2. MẶT KÍNH CÁCH ĐIỆN CHỊU NHIỆT (CERAMIC GLASS) -->
        <g transform="translate(0, 126)">
            <rect x="0" y="0" width="400" height="12" rx="4" fill="url(#glassGrad)" stroke="#475569" stroke-width="1"/>
            <text x="20" y="-4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#475569">Mặt kính cách điện chịu nhiệt</text>
        </g>

        <!-- 3. TỪ TRƯỜNG BIẾN THIÊN B(t) XUYÊN QUA ĐÁY NỒI -->
        <g transform="translate(40, 140)">
            <path d="M 60 40 C 60 10, 80 -25, 95 -35" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 95 -35 L 95 -32" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowB)"/>

            <path d="M 160 40 C 160 10, 160 -25, 160 -35" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 160 -35 L 160 -32" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowB)"/>

            <path d="M 260 40 C 260 10, 240 -25, 225 -35" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 225 -35 L 225 -32" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowB)"/>
        </g>

        <!-- 4. CUỘN DÂY CẢM ỨNG TỪ BÊN DƯỚI MẶT KÍNH (INDUCTION COIL) -->
        <g transform="translate(60, 145)">
            <!-- Các vòng dây đồng xoắn ốc -->
            <ellipse cx="140" cy="15" rx="130" ry="12" fill="none" stroke="url(#coilGrad)" stroke-width="4"/>
            <ellipse cx="140" cy="15" rx="100" ry="9" fill="none" stroke="url(#coilGrad)" stroke-width="3.5"/>
            <ellipse cx="140" cy="15" rx="70" ry="6" fill="none" stroke="url(#coilGrad)" stroke-width="3"/>
            <ellipse cx="140" cy="15" rx="40" ry="4" fill="none" stroke="url(#coilGrad)" stroke-width="2.5"/>

            <rect x="65" y="32" width="150" height="20" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
            <text x="140" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#b45309">Cuộn dây cảm ứng (20-50 kHz)</text>
        </g>
    </g>

    <!-- THẺ CHÚ THÍCH TRÁI: ĐIỀU KIỆN NỒI NẤU -->
    <g transform="translate(35, 60)" filter="url(#shadow)">
        <rect x="0" y="0" width="175" height="195" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
        <rect x="0" y="0" width="175" height="26" rx="10" fill="#fef2f2"/>
        <text x="87.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#dc2626">1. ĐÁY NỒI NHIỄM TỪ</text>
        <text x="10" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Đáy làm bằng vật liệu</text>
        <text x="15" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">từ tính (thép, gang, inox).</text>
        <text x="10" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Khi từ trường B(t) đi qua,</text>
        <text x="15" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ea580c">sinh dòng xoáy Foucault.</text>
        <text x="10" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Tỏa nhiệt Joule - Lenz</text>
        <text x="15" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#dc2626">Q = I²·R·t làm nóng trực tiếp.</text>
        <text x="10" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748b">→ Nồi thủy tinh không nóng!</text>
    </g>

    <!-- THẺ CHÚ THÍCH PHẢI: ƯU ĐIỂM VƯỢT TRỘI -->
    <g transform="translate(670, 60)" filter="url(#shadow)">
        <rect x="0" y="0" width="175" height="195" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
        <rect x="0" y="0" width="175" height="26" rx="10" fill="#ecfdf5"/>
        <text x="87.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857">2. ƯU ĐIỂM CỦA BẾP TỪ</text>
        <text x="10" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Hiệu suất cực cao (≥ 90%):</text>
        <text x="15" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">Nhiệt sinh ngay tại đáy nồi,</text>
        <text x="15" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">ít thất thoát ra môi trường.</text>
        <text x="10" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ An toàn, không khói lửa:</text>
        <text x="15" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">Mặt kính không tự nung nóng,</text>
        <text x="15" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">chỉ ấm do nhiệt đáy nồi truyền.</text>
        <text x="10" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Nấu chín thức ăn siêu nhanh.</text>
    </g>

    <!-- BANNER NGUYÊN LÝ Ở ĐÁY -->
    <g transform="translate(35, 275)">
        <rect x="0" y="0" width="810" height="95" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="405" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#065f46">
            BẢN CHẤT VẬT LÍ: DÒNG ĐIỆN XOÁY FOUCAULT TRONG KHỐI KIM LOẠI ĐÁY NỒI
        </text>

        <g transform="translate(20, 36)">
            <rect x="0" y="0" width="770" height="46" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="385" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">
                Dòng điện cao tần qua cuộn dây → Sinh từ trường B(t) biến thiên xuyên qua đáy nồi
            </text>
            <text x="385" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#dc2626">
                → Xuất hiện dòng điện xoáy Foucault cực mạnh tỏa nhiệt Joule - Lenz nung nóng trực tiếp đáy nồi!
            </text>
        </g>
    </g>

    <text x="860" y="398" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
