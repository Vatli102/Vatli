<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f1f5f9"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>

        <linearGradient id="coilTx" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <linearGradient id="coilRx" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>

        <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <marker id="arrowFlux" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
        </marker>
    </defs>

    <rect width="880" height="400" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(440, 26)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5">NGUYÊN LÝ CÔNG NGHỆ SẠC KHÔNG DÂY (WIRELESS CHARGING)</text>
        <line x1="-160" y1="8" x2="160" y2="8" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- KHU VỰC MINH HỌA CHÍNH (ĐIỆN THOẠI VÀ ĐẾ SẠC) -->
    <g transform="translate(240, 60)" filter="url(#shadow)">
        <!-- 1. ĐIỆN THOẠI DI ĐỘNG (BỘ THU NĂNG LƯỢNG - RECEIVER) -->
        <rect x="0" y="0" width="400" height="95" rx="14" fill="url(#phoneGrad)" stroke="#475569" stroke-width="1.5"/>
        <rect x="15" y="15" width="370" height="65" rx="8" fill="#1e293b"/>
        
        <!-- Màn hình điện thoại hiển thị Pin sạc -->
        <text x="35" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94a3b8">ĐIỆN THOẠI</text>
        <!-- Icon pin màu xanh lá -->
        <rect x="35" y="50" width="40" height="18" rx="3" fill="none" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="37" y="52" width="28" height="14" rx="2" fill="#22c55e"/>
        <rect x="76" y="55" width="3" height="8" rx="1" fill="#22c55e"/>
        <text x="85" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#22c55e">75% Sạc...</text>

        <!-- Cuộn dây thu (Rx Coil) trong mặt lưng điện thoại -->
        <g transform="translate(190, 48)">
            <ellipse cx="60" cy="0" rx="55" ry="12" fill="none" stroke="url(#coilRx)" stroke-width="4"/>
            <ellipse cx="60" cy="0" rx="42" ry="9" fill="none" stroke="url(#coilRx)" stroke-width="3"/>
            <ellipse cx="60" cy="0" rx="28" ry="6" fill="none" stroke="url(#coilRx)" stroke-width="2.5"/>
            <rect x="25" y="-18" width="70" height="16" rx="4" fill="#ecfdf5" stroke="#10b981"/>
            <text x="60" y="-6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#047857">Cuộn thu (Rx)</text>
        </g>

        <!-- Mạch chỉnh lưu nạp pin (AC -> DC) -->
        <g transform="translate(315, 25)">
            <rect x="0" y="0" width="60" height="45" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
            <text x="30" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#a7f3d0">Chỉnh lưu</text>
            <text x="30" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">AC → DC</text>
        </g>

        <!-- KHE HỞ KHÔNG KHÍ & TỪ TRƯỜNG BIẾN THIÊN B(t) -->
        <g transform="translate(190, 105)">
            <!-- Các đường sức từ tím uốn cong nối 2 cuộn dây -->
            <path d="M 25 15 C 10 3, 10 -15, 25 -25" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 25 -25 L 25 -22" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFlux)"/>

            <path d="M 60 15 C 50 3, 50 -15, 60 -25" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 60 -25 L 60 -22" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFlux)"/>

            <path d="M 95 15 C 110 3, 110 -15, 95 -25" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2"/>
            <path d="M 95 -25 L 95 -22" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFlux)"/>

            <!-- Nhãn Từ trường biến thiên -->
            <rect x="0" y="-12" width="120" height="20" rx="5" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
            <text x="60" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#7c3aed">Từ trường biến thiên B(t)</text>
        </g>

        <!-- 2. ĐẾ SẠC KHÔNG DÂY (BỘ PHÁT NĂNG LƯỢNG - TRANSMITTER) -->
        <g transform="translate(0, 115)">
            <rect x="0" y="0" width="400" height="65" rx="12" fill="url(#padGrad)" stroke="#94a3b8" stroke-width="1.5"/>
            
            <text x="35" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#334155">ĐẾ SẠC (PAD)</text>

            <!-- Cuộn dây phát (Tx Coil) trong đế sạc -->
            <g transform="translate(190, 32)">
                <ellipse cx="60" cy="0" rx="55" ry="12" fill="none" stroke="url(#coilTx)" stroke-width="4"/>
                <ellipse cx="60" cy="0" rx="42" ry="9" fill="none" stroke="url(#coilTx)" stroke-width="3"/>
                <ellipse cx="60" cy="0" rx="28" ry="6" fill="none" stroke="url(#coilTx)" stroke-width="2.5"/>
                <rect x="25" y="4" width="70" height="16" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
                <text x="60" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#1d4ed8">Cuộn phát (Tx)</text>
            </g>

            <!-- Cổng nguồn vào AC cao tần -->
            <g transform="translate(315, 12)">
                <rect x="0" y="0" width="60" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
                <text x="30" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">Nguồn vào</text>
                <text x="30" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#2563eb">AC Cao tần</text>
            </g>
        </g>
    </g>

    <!-- THẺ CHÚ THÍCH TRÁI: BỘ PHÁT (ĐẾ SẠC) -->
    <g transform="translate(40, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="180" height="165" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
        <rect x="0" y="0" width="180" height="26" rx="10" fill="#eff6ff"/>
        <text x="90" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">1. ĐẾ SẠC (BỘ PHÁT)</text>
        <text x="12" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Nối nguồn điện xoay chiều.</text>
        <text x="12" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Dòng AC cao tần chạy qua</text>
        <text x="18" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">cuộn dây phát (Tx).</text>
        <text x="12" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Sinh ra từ trường biến thiên</text>
        <text x="18" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed">B(t) tỏa vào không gian.</text>
    </g>

    <!-- THẺ CHÚ THÍCH PHẢI: BỘ THU (ĐIỆN THOẠI) -->
    <g transform="translate(660, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="180" height="165" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
        <rect x="0" y="0" width="180" height="26" rx="10" fill="#ecfdf5"/>
        <text x="90" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857">2. ĐIỆN THOẠI (BỘ THU)</text>
        <text x="12" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Từ trường B(t) đi xuyên qua</text>
        <text x="18" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#059669">cuộn dây thu (Rx).</text>
        <text x="12" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Xuất hiện suất điện động</text>
        <text x="18" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#059669">cảm ứng xoay chiều e(t).</text>
        <text x="12" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#334155">• Chỉnh lưu AC → DC nạp pin.</text>
    </g>

    <!-- BANNER NGUYÊN LÝ Ở ĐÁY -->
    <g transform="translate(40, 290)">
        <rect x="0" y="0" width="800" height="85" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="400" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0f172a">BẢN CHẤT VẬT LÍ: HIỆN TƯỢNG HỖ CẢM (CẢM ỨNG ĐIỆN TỪ KHÔNG DÂY)</text>
        
        <g transform="translate(20, 38)">
            <rect x="0" y="0" width="760" height="34" rx="6" fill="#ecfdf5" stroke="#10b981"/>
            <text x="380" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#065f46">
                Dòng điện xoay chiều ở cuộn phát (Đế sạc) → Tạo từ thông biến thiên qua cuộn thu (Điện thoại) → Sinh dòng điện cảm ứng sạc Pin.
            </text>
        </g>
    </g>

    <text x="860" y="388" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
