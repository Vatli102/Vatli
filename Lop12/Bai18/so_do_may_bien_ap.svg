<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
    <defs>
        <!-- Nền Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f1f5f9"/>
        </linearGradient>

        <!-- Gradient Lõi Thép Silicon Kỹ Thuật Điện 3D -->
        <linearGradient id="ironCoreFace" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="30%" stop-color="#64748b"/>
            <stop offset="70%" stop-color="#475569"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>

        <linearGradient id="ironCoreTop" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <linearGradient id="ironCoreSide" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>

        <!-- Gradient Dây Đồng Sơ Cấp (Màu Đồng Đỏ/Cam Sắc Nét) -->
        <linearGradient id="copperWireFront" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="25%" stop-color="#f59e0b"/>
            <stop offset="65%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#78350f"/>
        </linearGradient>

        <linearGradient id="copperWireBack" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#92400e"/>
            <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>

        <!-- Gradient Dây Đồng Thứ Cấp (Màu Đồng Xanh Dương Ánh Kim) -->
        <linearGradient id="copperSecFront" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bae6fd"/>
            <stop offset="25%" stop-color="#38bdf8"/>
            <stop offset="65%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#075985"/>
        </linearGradient>

        <linearGradient id="copperSecBack" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0369a1"/>
            <stop offset="100%" stop-color="#082f49"/>
        </linearGradient>

        <!-- Drop Shadow Cho Các Khung Thẻ -->
        <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>

        <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.15"/>
        </filter>

        <!-- Mũi Tên Từ Thông -->
        <marker id="arrowFlux" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>

        <!-- Mũi Tên Dòng Điện -->
        <marker id="arrowCurrent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
        </marker>
    </defs>

    <!-- NỀN CONTAINER -->
    <rect width="960" height="580" rx="20" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- ==================== HEADER TIÊU ĐỀ ==================== -->
    <g transform="translate(480, 36)">
        <rect x="-260" y="-18" width="520" height="38" rx="19" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text text-anchor="middle" y="7" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.5">
            SƠ ĐỒ CẤU TẠO VÀ NGUYÊN LÝ MÁY BIẾN ÁP
        </text>
    </g>

    <!-- ========================================================================= -->
    <!-- ==================== KHỐI LÕI THÉP BIẾN ÁP TRUNG TÂM ==================== -->
    <!-- ========================================================================= -->
    <g id="transformerCore" transform="translate(300, 85)" filter="url(#coreGlow)">
        
        <!-- 1. CÁC NỬA VÒNG DÂY PHÍA SAU (BACK COIL PASSES) -->
        <!-- Cuộn sơ cấp (Trụ trái: x = 0..70) - 6 vòng quấn -->
        <g id="primaryBackWires">
            <path d="M -8 80 C 15 72, 55 72, 78 80" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
            <path d="M -8 116 C 15 108, 55 108, 78 116" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
            <path d="M -8 152 C 15 144, 55 144, 78 152" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
            <path d="M -8 188 C 15 180, 55 180, 78 188" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
            <path d="M -8 224 C 15 216, 55 216, 78 224" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
            <path d="M -8 260 C 15 252, 55 252, 78 260" fill="none" stroke="url(#copperWireBack)" stroke-width="11" stroke-linecap="round"/>
        </g>

        <!-- Cuộn thứ cấp (Trụ phải: x = 290..360) - 4 vòng quấn -->
        <g id="secondaryBackWires">
            <path d="M 282 95 C 305 87, 345 87, 368 95" fill="none" stroke="url(#copperSecBack)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 282 145 C 305 137, 345 137, 368 145" fill="none" stroke="url(#copperSecBack)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 282 195 C 305 187, 345 187, 368 195" fill="none" stroke="url(#copperSecBack)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 282 245 C 305 237, 345 237, 368 245" fill="none" stroke="url(#copperSecBack)" stroke-width="12" stroke-linecap="round"/>
        </g>

        <!-- 2. KHUNG LÕI THÉP CHÍNH (KHUNG HÌNH CHỮ NHẬT KHÉP KÍN) -->
        <!-- Khung ngoài: Rộng 360, Cao 310, Bo góc 16 -->
        <!-- Cửa sổ trong (lỗ hổng): x = 70, y = 60, Rộng 220, Cao 190, Bo góc 10 -->
        <path d="M 16 0 L 344 0 A 16 16 0 0 1 360 16 L 360 294 A 16 16 0 0 1 344 310 L 16 310 A 16 16 0 0 1 0 294 L 0 16 A 16 16 0 0 1 16 0 Z 
                 M 80 60 A 10 10 0 0 0 70 70 L 70 240 A 10 10 0 0 0 80 250 L 280 250 A 10 10 0 0 0 290 240 L 290 70 A 10 10 0 0 0 280 60 Z"
              fill="url(#ironCoreFace)" stroke="#1e293b" stroke-width="2.5" fill-rule="evenodd"/>

        <!-- Mặt nổi viền 3D của Lõi Thép (Các lá thép silic ghép lớp) -->
        <g stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4">
            <!-- Vạch vân lá thép trụ trái -->
            <line x1="14" y1="0" x2="14" y2="310"/>
            <line x1="28" y1="0" x2="28" y2="310"/>
            <line x1="42" y1="0" x2="42" y2="310"/>
            <line x1="56" y1="0" x2="56" y2="310"/>
            <!-- Vạch vân lá thép trụ phải -->
            <line x1="304" y1="0" x2="304" y2="310"/>
            <line x1="318" y1="0" x2="318" y2="310"/>
            <line x1="332" y1="0" x2="332" y2="310"/>
            <line x1="346" y1="0" x2="346" y2="310"/>
            <!-- Vạch ngang xà trên & xà dưới -->
            <line x1="70" y1="18" x2="290" y2="18"/>
            <line x1="70" y1="36" x2="290" y2="36"/>
            <line x1="70" y1="272" x2="290" y2="272"/>
            <line x1="70" y1="290" x2="290" y2="290"/>
        </g>

        <!-- 3. ĐƯỜNG SỨC TỪ KHÉP KÍN (TỪ THÔNG BIẾN THIÊN TRONG LÕI SẮT) -->
        <rect x="35" y="30" width="290" height="250" rx="14" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="10 6"/>
        
        <!-- Mũi tên từ thông chỉ chiều khép kín -->
        <path d="M 35 170 L 35 150" stroke="#10b981" stroke-width="3" marker-end="url(#arrowFlux)"/>
        <path d="M 170 30 L 195 30" stroke="#10b981" stroke-width="3" marker-end="url(#arrowFlux)"/>
        <path d="M 325 150 L 325 170" stroke="#10b981" stroke-width="3" marker-end="url(#arrowFlux)"/>
        <path d="M 195 280 L 170 280" stroke="#10b981" stroke-width="3" marker-end="url(#arrowFlux)"/>

        <!-- Nhãn Từ Thông Trung Tâm -->
        <g transform="translate(180, 30)">
            <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#cardShadow)"/>
            <text text-anchor="middle" y="6" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#047857">
                Từ thông Φ(t)
            </text>
        </g>

        <!-- 4. CÁC NỬA VÒNG DÂY PHÍA TRƯỚC (FRONT COIL PASSES - 3D SPIRAL) -->
        <!-- Cuộn sơ cấp N1 (Trụ trái) -->
        <g id="primaryFrontWires">
            <!-- Vòng 1 -->
            <path d="M -110 65 L -8 65 Q 35 80, 78 65" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <!-- Vòng 2 -->
            <path d="M -8 101 Q 35 116, 78 101" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <!-- Vòng 3 -->
            <path d="M -8 137 Q 35 152, 78 137" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <!-- Vòng 4 -->
            <path d="M -8 173 Q 35 188, 78 173" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <!-- Vòng 5 -->
            <path d="M -8 209 Q 35 224, 78 209" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <!-- Vòng 6 & Đầu dây ra -->
            <path d="M -8 245 Q 35 260, 78 245" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>
            <path d="M -8 281 L -110 281" fill="none" stroke="url(#copperWireFront)" stroke-width="10" stroke-linecap="round"/>

            <!-- Các đoạn dây nối xoắn ốc bên hông -->
            <path d="M 78 65 L -8 101" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
            <path d="M 78 101 L -8 137" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
            <path d="M 78 137 L -8 173" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
            <path d="M 78 173 L -8 209" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
            <path d="M 78 209 L -8 245" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
            <path d="M 78 245 L -8 281" fill="none" stroke="url(#copperWireFront)" stroke-width="9"/>
        </g>

        <!-- Cuộn thứ cấp N2 (Trụ phải) -->
        <g id="secondaryFrontWires">
            <!-- Vòng 1 -->
            <path d="M 282 78 Q 325 96, 368 78 L 470 78" fill="none" stroke="url(#copperSecFront)" stroke-width="11" stroke-linecap="round"/>
            <!-- Vòng 2 -->
            <path d="M 282 128 Q 325 146, 368 128" fill="none" stroke="url(#copperSecFront)" stroke-width="11" stroke-linecap="round"/>
            <!-- Vòng 3 -->
            <path d="M 282 178 Q 325 196, 368 178" fill="none" stroke="url(#copperSecFront)" stroke-width="11" stroke-linecap="round"/>
            <!-- Vòng 4 & Đầu dây ra -->
            <path d="M 282 228 Q 325 246, 368 228" fill="none" stroke="url(#copperSecFront)" stroke-width="11" stroke-linecap="round"/>
            <path d="M 282 278 L 470 278" fill="none" stroke="url(#copperSecFront)" stroke-width="11" stroke-linecap="round"/>

            <!-- Các đoạn dây nối xoắn ốc bên hông -->
            <path d="M 368 78 L 282 128" fill="none" stroke="url(#copperSecFront)" stroke-width="10"/>
            <path d="M 368 128 L 282 178" fill="none" stroke="url(#copperSecFront)" stroke-width="10"/>
            <path d="M 368 178 L 282 228" fill="none" stroke="url(#copperSecFront)" stroke-width="10"/>
            <path d="M 368 228 L 282 278" fill="none" stroke="url(#copperSecFront)" stroke-width="10"/>
        </g>

    </g>

    <!-- ========================================================================= -->
    <!-- ==================== MẠCH SƠ CẤP VÀO (BÊN TRÁI) ========================= -->
    <!-- ========================================================================= -->
    <g transform="translate(190, 85)">
        <!-- Dây nối từ cuộn sơ cấp vào Nguồn -->
        <path d="M 0 65 L -70 65 L -70 140" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 0 281 L -70 281 L -70 210" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Mũi tên chỉ dòng điện i1(t) -->
        <path d="M -30 65 L -10 65" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowCurrent)"/>
        <text x="-20" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#dc2626">i₁(t)</text>

        <!-- Ký hiệu Nguồn Xoay Chiều Sơ Cấp (Biểu tượng ~ lớn rõ ràng) -->
        <g transform="translate(-70, 175)" filter="url(#cardShadow)">
            <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#059669" stroke-width="3.5"/>
            <path d="M -14 0 Q -7 -12 0 0 T 14 0" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
            <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Nguồn vào</text>
            <text x="0" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#059669">u₁(t), U₁</text>
        </g>
    </g>

    <!-- BẢNG THÔNG TIN CUỘN SƠ CẤP (GÓC DƯỚI TRÁI) -->
    <g transform="translate(45, 415)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="230" height="135" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
        <path d="M 0 14 A 14 14 0 0 1 14 0 L 216 0 A 14 14 0 0 1 230 14 L 230 36 L 0 36 Z" fill="#fef3c7"/>
        <text x="115" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#b45309">
            CUỘN SƠ CẤP (PRIMARY)
        </text>
        <text x="20" y="64" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Số vòng dây: <tspan font-weight="800" font-size="18" fill="#d97706">N₁</tspan>
        </text>
        <text x="20" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Điện áp vào: <tspan font-weight="800" font-size="17" fill="#059669">U₁</tspan>
        </text>
        <text x="20" y="118" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Cường độ dòng: <tspan font-weight="800" font-size="17" fill="#dc2626">I₁</tspan>
        </text>
    </g>

    <!-- ========================================================================= -->
    <!-- ==================== MẠCH THỨ CẤP RA (BÊN PHẢI) ========================= -->
    <!-- ========================================================================= -->
    <g transform="translate(670, 85)">
        <!-- Dây nối từ cuộn thứ cấp vào Tải -->
        <path d="M 100 78 L 170 78 L 170 140" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 100 278 L 170 278 L 170 210" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Mũi tên chỉ dòng điện i2(t) -->
        <path d="M 120 78 L 140 78" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowCurrent)"/>
        <text x="130" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#dc2626">i₂(t)</text>

        <!-- Khối Tải Tiêu Thụ Thứ Cấp R -->
        <g transform="translate(170, 175)" filter="url(#cardShadow)">
            <rect x="-26" y="-36" width="52" height="72" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
            <text x="0" y="8" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0284c7">R</text>
            <text x="0" y="56" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Tải ra</text>
            <text x="0" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0284c7">u₂(t), U₂</text>
        </g>
    </g>

    <!-- BẢNG THÔNG TIN CUỘN THỨ CẤP (GÓC DƯỚI PHẢI) -->
    <g transform="translate(685, 415)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="230" height="135" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
        <path d="M 0 14 A 14 14 0 0 1 14 0 L 216 0 A 14 14 0 0 1 230 14 L 230 36 L 0 36 Z" fill="#e0f2fe"/>
        <text x="115" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0369a1">
            CUỘN THỨ CẤP (SECONDARY)
        </text>
        <text x="20" y="64" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Số vòng dây: <tspan font-weight="800" font-size="18" fill="#0284c7">N₂</tspan>
        </text>
        <text x="20" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Điện áp ra: <tspan font-weight="800" font-size="17" fill="#0284c7">U₂</tspan>
        </text>
        <text x="20" y="118" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">
            • Cường độ dòng: <tspan font-weight="800" font-size="17" fill="#dc2626">I₂</tspan>
        </text>
    </g>

    <!-- ========================================================================= -->
    <!-- ==================== BẢNG CHÚ THÍCH LÕI THÉP (Ở GIỮA DƯỚI) ============== -->
    <!-- ========================================================================= -->
    <g transform="translate(305, 415)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="350" height="135" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
        <path d="M 0 14 A 14 14 0 0 1 14 0 L 336 0 A 14 14 0 0 1 350 14 L 350 36 L 0 36 Z" fill="#f1f5f9"/>
        <text x="175" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1e293b">
            LÕI THÉP KỸ THUẬT ĐIỆN (CORE)
        </text>
        
        <text x="20" y="65" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">
            • Cấu tạo: Ghép từ các lá thép silic mỏng.
        </text>
        <text x="20" y="90" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">
            • Có sơn cách điện để <tspan font-weight="800" fill="#b91c1c">giảm dòng Foucault</tspan>.
        </text>
        <text x="20" y="116" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#047857">
            • Công thức lí tưởng: <tspan font-weight="800" font-size="17" fill="#047857">U₂/U₁ = N₂/N₁ = I₁/I₂</tspan>
        </text>
    </g>

    <!-- WATERMARK BẢN QUYỀN GÓC PHẢI -->
    <text x="940" y="565" text-anchor="end" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1">vatli102.com</text>
</svg>
