<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
    <defs>
        <!-- Gradient Background -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <!-- Gradient Lõi Thép Kỹ Thuật Điện -->
        <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="50%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>

        <!-- Gradient Cuộn Sơ Cấp (Đồng Cam) -->
        <linearGradient id="copperPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="50%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>

        <!-- Gradient Cuộn Thứ Cấp (Đồng Xanh) -->
        <linearGradient id="copperSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>

        <!-- Bóng Đổ Drop Shadow -->
        <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="5" in="SourceAlpha"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Marker Mũi Tên Từ Thông -->
        <marker id="arrowFlux" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
        </marker>
        <marker id="arrowCurrent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
        </marker>
    </defs>

    <!-- Nền Bao Ngoài -->
    <rect width="850" height="420" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(425, 30)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="0.5">SƠ ĐỒ CẤU TẠO VÀ NGUYÊN LÝ MÁY BIẾN ÁP</text>
        <line x1="-140" y1="10" x2="140" y2="10" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- KHUNG LÕI THÉP BIẾN ÁP -->
    <g transform="translate(265, 75)" filter="url(#shadow)">
        <!-- Khung ngoài lõi sắt -->
        <rect x="0" y="0" width="320" height="240" rx="14" fill="url(#coreGrad)" stroke="#1e293b" stroke-width="2"/>
        
        <!-- Khung trong (lỗ rỗng giữa lõi sắt) -->
        <rect x="75" y="55" width="170" height="130" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>

        <!-- Hiệu ứng ghép các lá thép silic mỏng -->
        <path d="M 12 0 L 12 240 M 24 0 L 24 240 M 36 0 L 36 240 M 48 0 L 48 240 M 60 0 L 60 240" stroke="#64748b" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 260 0 L 260 240 M 272 0 L 272 240 M 284 0 L 284 240 M 296 0 L 296 240 M 308 0 L 308 240" stroke="#64748b" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 75 18 L 245 18 M 75 36 L 245 36" stroke="#64748b" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M 75 204 L 245 204 M 75 222 L 245 222" stroke="#64748b" stroke-width="1" stroke-opacity="0.35"/>

        <!-- ĐƯỜNG SỨC TỪ / TỪ THÔNG KHÉP KÍN TRONG LÕI SẮT -->
        <rect x="37" y="27" width="246" height="186" rx="8" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8 5"/>
        
        <!-- Mũi tên chỉ chiều từ thông Phi(t) -->
        <path d="M 37 115 L 37 105" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowFlux)"/>
        <path d="M 160 27 L 175 27" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowFlux)"/>
        <path d="M 283 125 L 283 135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowFlux)"/>
        <path d="M 175 213 L 160 213" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowFlux)"/>

        <!-- Nhãn Từ thông Phi -->
        <rect x="120" y="16" width="80" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
        <text x="160" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#047857">Từ thông Φ(t)</text>
    </g>

    <!-- CUỘN SƠ CẤP (PRIMARY COIL) -->
    <g transform="translate(245, 125)">
        <rect x="0" y="0" width="115" height="16" rx="8" fill="url(#copperPrimary)" stroke="#92400e" stroke-width="1.2"/>
        <rect x="0" y="28" width="115" height="16" rx="8" fill="url(#copperPrimary)" stroke="#92400e" stroke-width="1.2"/>
        <rect x="0" y="56" width="115" height="16" rx="8" fill="url(#copperPrimary)" stroke="#92400e" stroke-width="1.2"/>
        <rect x="0" y="84" width="115" height="16" rx="8" fill="url(#copperPrimary)" stroke="#92400e" stroke-width="1.2"/>
        <rect x="0" y="112" width="115" height="16" rx="8" fill="url(#copperPrimary)" stroke="#92400e" stroke-width="1.2"/>

        <!-- Dây dẫn đưa ra nguồn xoay chiều -->
        <path d="M 0 8 L -110 8" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <path d="M 0 120 L -110 120" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

        <!-- Mũi tên dòng điện I1 -->
        <path d="M -60 8 L -45 8" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowCurrent)"/>
        <text x="-52" y="-2" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#dc2626">i₁(t)</text>
    </g>

    <!-- NGUỒN XOAY CHIỀU SƠ CẤP U1 -->
    <g transform="translate(135, 189)">
        <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
        <path d="M -10 0 Q -5 -8 0 0 T 10 0" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <text x="0" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Nguồn xoay chiều</text>
        <text x="0" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669">u₁(t), U₁</text>
    </g>

    <!-- HỘP THÔNG TIN CUỘN SƠ CẤP -->
    <g transform="translate(100, 275)">
        <rect x="0" y="0" width="150" height="68" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="150" height="24" rx="10" fill="#fef3c7"/>
        <text x="75" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#b45309">CUỘN SƠ CẤP</text>
        <text x="75" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Số vòng: <tspan font-weight="800" fill="#d97706">N₁</tspan></text>
        <text x="75" y="59" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Điện áp: U₁ | Dòng: I₁</text>
    </g>

    <!-- CUỘN THỨ CẤP (SECONDARY COIL) -->
    <g transform="translate(490, 138)">
        <rect x="0" y="0" width="115" height="16" rx="8" fill="url(#copperSecondary)" stroke="#0369a1" stroke-width="1.2"/>
        <rect x="0" y="38" width="115" height="16" rx="8" fill="url(#copperSecondary)" stroke="#0369a1" stroke-width="1.2"/>
        <rect x="0" y="76" width="115" height="16" rx="8" fill="url(#copperSecondary)" stroke="#0369a1" stroke-width="1.2"/>
        <rect x="0" y="114" width="115" height="16" rx="8" fill="url(#copperSecondary)" stroke="#0369a1" stroke-width="1.2"/>

        <!-- Dây dẫn đưa ra mạch tiêu thụ (Tải) -->
        <path d="M 115 8 L 225 8" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <path d="M 115 122 L 225 122" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

        <!-- Mũi tên dòng điện I2 -->
        <path d="M 160 8 L 175 8" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowCurrent)"/>
        <text x="168" y="-2" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#dc2626">i₂(t)</text>
    </g>

    <!-- TẢI TIÊU THỤ THỨ CẤP U2 -->
    <g transform="translate(715, 189)">
        <rect x="-20" y="-30" width="40" height="60" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
        <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0284c7">R</text>
        <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Tải tiêu thụ</text>
        <text x="0" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0284c7">u₂(t), U₂</text>
    </g>

    <!-- HỘP THÔNG TIN CUỘN THỨ CẤP -->
    <g transform="translate(600, 275)">
        <rect x="0" y="0" width="150" height="68" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="150" height="24" rx="10" fill="#e0f2fe"/>
        <text x="75" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">CUỘN THỨ CẤP</text>
        <text x="75" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Số vòng: <tspan font-weight="800" fill="#0284c7">N₂</tspan></text>
        <text x="75" y="59" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Điện áp: U₂ | Dòng: I₂</text>
    </g>

    <!-- CHÚ THÍCH LÕI THÉP (Ở DƯỚI ĐÁY) -->
    <g transform="translate(325, 335)">
        <rect x="0" y="0" width="200" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="100" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e293b">LÕI THÉP KỸ THUẬT ĐIỆN</text>
        <text x="100" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569">Ghép từ các lá thép silicon mỏng</text>
        <text x="100" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#059669">(Giảm hao phí dòng Foucault)</text>
    </g>

    <!-- WATERMARK GÓC PHẢI -->
    <text x="830" y="408" text-anchor="end" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
