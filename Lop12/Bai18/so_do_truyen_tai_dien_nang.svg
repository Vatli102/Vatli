<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
    <defs>
        <!-- Linear Gradients -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <linearGradient id="plantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <linearGradient id="stepUpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>

        <linearGradient id="stepDownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>

        <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#6d28d9"/>
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Arrow Markers -->
        <marker id="arrowLine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
        </marker>
        <marker id="arrowPwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
        </marker>
    </defs>

    <!-- Nền Bao Ngoài -->
    <rect width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(460, 28)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="0.5">SƠ ĐỒ HỆ THỐNG TRUYỀN TẢI ĐIỆN NĂNG ĐI XA</text>
        <line x1="-160" y1="10" x2="160" y2="10" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- ============================================================== -->
    <!-- KHỐI 1: NHÀ MÁY ĐIỆN (POWER PLANT) -->
    <!-- ============================================================== -->
    <g transform="translate(40, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="145" height="210" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="0" y="0" width="145" height="34" rx="12" fill="#eff6ff"/>
        <text x="72.5" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">NHÀ MÁY ĐIỆN</text>
        
        <!-- Icon Nhà máy / Thủy điện -->
        <g transform="translate(42.5, 48)">
            <rect x="5" y="30" width="50" height="35" rx="4" fill="#93c5fd"/>
            <polygon points="5,30 30,10 55,30" fill="#2563eb"/>
            <rect x="15" y="42" width="12" height="23" rx="2" fill="#1e3a8a"/>
            <rect x="33" y="42" width="12" height="12" rx="2" fill="#dbeafe"/>
            <!-- Ống khói / tua bin -->
            <rect x="42" y="5" width="8" height="15" fill="#64748b"/>
        </g>

        <!-- Thông số điện áp phát -->
        <g transform="translate(10, 130)">
            <rect x="0" y="0" width="125" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
            <text x="62.5" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b">Điện áp máy phát:</text>
            <text x="62.5" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">U ≈ 11 - 25 kV</text>
            <text x="62.5" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#059669">Công suất P phát</text>
        </g>
    </g>

    <!-- Mũi tên kết nối 1 -> 2 -->
    <path d="M 185 180 L 225 180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowPwr)"/>

    <!-- ============================================================== -->
    <!-- KHỐI 2: TRẠM BIẾN ÁP TĂNG ÁP ĐẦU ĐƯỜNG DÂY -->
    <!-- ============================================================== -->
    <g transform="translate(235, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="145" height="210" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
        <rect x="0" y="0" width="145" height="34" rx="12" fill="#fef3c7"/>
        <text x="72.5" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#b45309">TRẠM TĂNG ÁP</text>
        
        <!-- Icon Máy biến áp tăng -->
        <g transform="translate(42.5, 48)">
            <circle cx="20" cy="35" r="18" fill="none" stroke="#d97706" stroke-width="3"/>
            <circle cx="40" cy="35" r="18" fill="none" stroke="#d97706" stroke-width="3"/>
            <text x="30" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ea580c">N₂ &gt; N₁</text>
        </g>

        <!-- Thông số tăng áp -->
        <g transform="translate(10, 130)">
            <rect x="0" y="0" width="125" height="68" rx="8" fill="#fffbeb" stroke="#fde68a"/>
            <text x="62.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Tăng điện áp lên:</text>
            <text x="62.5" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#d97706">220 - 500 kV</text>
            <text x="62.5" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#dc2626">Giảm I → Giảm Php</text>
        </g>
    </g>

    <!-- ============================================================== -->
    <!-- KHỐI 3: ĐƯỜNG DÂY TRUYỀN TẢI CAO THẾ (PYLONS) -->
    <!-- ============================================================== -->
    <g transform="translate(390, 70)">
        <!-- Khung bao đường dây -->
        <rect x="0" y="5" width="140" height="210" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
        <text x="70" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#475569">ĐƯỜNG DÂY CAO THẾ</text>
        
        <!-- Cột điện cao thế (Pylon Lattice) -->
        <g transform="translate(45, 35)">
            <!-- Thân cột điện -->
            <polygon points="25,5 15,100 35,100" fill="none" stroke="#334155" stroke-width="2"/>
            <!-- Các thanh giằng chéo -->
            <line x1="22" y1="25" x2="28" y2="25" stroke="#334155" stroke-width="1.5"/>
            <line x1="19" y1="50" x2="31" y2="50" stroke="#334155" stroke-width="1.5"/>
            <line x1="16" y1="75" x2="34" y2="75" stroke="#334155" stroke-width="1.5"/>
            <line x1="19" y1="50" x2="31" y2="75" stroke="#334155" stroke-width="1"/>
            <line x1="31" y1="50" x2="16" y2="75" stroke="#334155" stroke-width="1"/>
            <!-- Tay xà đỡ sứ cách điện -->
            <line x1="0" y1="25" x2="50" y2="25" stroke="#334155" stroke-width="2.5"/>
            <line x1="5" y1="50" x2="45" y2="50" stroke="#334155" stroke-width="2.5"/>
            <line x1="10" y1="75" x2="40" y2="75" stroke="#334155" stroke-width="2.5"/>
            <!-- Chuỗi sứ cách điện -->
            <line x1="2" y1="25" x2="2" y2="35" stroke="#e11d48" stroke-width="2"/>
            <line x1="48" y1="25" x2="48" y2="35" stroke="#e11d48" stroke-width="2"/>
        </g>

        <!-- Dây điện cao thế đỏ -->
        <path d="M -10 95 Q 70 120 150 95" fill="none" stroke="#ef4444" stroke-width="2.5"/>
        <path d="M -10 120 Q 70 145 150 120" fill="none" stroke="#ef4444" stroke-width="2.5"/>

        <!-- Nhãn điện trở R & Khoảng cách -->
        <g transform="translate(10, 145)">
            <rect x="0" y="0" width="120" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
            <text x="60" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#64748b">Điện trở đường dây:</text>
            <text x="60" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#dc2626">R đường dây</text>
            <text x="60" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#475569">(Hàng trăm km)</text>
        </g>
    </g>

    <!-- ============================================================== -->
    <!-- KHỐI 4: TRẠM BIẾN ÁP HẠ ÁP (SUBSTATION) -->
    <!-- ============================================================== -->
    <g transform="translate(540, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="145" height="210" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
        <rect x="0" y="0" width="145" height="34" rx="12" fill="#ecfdf5"/>
        <text x="72.5" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#047857">TRẠM HẠ ÁP</text>
        
        <!-- Icon Máy biến áp hạ -->
        <g transform="translate(42.5, 48)">
            <circle cx="20" cy="35" r="18" fill="none" stroke="#059669" stroke-width="3"/>
            <circle cx="40" cy="35" r="18" fill="none" stroke="#059669" stroke-width="3"/>
            <text x="30" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#047857">N₂ &lt; N₁</text>
        </g>

        <!-- Thông số hạ áp -->
        <g transform="translate(10, 130)">
            <rect x="0" y="0" width="125" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
            <text x="62.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#166534">Hạ điện áp xuống:</text>
            <text x="62.5" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800" fill="#059669">22 kV → 220 V</text>
            <text x="62.5" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803d">An toàn sử dụng</text>
        </g>
    </g>

    <!-- Mũi tên kết nối 4 -> 5 -->
    <path d="M 695 180 L 735 180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowPwr)"/>

    <!-- ============================================================== -->
    <!-- KHỐI 5: NƠI TIÊU THỤ ĐIỆN (CONSUMERS / HOUSES / FACTORIES) -->
    <!-- ============================================================== -->
    <g transform="translate(745, 75)" filter="url(#shadow)">
        <rect x="0" y="0" width="140" height="210" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
        <rect x="0" y="0" width="140" height="34" rx="12" fill="#f5f3ff"/>
        <text x="70" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#6d28d9">NƠI TIÊU THỤ</text>
        
        <!-- Icon Ngôi nhà & Nhà máy -->
        <g transform="translate(40, 48)">
            <!-- Nhà dân -->
            <polygon points="10,30 30,12 50,30" fill="#7c3aed"/>
            <rect x="15" y="30" width="30" height="30" fill="#c4b5fd"/>
            <rect x="25" y="42" width="10" height="18" fill="#4c1d95"/>
        </g>

        <!-- Thông số điện áp tiêu thụ -->
        <g transform="translate(8, 130)">
            <rect x="0" y="0" width="124" height="68" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
            <text x="62" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#5b21b6">Điện áp dân dụng:</text>
            <text x="62" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#7c3aed">U = 220 V</text>
            <text x="62" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#6d28d9">(Công nghiệp 380V)</text>
        </g>
    </g>

    <!-- ============================================================== -->
    <!-- KHUNG QUY LUẬT GIẢM HAO PHÍ Ở ĐÁY (SUMMARY BANNER) -->
    <!-- ============================================================== -->
    <g transform="translate(40, 305)">
        <rect x="0" y="0" width="845" height="110" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
        
        <text x="422.5" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800" fill="#065f46">
            QUY LUẬT GIẢM CÔNG SUẤT HAO PHÍ TRÊN ĐƯỜNG DÂY TẢI ĐIỆN:
        </text>

        <!-- Công thức -->
        <g transform="translate(50, 42)">
            <rect x="0" y="0" width="280" height="52" rx="10" fill="#ffffff" stroke="#10b981"/>
            <text x="140" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#047857">
                P<tspan font-size="11" dy="4">hp</tspan><tspan dy="-4"> = R · </tspan><tspan font-size="15">P²</tspan><tspan font-size="15"> / (U² · cos²φ)</tspan>
            </text>
        </g>

        <!-- Diễn giải logic -->
        <g transform="translate(350, 42)">
            <rect x="0" y="0" width="455" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
            <text x="227.5" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">
                Vì công suất hao phí <tspan font-weight="800" fill="#dc2626">P<tspan font-size="10">hp</tspan> tỉ lệ nghịch với U²</tspan>
            </text>
            <text x="227.5" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#059669">
                → Khi tăng điện áp U lên k lần, công suất hao phí giảm vọt k² lần!
            </text>
        </g>
    </g>

    <!-- Watermark -->
    <text x="900" y="430" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
