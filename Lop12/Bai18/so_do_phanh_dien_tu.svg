<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f8fafc"/>
        </linearGradient>

        <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#cbd5e1"/>
            <stop offset="50%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <linearGradient id="magNorth" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#b91c1c"/>
        </linearGradient>

        <linearGradient id="magSouth" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>

        <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <marker id="arrowRot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
        </marker>
        <marker id="arrowDrag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
        </marker>
    </defs>

    <rect width="880" height="410" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- TIÊU ĐỀ SƠ ĐỒ -->
    <g transform="translate(440, 26)">
        <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5">NGUYÊN LÝ HÃM PHANH BẰNG DÒNG ĐIỆN XOÁY (PHANH ĐIỆN TỪ)</text>
        <line x1="-170" y1="8" x2="170" y2="8" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- KHU VỰC MINH HỌA ĐĨA PHANH VÀ NAM CHÂM ĐIỆN -->
    <g transform="translate(240, 55)" filter="url(#shadow)">
        <!-- 1. ĐĨA KIM LOẠI DẪN ĐIỆN (RÔTO QUAY ĐỒNG TRỤC BÁNH XE) -->
        <g transform="translate(40, 10)">
            <!-- Đĩa kim loại tròn -->
            <circle cx="150" cy="105" r="95" fill="url(#diskGrad)" stroke="#475569" stroke-width="2"/>
            <!-- Trục quay ở tâm -->
            <circle cx="150" cy="105" r="22" fill="#334155" stroke="#1e293b" stroke-width="2"/>
            <circle cx="150" cy="105" r="8" fill="#e2e8f0"/>
            <text x="150" y="109" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#1e293b">Trục</text>

            <!-- Mũi tên chỉ chiều quay tốc độ góc omega -->
            <path d="M 150 20 A 85 85 0 0 1 235 105" fill="none" stroke="#0f172a" stroke-width="3" stroke-dasharray="6 3"/>
            <path d="M 235 105 L 235 112" stroke="#0f172a" stroke-width="3" marker-end="url(#arrowRot)"/>
            <text x="215" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0f172a">v, ω</text>

            <!-- 2. VÙNG NAM CHÂM ĐIỆN TÁC DỤNG TỪ TRƯỜNG LÊN ĐĨA -->
            <g transform="translate(110, 5)">
                <!-- Cực từ nam châm ôm đĩa -->
                <rect x="0" y="0" width="80" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
                <text x="40" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#b91c1c">CỰC TỪ (N - S)</text>
                <text x="40" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0284c7">Từ trường B ⊗</text>

                <!-- CÁC VÒNG DÒNG XOÁY FOUCAULT DƯỚI CỰC TỪ -->
                <ellipse cx="40" cy="55" rx="25" ry="16" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
                <ellipse cx="40" cy="55" rx="14" ry="9" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 2"/>
                
                <!-- Lực cản điện từ (Lực hãm phanh) ngược chiều chuyển động -->
                <line x1="40" y1="55" x2="-20" y2="55" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrowDrag)"/>
                <rect x="-35" y="28" width="55" height="20" rx="4" fill="#fef2f2" stroke="#ef4444"/>
                <text x="-7" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#b91c1c">Lực hãm F</text>
            </g>

            <!-- Nhãn Đĩa kim loại dẫn điện -->
            <rect x="70" y="165" width="160" height="24" rx="6" fill="#ffffff" stroke="#64748b"/>
            <text x="150" y="181" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1e293b">Đĩa phanh kim loại (Đồng/Nhôm)</text>
        </g>
    </g>

    <!-- THẺ CHÚ THÍCH TRÁI: CƠ CHẾ SINH LỰC HÃM -->
    <g transform="translate(35, 60)" filter="url(#shadow)">
        <rect x="0" y="0" width="175" height="195" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
        <rect x="0" y="0" width="175" height="26" rx="10" fill="#fef2f2"/>
        <text x="87.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#dc2626">1. CƠ CHẾ HÃM PHANH</text>
        <text x="10" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Đĩa kim loại quay cắt</text>
        <text x="15" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0284c7">đường sức từ trường B.</text>
        <text x="10" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Trong đĩa xuất hiện các</text>
        <text x="15" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#dc2626">dòng điện xoáy Foucault.</text>
        <text x="10" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#334155">• Theo Định luật Lenz, từ</text>
        <text x="15" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">trường cản trở chuyển động,</text>
        <text x="15" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">sinh lực hãm làm đĩa dừng lại.</text>
    </g>

    <!-- THẺ CHÚ THÍCH PHẢI: ỨNG DỤNG THỰC TẾ -->
    <g transform="translate(670, 60)" filter="url(#shadow)">
        <rect x="0" y="0" width="175" height="195" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
        <rect x="0" y="0" width="175" height="26" rx="10" fill="#ecfdf5"/>
        <text x="87.5" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857">2. ỨNG DỤNG THỰC TẾ</text>
        <text x="10" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Tàu hỏa cao tốc (Shinkansen):</text>
        <text x="15" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">Hãm phanh êm ái, an toàn</text>
        <text x="15" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">ở vận tốc trên 300 km/h.</text>
        <text x="10" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Không ma sát cơ học:</text>
        <text x="15" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">Không mòn má phanh,</text>
        <text x="15" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#334155">không gây kẹt cứng bánh.</text>
        <text x="10" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">✓ Tàu lượn siêu tốc, ô tô tải.</text>
    </g>

    <!-- BANNER NGUYÊN LÝ Ở ĐÁY -->
    <g transform="translate(35, 275)">
        <rect x="0" y="0" width="810" height="95" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
        <text x="405" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#065f46">
            BẢN CHẤT VẬT LÍ: TÁC DỤNG CƠ HỌC CỦA DÒNG ĐIỆN XOÁY FOUCAULT (ĐỊNH LUẬT LENZ)
        </text>

        <g transform="translate(20, 36)">
            <rect x="0" y="0" width="770" height="46" rx="8" fill="#ffffff" stroke="#10b981"/>
            <text x="385" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">
                Đĩa quay cắt từ trường → Sinh dòng xoáy Foucault → Lực từ tương tác chống lại nguyên nhân sinh ra nó
            </text>
            <text x="385" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#dc2626">
                → Tạo ra mômen lực hãm làm đĩa phanh giảm tốc độ quay một cách nhanh chóng và êm ái!
            </text>
        </g>
    </g>

    <text x="860" y="398" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">vatli102.com</text>
</svg>
