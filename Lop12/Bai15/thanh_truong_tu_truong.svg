<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    
    <!-- Linear Gradients for 3D metallic feel -->
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 3D Perspective Horizontal Table Surface (Mặt phẳng nằm ngang) -->
  <polygon points="40,240 180,80 570,80 430,240" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="510" y="230" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8" font-style="italic">Mặt phẳng nằm ngang</text>

  <!-- Two Parallel Horizontal Metallic Rails (Hai thanh ray nằm ngang 3D) -->
  <!-- Back Rail (Thanh ray 1 phía sau) -->
  <polygon points="130,116 500,116 500,124 130,124" fill="url(#railGrad)" stroke="#334155" stroke-width="1"/>
  <!-- Front Rail (Thanh ray 2 phía trước) -->
  <polygon points="70,195 440,195 440,203 70,203" fill="url(#railGrad)" stroke="#334155" stroke-width="1"/>
  
  <text x="510" y="122" font-size="12" font-weight="800" fill="#475569">Ray 1</text>
  <text x="450" y="201" font-size="12" font-weight="800" fill="#475569">Ray 2</text>

  <!-- Vertical Magnetic Field B Lines (Thẳng đứng từ trên xuống dưới) -->
  <!-- Line 1 (left) -->
  <line x1="200" y1="20" x2="200" y2="180" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-b)"/>
  
  <!-- Line 2 (center) -->
  <line x1="285" y1="20" x2="285" y2="180" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-b)"/>
  
  <!-- Line 3 (right) -->
  <line x1="370" y1="20" x2="370" y2="180" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-b)"/>

  <!-- Label B (Cảm ứng từ B thẳng đứng hướng xuống) -->
  <g transform="translate(295, 35)">
    <rect x="-10" y="-20" width="230" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <!-- SVG Vector Arrow over B -->
    <line x1="0" y1="-14" x2="12" y2="-14" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="10,-16.5 14,-14 10,-11.5" fill="#2563eb"/>
    <text x="0" y="0" font-size="13" font-weight="800" fill="#2563eb">B (từ trường thẳng đứng hướng xuống ↓)</text>
  </g>

  <!-- Slanted Metal Rod (Thanh kim loại chếch chéo 3D nối 2 thanh ray) -->
  <!-- Rod coordinates: Back Rail at (285, 120), Front Rail me (225, 199) -->
  <polygon points="280,113 292,113 232,206 220,206" fill="url(#rodGrad)" stroke="#78350f" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Current I passing along the slanted metal rod (Green Arrow + Label I) -->
  <line x1="281" y1="120" x2="231" y2="195" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-i)"/>
  <circle cx="270" cy="160" r="13" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="270" y="165" text-anchor="middle" font-size="15" font-weight="900" fill="#16a34a">I</text>

</svg>
