<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-fms" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">DẠNG 7: THANH DÂY DẪN TRƯỢT TRÊN HAI THANH RAY TRONG TỪ TRƯỜNG</text>

  <!-- Two Parallel Horizontal Conductive Rails -->
  <rect x="60" y="90" width="400" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" rx="2"/>
  <rect x="60" y="170" width="400" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" rx="2"/>

  <!-- Metal Bar of length L placed across rails -->
  <rect x="230" y="70" width="20" height="132" fill="#f59e0b" stroke="#b45309" stroke-width="2" rx="3"/>
  <text x="220" y="60" font-size="13" font-weight="800" fill="#b45309">Thanh kim loại (L, m)</text>

  <!-- Current I passing through the bar (top to bottom) -->
  <line x1="240" y1="80" x2="240" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-i)"/>
  <text x="250" y="140" font-size="14" font-weight="800" fill="#16a34a">I</text>

  <!-- Magnetic field B pointing straight down -->
  <line x1="140" y1="45" x2="140" y2="215" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-b)"/>
  <line x1="360" y1="45" x2="360" y2="215" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-b)"/>
  <text x="370" y="55" font-size="14" font-weight="800" fill="#2563eb">B (thẳng đứng)</text>

  <!-- Driving Magnetic Force F (Forward / Right →) -->
  <line x1="250" y1="136" x2="370" y2="136" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrow-f)"/>
  <text x="375" y="141" font-size="14" font-weight="800" fill="#d97706">F_từ</text>

  <!-- Opposing Friction Force Fms (Backward / Left ←) -->
  <line x1="230" y1="136" x2="130" y2="136" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-fms)"/>
  <text x="80" y="141" font-size="14" font-weight="800" fill="#dc2626">F_ms</text>

  <!-- Caption -->
  <text x="260" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Phương trình động lực học: F_từ - F_ms = m.a  ⇒  B.I.L - μ.m.g = m.a</text>
</svg>
