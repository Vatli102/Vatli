<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">VÍ DỤ 2: XÁC ĐỊNH CHIỀU LỰC TỪ F</text>

  <!-- Grid of B field lines pointing into page ⊗ (Positioned neatly without overlapping wire) -->
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <!-- Row 1 -->
    <circle cx="100" cy="70" r="11"/><line x1="92" y1="62" x2="108" y2="78"/><line x1="108" y1="62" x2="92" y2="78"/>
    <circle cx="340" cy="70" r="11"/><line x1="332" y1="62" x2="348" y2="78"/><line x1="348" y1="62" x2="332" y2="78"/>

    <!-- Row 2 -->
    <circle cx="100" cy="170" r="11"/><line x1="92" y1="162" x2="108" y2="178"/><line x1="108" y1="162" x2="92" y2="178"/>
    <circle cx="340" cy="170" r="11"/><line x1="332" y1="162" x2="348" y2="178"/><line x1="348" y1="162" x2="332" y2="178"/>
  </g>

  <!-- Label for B with vector arrow on top: B⃗ -->
  <g transform="translate(370, 75)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#2563eb"/>
    <text x="0" y="0" font-size="16" font-weight="800" fill="#2563eb">B (⊗)</text>
  </g>

  <!-- Vertical Wire with Current I (Upward, positioned neatly at x = 250) -->
  <line x1="250" y1="200" x2="250" y2="40" stroke="#16a34a" stroke-width="4"/>
  <line x1="250" y1="150" x2="250" y2="50" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-i)"/>
  <text x="262" y="48" font-size="15" font-weight="800" fill="#16a34a">I</text>

  <!-- Resulting Force F (Pointing Left ←) -->
  <line x1="250" y1="120" x2="140" y2="120" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrow-f)"/>
  
  <!-- Label for F with vector arrow on top: F⃗ -->
  <g transform="translate(130, 105)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#d97706"/>
    <text x="0" y="0" font-size="16" font-weight="800" fill="#d97706">F</text>
  </g>

  <!-- Caption -->
  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Lực từ F⃗ nằm ngang trong mặt phẳng hình vẽ, chiều hướng sang trái (←)</text>
</svg>
