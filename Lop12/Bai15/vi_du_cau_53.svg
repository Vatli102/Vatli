<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- (3) Cân điện tử -->
  <rect x="140" y="190" width="240" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- Display Screen -->
  <rect x="210" y="205" width="100" height="30" rx="6" fill="#0f172a"/>
  <text x="260" y="226" text-anchor="middle" font-size="16" font-weight="800" fill="#22c55e" font-family="monospace">2.20 g</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">(3) Cân điện tử</text>

  <!-- (2) Nam châm chữ U -->
  <!-- Left Pole (N - Red) -->
  <rect x="180" y="90" width="40" height="100" fill="#ef4444" rx="4"/>
  <text x="200" y="115" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">N</text>
  <!-- Right Pole (S - Blue) -->
  <rect x="300" y="90" width="40" height="100" fill="#2563eb" rx="4"/>
  <text x="320" y="115" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">S</text>
  <!-- Base of U Magnet -->
  <rect x="180" y="170" width="160" height="20" fill="#475569"/>
  <text x="350" y="185" font-size="12" font-weight="700" fill="#334155">(2) Nam châm chữ U</text>

  <!-- Magnetic Field B Lines (N to S: Left to Right) -->
  <line x1="222" y1="130" x2="296" y2="130" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-b)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">B (từ N sang S)</text>

  <!-- (1) Đoạn dây dẫn PQ nằm ngang xuyên qua khe từ -->
  <line x1="80" y1="140" x2="440" y2="140" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="140" x2="240" y2="140" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-i)"/>
  
  <!-- Points P and Q -->
  <circle cx="100" cy="140" r="5" fill="#0f172a"/>
  <text x="95" y="162" font-size="15" font-weight="900" fill="#0f172a">P</text>
  
  <circle cx="420" cy="140" r="5" fill="#0f172a"/>
  <text x="425" y="162" font-size="15" font-weight="900" fill="#0f172a">Q</text>

  <text x="90" y="125" font-size="12" font-weight="700" fill="#16a34a">(1) Dây dẫn PQ (L = 5 cm, I = 5A)</text>

  <!-- Magnetic Force F on Wire (Pointing Up ↑) -->
  <line x1="260" y1="140" x2="260" y2="50" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrow-f)"/>
  <text x="270" y="65" font-size="14" font-weight="800" fill="#d97706">F_từ (hướng lên)</text>

  <!-- Caption -->
  <text x="260" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Sơ đồ thí nghiệm đo cảm ứng từ B bằng cân điện tử (Câu 53)</text>
</svg>
