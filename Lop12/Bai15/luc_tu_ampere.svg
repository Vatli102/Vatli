<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 3D Plane Base -->
  <polygon points="120,120 340,120 480,60 260,60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="390" y="105" font-size="12" font-weight="600" fill="#94a3b8">Mặt phẳng (I, B)</text>

  <!-- Wire carrying current I -->
  <line x1="160" y1="110" x2="420" y2="70" stroke="#16a34a" stroke-width="4.5"/>
  <line x1="290" y1="90" x2="390" y2="74" stroke="#16a34a" stroke-width="4.5" marker-end="url(#arrow-i)"/>
  <text x="400" y="65" font-size="14" font-weight="800" fill="#16a34a">Dòng điện I</text>
  <text x="290" y="115" font-size="12" font-weight="700" fill="#16a34a">Đoạn dây chiều dài L</text>

  <!-- Magnetic field vector B -->
  <line x1="290" y1="90" x2="440" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-b)"/>
  
  <!-- Label B with vector arrow on top: B⃗ -->
  <g transform="translate(450, 95)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#2563eb"/>
    <text x="0" y="0" font-size="14" font-weight="800" fill="#2563eb">B</text>
  </g>

  <!-- Angle alpha arc -->
  <path d="M 330 84 A 45 45 0 0 1 335 90" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="345" y="82" font-size="13" font-weight="800" fill="#dc2626">α</text>

  <!-- Magnetic Force vector F (Pointing DOWNWARD) -->
  <line x1="290" y1="90" x2="290" y2="250" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrow-f)"/>
  
  <!-- Label F with vector arrow on top: F⃗ -->
  <g transform="translate(300, 255)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#d97706"/>
    <text x="0" y="0" font-size="15" font-weight="800" fill="#d97706">F (F = B.I.L.sinα)</text>
  </g>

  <!-- Right angle symbol for F perpendicular to plane -->
  <polyline points="290,105 305,105 305,90" fill="none" stroke="#d97706" stroke-width="1.5"/>

  <!-- Caption Note -->
  <text x="300" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Lực từ F⃗ vuông góc với mặt phẳng chứa đoạn dây dẫn I và cảm ứng từ B⃗</text>
</svg>
