<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Top Support Stand Bar -->
  <rect x="80" y="20" width="360" height="12" rx="4" fill="#334155"/>

  <!-- Left Force Meter (Lực kế 1) -->
  <rect x="140" y="32" width="24" height="100" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <line x1="152" y1="50" x2="152" y2="110" stroke="#dc2626" stroke-width="2"/>
  <circle cx="152" cy="75" r="4" fill="#dc2626"/>
  <text x="110" y="80" font-size="11" font-weight="700" fill="#475569">Lực kế 1</text>

  <!-- Right Force Meter (Lực kế 2) -->
  <rect x="356" y="32" width="24" height="100" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <line x1="368" y1="50" x2="368" y2="110" stroke="#dc2626" stroke-width="2"/>
  <circle cx="368" cy="75" r="4" fill="#dc2626"/>
  <text x="390" y="80" font-size="11" font-weight="700" fill="#475569">Lực kế 2</text>

  <!-- Hanging Strings connecting force meters to wire -->
  <line x1="152" y1="132" x2="152" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="368" y1="132" x2="368" y2="160" stroke="#475569" stroke-width="1.5"/>

  <!-- Horizontal Wire AB -->
  <line x1="100" y1="160" x2="420" y2="160" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="260" y2="160" stroke="#16a34a" stroke-width="4.5" marker-end="url(#arrow-i)"/>
  
  <circle cx="152" cy="160" r="4" fill="#0f172a"/>
  <text x="145" y="180" font-size="14" font-weight="800" fill="#0f172a">A</text>
  
  <circle cx="368" cy="160" r="4" fill="#0f172a"/>
  <text x="365" y="180" font-size="14" font-weight="800" fill="#0f172a">B</text>

  <!-- Nam châm chữ U đặt giữa đoạn dây AB -->
  <rect x="230" y="125" width="25" height="70" fill="#ef4444" rx="3"/>
  <text x="242" y="145" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">N</text>

  <rect x="265" y="125" width="25" height="70" fill="#2563eb" rx="3"/>
  <text x="277" y="145" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">S</text>

  <rect x="230" y="180" width="60" height="15" fill="#475569"/>
  <text x="260" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Nam châm chữ U</text>

  <!-- Force F_từ (Pointing Straight Down ↓) -->
  <line x1="260" y1="160" x2="260" y2="240" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-f)"/>
  <text x="270" y="235" font-size="13" font-weight="800" fill="#d97706">F_từ (hướng xuống)</text>

  <!-- Power Supply / Circuit Diagram Box at Bottom -->
  <rect x="130" y="245" width="260" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Nguồn điện 1 chiều + Ampe kế + Biến trở</text>

  <!-- Caption -->
  <text x="260" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Sơ đồ thí nghiệm khảo sát phụ thuộc F_từ vào cường độ dòng điện I (Câu 55)</text>
</svg>
