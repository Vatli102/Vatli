<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">VÍ DỤ 1: XÁC ĐỊNH CHIỀU LỰC TỪ F</text>

  <!-- Horizontal Wire with Current I (Left to Right) -->
  <line x1="80" y1="120" x2="380" y2="120" stroke="#16a34a" stroke-width="4"/>
  <line x1="200" y1="120" x2="320" y2="120" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-i)"/>
  <text x="390" y="125" font-size="15" font-weight="800" fill="#16a34a">I</text>

  <!-- Magnetic field lines B (Downward) -->
  <line x1="140" y1="50" x2="140" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-b)"/>
  <line x1="240" y1="50" x2="240" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-b)"/>
  <line x1="340" y1="50" x2="340" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-b)"/>
  
  <!-- Label B with vector arrow on top: B⃗ -->
  <g transform="translate(350, 180)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#2563eb"/>
    <text x="0" y="0" font-size="15" font-weight="800" fill="#2563eb">B</text>
  </g>

  <!-- Resulting Magnetic Force F (Into page symbol ⊗) -->
  <g fill="none" stroke="#d97706" stroke-width="3">
    <circle cx="240" cy="120" r="18" fill="#fef3c7"/>
    <line x1="228" y1="108" x2="252" y2="132"/>
    <line x1="252" y1="108" x2="228" y2="132"/>
  </g>
  
  <!-- Label F with vector arrow on top: F⃗ (hướng vào trong ⊗) -->
  <g transform="translate(270, 115)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#d97706"/>
    <text x="0" y="0" font-size="15" font-weight="800" fill="#d97706">F (hướng vào trong ⊗)</text>
  </g>

  <!-- Caption -->
  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Lực từ F⃗ vuông góc mặt phẳng hình vẽ, chiều hướng từ ngoài vào trong (⊗)</text>
</svg>
