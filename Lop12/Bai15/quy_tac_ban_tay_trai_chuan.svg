<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="hand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">QUY TẮC BÀN TAY TRÁI (SGK VẬT LÍ 12)</text>

  <!-- Left Hand Vector Drawing -->
  <g transform="translate(100, 40)">
    <!-- Arm and Wrist -->
    <path d="M 40,240 L 110,210 L 140,180 L 140,160 L 60,180 Z" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>
    
    <!-- Open Palm (Ngửa lòng bàn tay lên trên hứng B đâm xuống) -->
    <path d="M 120,180 Q 180,180 230,170 Q 250,150 240,130 Q 170,120 120,150 Z" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>

    <!-- 4 extended fingers (Pointing Right → along Current I) -->
    <!-- Index finger -->
    <rect x="230" y="125" width="110" height="16" rx="8" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>
    <!-- Middle finger -->
    <rect x="235" y="143" width="120" height="16" rx="8" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>
    <!-- Ring finger -->
    <rect x="230" y="161" width="110" height="16" rx="8" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>
    <!-- Little finger -->
    <rect x="220" y="179" width="95" height="15" rx="7.5" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>

    <!-- Thumb extended at 90 degrees pointing DOWNWARD (Choãi 90° chỉ chiều lực từ F) -->
    <path d="M 140,170 Q 140,210 135,260 Q 150,270 165,260 Q 170,210 175,170 Z" fill="url(#hand-grad)" stroke="#ea580c" stroke-width="2"/>
    
    <!-- 90 Degree Angle Arc between thumb and 4 fingers -->
    <path d="M 180,170 A 30 30 0 0 1 155,195" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="182" y="200" font-size="14" font-weight="800" fill="#dc2626">90°</text>

    <!-- Magnetic Field B Vector Lines (Entering Palm from top down ↓) -->
    <g stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-b)">
      <line x1="160" y1="20" x2="160" y2="135"/>
      <line x1="200" y1="20" x2="200" y2="135"/>
      <line x1="240" y1="20" x2="240" y2="135"/>
    </g>
    <text x="250" y="40" font-size="14" font-weight="800" fill="#2563eb">B (Đâm vào lòng bàn tay)</text>

    <!-- Current I Vector Line (Along 4 extended fingers →) -->
    <line x1="90" y1="152" x2="380" y2="152" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrow-i)"/>
    <text x="390" y="157" font-size="14" font-weight="800" fill="#16a34a">Dòng điện I (Cổ tay → Ngón tay)</text>

    <!-- Magnetic Force F Vector Line (Along extended thumb ↓) -->
    <line x1="150" y1="170" x2="150" y2="295" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-f)"/>
    <text x="165" y="295" font-size="14" font-weight="800" fill="#d97706">Lực từ F (Chiều ngón cái choãi 90°)</text>
  </g>

  <!-- Explanatory Box -->
  <rect x="30" y="340" width="500" height="30" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">B đâm vào lòng bàn tay  |  Cổ tay đến ngón tay chỉ I  |  Ngón cái choãi 90° chỉ F</text>
</svg>
