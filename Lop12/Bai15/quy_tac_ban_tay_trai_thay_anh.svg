<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="n-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="s-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hand-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">QUY TẮC BÀN TAY TRÁI (THÍ NGHIỆM NAM CHÂM CHỮ U)</text>

  <!-- U-Shaped Magnet (Nam châm hình chữ U) -->
  <!-- U-bend at bottom -->
  <path d="M 100,260 L 100,320 C 100,370 520,370 520,320 L 520,260 L 460,260 L 460,310 C 460,335 160,335 160,310 L 160,260 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>

  <!-- Left Arm: North Pole N (Red) -->
  <rect x="100" y="90" width="60" height="170" fill="url(#n-red)" stroke="#991b1b" stroke-width="2"/>
  <text x="130" y="180" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
  <text x="130" y="210" font-size="13" font-weight="800" fill="#fef2f2" text-anchor="middle">(Bắc)</text>

  <!-- Right Arm: South Pole S (Blue) -->
  <rect x="460" y="90" width="60" height="170" fill="url(#s-blue)" stroke="#1e40af" stroke-width="2"/>
  <text x="490" y="180" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  <text x="490" y="210" font-size="13" font-weight="800" fill="#eff6ff" text-anchor="middle">(Nam)</text>

  <!-- Magnetic Field Lines B (Going from N on left to S on right →) -->
  <g stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow-b)">
    <line x1="165" y1="120" x2="450" y2="120"/>
    <line x1="165" y1="160" x2="450" y2="160"/>
    <line x1="165" y1="200" x2="450" y2="200"/>
  </g>
  
  <!-- Label B with vector arrow on top: B⃗ -->
  <g transform="translate(290, 115)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#2563eb" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#2563eb"/>
    <text x="0" y="0" font-size="15" font-weight="800" fill="#2563eb">B (N → S)</text>
  </g>

  <!-- Wire carrying Current I (Positioned in 3D perspective between N and S) -->
  <line x1="220" y1="280" x2="380" y2="70" stroke="#16a34a" stroke-width="5"/>
  <line x1="260" y1="227" x2="360" y2="96" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-i)"/>
  <text x="375" y="70" font-size="15" font-weight="800" fill="#16a34a">Dòng điện I</text>

  <!-- Left Hand Drawing (Placed between N and S poles) -->
  <!-- Palm facing LEFT towards N pole to catch B lines -->
  <g transform="translate(230, 130)">
    <!-- Arm -->
    <path d="M 10,130 L 40,80 L 60,70 L 40,50 L 0,80 Z" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.8"/>
    <!-- Palm -->
    <ellipse cx="65" cy="55" rx="30" ry="25" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.8"/>

    <!-- 4 Fingers extended pointing along current I (Upward-Right ↗) -->
    <rect x="85" y="30" width="85" height="11" rx="5.5" transform="rotate(-30 85 30)" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="90" y="42" width="95" height="11" rx="5.5" transform="rotate(-30 90 42)" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="85" y="54" width="85" height="11" rx="5.5" transform="rotate(-30 85 54)" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="75" y="66" width="75" height="10" rx="5" transform="rotate(-30 75 66)" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Thumb extended at 90 degrees pointing UPWARD ↑ (Lực từ F) -->
    <path d="M 50,35 Q 45,5 40,-25 Q 58,-25 62,5 Q 65,30 65,35 Z" fill="url(#hand-skin)" stroke="#ea580c" stroke-width="2"/>
    <text x="68" y="-5" font-size="12" font-weight="800" fill="#dc2626">90°</text>
  </g>

  <!-- Resulting Magnetic Force Vector F (Pointing Straight UPWARD ↑) -->
  <line x1="280" y1="160" x2="280" y2="35" stroke="#d97706" stroke-width="4.5" marker-end="url(#arrow-f)"/>
  
  <!-- Label F with vector arrow on top: F⃗ -->
  <g transform="translate(295, 45)">
    <line x1="0" y1="-14" x2="14" y2="-14" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="11,-17 16,-14 11,-11" fill="#d97706"/>
    <text x="0" y="0" font-size="16" font-weight="800" fill="#d97706">F</text>
  </g>

  <!-- Explanation Label Footer -->
  <rect x="40" y="380" width="540" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="310" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">B⃗ đâm vào lòng bàn tay (từ N sang S)  |  Cổ tay → ngón tay chỉ I  |  Ngón cái choãi 90° chỉ F⃗</text>
</svg>
