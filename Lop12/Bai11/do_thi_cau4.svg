<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="225" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ĐỒ THỊ ĐƯỜNG ĐẲNG TÍCH V₁ VÀ V₂ TRÊN HỆ (p, T)</text>

  <!-- Axes -->
  <line x1="50" y1="260" x2="400" y2="260" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="260" x2="50" y2="50" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="410" y="265" font-size="14" font-weight="800" fill="#1e293b">T</text>
  <text x="45" y="40" font-size="14" font-weight="800" fill="#1e293b">p</text>
  <text x="36" y="275" font-size="13" font-weight="700" fill="#64748b">O</text>

  <!-- Line V1 (Steeper slope) -->
  <line x1="50" y1="260" x2="110" y2="195" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="110" y1="195" x2="310" y2="60" stroke="#7c3aed" stroke-width="2.8"/>
  <text x="320" y="65" font-size="14" font-weight="800" fill="#7c3aed">V₁</text>

  <!-- Line V2 (Smaller slope, located below V1) -->
  <line x1="50" y1="260" x2="130" y2="215" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="130" y1="215" x2="370" y2="140" stroke="#2563eb" stroke-width="2.8"/>
  <text x="380" y="145" font-size="14" font-weight="800" fill="#2563eb">V₂ (nằm dưới V₁)</text>
</svg>
