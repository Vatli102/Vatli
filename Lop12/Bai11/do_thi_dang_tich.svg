<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ĐỒ THỊ ĐƯỜNG ĐẲNG TÍCH TRONG CÁC HỆ TỌA ĐỘ</text>

  <!-- GRAPH A: SYSTEM (p, T) -->
  <g transform="translate(40, 20)">
    <!-- Subtitle -->
    <text x="140" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">a) Trong hệ tọa độ (p, T)</text>
    
    <!-- Axes -->
    <line x1="50" y1="280" x2="280" y2="280" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="280" x2="50" y2="60" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="290" y="285" font-size="14" font-weight="800" fill="#1e293b">T</text>
    <text x="45" y="48" font-size="14" font-weight="800" fill="#1e293b">p</text>
    <text x="36" y="295" font-size="13" font-weight="700" fill="#64748b">O</text>

    <!-- Line V1 (Steeper slope, passes straight through origin O(50, 280)) -->
    <!-- Dotted extension to origin O -->
    <line x1="50" y1="280" x2="120" y2="202.6" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,4"/>
    <!-- Solid line V1 -->
    <line x1="120" y1="202.6" x2="240" y2="70" stroke="#7c3aed" stroke-width="2.8"/>
    <text x="248" y="75" font-size="13" font-weight="800" fill="#7c3aed">V₁ (V₁ &lt; V₂)</text>

    <!-- Line V2 (Smaller slope, PERFECTLY STRAIGHT through origin O(50, 280)) -->
    <!-- Equation: y = 280 - (120/210)*(x - 50) -->
    <!-- Dotted extension to origin O -->
    <line x1="50" y1="280" x2="134" y2="232" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,4"/>
    <!-- Solid line V2 -->
    <line x1="134" y1="232" x2="260" y2="160" stroke="#2563eb" stroke-width="2.8"/>
    <text x="268" y="165" font-size="13" font-weight="800" fill="#2563eb">V₂</text>
  </g>

  <!-- GRAPH B: SYSTEM (p, V) -->
  <g transform="translate(390, 20)">
    <!-- Subtitle -->
    <text x="140" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">b) Trong hệ tọa độ (p, V)</text>

    <!-- Axes -->
    <line x1="50" y1="280" x2="280" y2="280" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="280" x2="50" y2="60" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="290" y="285" font-size="14" font-weight="800" fill="#1e293b">V</text>
    <text x="45" y="48" font-size="14" font-weight="800" fill="#1e293b">p</text>
    <text x="36" y="295" font-size="13" font-weight="700" fill="#64748b">O</text>

    <!-- Solid vertical line for Isochoric Process (p, V) -->
    <line x1="160" y1="80" x2="160" y2="225" stroke="#7c3aed" stroke-width="2.8"/>

    <!-- Dotted line near the horizontal axis V -->
    <line x1="160" y1="225" x2="160" y2="280" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Projection label V0 on horizontal axis -->
    <circle cx="160" cy="280" r="3" fill="#7c3aed"/>
    <text x="160" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">V₀ (không đổi)</text>
    <text x="170" y="90" font-size="13" font-weight="800" fill="#7c3aed">Đường đẳng tích</text>
  </g>
</svg>
