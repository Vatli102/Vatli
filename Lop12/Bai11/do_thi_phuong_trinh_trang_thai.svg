<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif;">
  <!-- Definitions for arrows and markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="32" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ĐỒ THỊ BIẾN ĐỔI TRẠNG THÁI TRÊN HỆ TỌA ĐỘ (p, V)</text>
  <text x="325" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">Từ Trạng thái 1 (p₁, V₁, T₁) qua Trạng thái trung gian 1' (p', V₂, T₁) đến Trạng thái 2 (p₂, V₂, T₂)</text>

  <!-- Axes -->
  <line x1="90" y1="360" x2="580" y2="360" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="360" x2="90" y2="70" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Axis Labels -->
  <text x="595" y="365" font-size="15" font-weight="800" fill="#1e293b">V</text>
  <text x="85" y="55" font-size="15" font-weight="800" fill="#1e293b">p</text>
  <text x="75" y="375" font-size="14" font-weight="700" fill="#64748b">O</text>

  <!-- Isotherm Curves (Hyperbolas) -->
  <!-- Isotherm T1 -->
  <path d="M 130 150 Q 220 270 510 320" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="520" y="318" font-size="12" font-weight="700" fill="#94a3b8">T₁ (đẳng nhiệt)</text>

  <!-- Isotherm T2 (T2 > T1) -->
  <path d="M 170 100 Q 300 180 540 260" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="548" y="258" font-size="12" font-weight="700" fill="#94a3b8">T₂ (T₂ &gt; T₁)</text>

  <!-- Step 1: Isothermal 1 -> 1' (along hyperbola T1) -->
  <path d="M 150 185 Q 220 270 380 300" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Step 2: Isochoric 1' -> 2 (vertical straight line at V2) -->
  <line x1="380" y1="300" x2="380" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Dotted projection lines to axes -->
  <!-- V1 projection -->
  <line x1="150" y1="185" x2="150" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="150" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">V₁</text>

  <!-- V2 projection -->
  <line x1="380" y1="360" x2="380" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">V₂</text>

  <!-- p1 projection -->
  <line x1="90" y1="185" x2="150" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="75" y="190" text-anchor="end" font-size="13" font-weight="700" fill="#475569">p₁</text>

  <!-- p' projection -->
  <line x1="90" y1="300" x2="380" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="75" y="305" text-anchor="end" font-size="13" font-weight="700" fill="#7c3aed">p'</text>

  <!-- p2 projection -->
  <line x1="90" y1="150" x2="380" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="75" y="155" text-anchor="end" font-size="13" font-weight="700" fill="#2563eb">p₂</text>

  <!-- State Points -->
  <!-- Point 1 -->
  <circle cx="150" cy="185" r="6" fill="#7c3aed"/>
  <text x="140" y="170" font-size="14" font-weight="800" fill="#7c3aed">1 (p₁, V₁, T₁)</text>

  <!-- Point 1' -->
  <circle cx="380" cy="300" r="6" fill="#7c3aed"/>
  <text x="395" y="315" font-size="14" font-weight="800" fill="#7c3aed">1' (p', V₂, T₁)</text>

  <!-- Point 2 -->
  <circle cx="380" cy="150" r="6" fill="#2563eb"/>
  <text x="395" y="145" font-size="14" font-weight="800" fill="#2563eb">2 (p₂, V₂, T₂)</text>

  <!-- Step Labels -->
  <text x="260" y="240" font-size="12" font-weight="800" fill="#7c3aed" bg-color="#ffffff">Bước 1: Đẳng nhiệt T₁</text>
  <text x="395" y="230" font-size="12" font-weight="800" fill="#2563eb">Bước 2: Đẳng tích V₂</text>
</svg>
