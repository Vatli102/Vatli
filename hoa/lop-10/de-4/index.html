    <script>

ên tử mà tại đó xác suất tìm thấy electron là lớn nhất (khoảng 90%) được gọi là", "options": {"A": "orbital nguyên tử (AO).", "B": "quỹ đạo chuyển động tròn của electron.", "C": "vỏ electron.", "D": "đám mây điện tích âm."}, "answer": "A", "explanation": "Định nghĩa theo chương trình GDPT 2018: Orbital nguyên tử (AO) là khu vực không gian xung quanh hạt nhân mà tại đó xác suất tìm thấy electron là lớn nhất (khoảng 90%)."}, {"id": 6, "question": "Cấu hình electron của nguyên tử potassium (K, \\(Z = 19\\)) ở trạng thái cơ bản là", "options": {"A": "\\(1s^2 2s^2 2p^6 3s^2 3p^6 4s^1\\).", "B": "\\(1s^2 2s^2 2p^6 3s^2 3p^6 3d^1\\).", "C": "\\(1s^2 2s^2 2p^6 3s^2 3p^5 4s^2\\).", "D": "\\(1s^2 2s^2 2p^6 3s^2 3p^6\\)."}, "answer": "A", "explanation": "Theo nguyên lí vững bền, phân lớp 4s có mức năng lượng thấp hơn phân lớp 3d. Do đó electron thứ 19 sẽ được điền vào phân lớp 4s: \\(1s^2 2s^2 2p^6 3s^2 3p^6 4s^1\\)."}, {"id": 7, "question": "Cho cấu hình electron nguyên tử của nguyên tố nitrogen (\\(Z = 7\\)) là \\(1s^2 2s^2 2p^3\\). Số electron lớp ngoài cùng và loại nguyên tố của nitrogen là", "options": {"A": "5 electron lớp ngoài cùng, là nguyên tố phi kim.", "B": "3 electron lớp ngoài cùng, là nguyên tố kim loại.", "C": "7 electron lớp ngoài cùng, là nguyên tố phi kim.", "D": "5 electron lớp ngoài cùng, là nguyên tố kim loại."}, "answer": "A", "explanation": "Lớp ngoài cùng là lớp thứ 2 gồm 2 + 3 = 5 electron. Các nguyên tử có 5 electron lớp ngoài cùng là phi kim."}, {"id": 8, "question": "Ion \\(\\text{Mg}^{2+}\\) được tạo thành khi nguyên tử magnesium (\\(Z = 12\\), \\(A = 24\\)) nhường đi 2 electron. Số hạt proton, neutron và electron trong ion \\(\\text{Mg}^{2+}\\) lần lượt là", "options": {"A": "12 proton, 12 neutron, 10 electron.", "B": "12 proton, 12 neutron, 12 electron.", "C": "10 proton, 12 neutron, 10 electron.", "D": "12 proton, 14 neutron, 10 electron."}, "answer": "A", "explanation": "Hạt nhân giữ nguyên: số proton = 12, số neutron N = 24 - 12 = 12. Khi nguyên tử magnesium nhường đi 2 electron thì số electron còn lại là 12 - 2 = 10 electron."}, {"id": 9, "question": "Nguyên tử của nguyên tố R có cấu hình electron lớp ngoài cùng là \\(3s^2 3p^1\\). Số electron trong nguyên tử R và tính chất của R là", "options": {"A": "13 electron, là kim loại.", "B": "11 electron, là kim loại.", "C": "15 electron, là phi kim.", "D": "13 electron, là phi kim."}, "answer": "A", "explanation": "Cấu hình electron đầy đủ của R: \\(1s^2 2s^2 2p^6 3s^2 3p^1\\). Tổng số electron = 2 + 2 + 6 + 2 + 1 = 13 (Z = 13, Aluminium). Lớp ngoài cùng có 3 electron nên R là kim loại."}, {"id": 10, "question": "Trong tự nhiên, nguyên tố potassium có ba đồng vị bền: \\(^{39}\\text{K}\\) (chiếm \\(93{,}26\\%\\)), \\(^{40}\\text{K}\\) (chiếm \\(0{,}01\\%\\)) và \\(^{41}\\text{K}\\) (chiếm \\(6{,}73\\%\\)). Nguyên tử khối trung bình của potassium là", "options": {"A": "39,13 amu.", "B": "39,50 amu.", "C": "40,00 amu.", "D": "39,85 amu."}, "answer": "A", "explanation": "Áp dụng công thức tính nguyên tử khối trung bình:\n\\(\\bar{A} = \\frac{39 \\times 93{,}26 + 40 \\times 0{,}01 + 41 \\times 6{,}73}{100} = \\frac{3637{,}14 + 0{,}40 + 275{,}93}{100} = 39{,}1347 \\approx 39{,}13\\text{ amu}\\)."}, {"id": 11, "question": "Tổng số hạt cơ bản (proton, neutron, electron) trong nguyên tử của một nguyên tố kim loại X là 34 hạt. Trong đó, số hạt mang điện nhiều hơn số hạt không mang điện là 10 hạt. Tên gọi của nguyên tố X là", "options": {"A": "Sodium (Na, \\(Z = 11\\)).", "B": "Magnesium (Mg, \\(Z = 12\\)).", "C": "Aluminium (Al, \\(Z = 13\\)).", "D": "Potassium (K, \\(Z = 19\\))."}, "answer": "A", "explanation": "Gọi số proton, neutron, electron trong X lần lượt là P, N, E (P = E).\n- Tổng số hạt: 2P + N = 34 (1)\n- Hiệu số hạt mang điện và không mang điện: 2P - N = 10 (2)\nCộng (1) và (2): 4P = 44 => P = 11 (Sodium, Na). N = 34 - 22 = 12."}, {"id": 12, "question": "Nguyên tố chlorine có hai đồng vị bền trong tự nhiên là \\(^{35}\\text{Cl}\\) và \\(^{37}\\text{Cl}\\). Biết nguyên tử khối trung bình của chlorine là \\(35{,}5\\text{ amu}\\). Phần trăm khối lượng của đồng vị \\(^{35}\\text{Cl}\\) trong phân tử hydrochloric acid (\\(\\text{HCl}\\), biết nguyên tử khối của hydrogen bằng 1) là", "options": {"A": "71,92%.", "B": "75,00%.", "C": "95,89%.", "D": "24,08%."}, "answer": "A", "explanation": "Gọi x là phần trăm số nguyên tử của \\(^{35}\\text{Cl}\\):\n\\(\\frac{35x + 37(100 - x)}{100} = 35{,}5 \\Rightarrow -2x + 3700 = 3550 \\Rightarrow x = 75\\%\\).\nKhối lượng phân tử của HCl: \\(M = 1 + 35{,}5 = 36{,}5\\text{ g/mol}\\).\nKhối lượng của \\(^{35}\\text{Cl}\\) trong 1 mol HCl là: \\(m = 1 \\times 75\\% \\times 35 = 26{,}25\\text{ gam}\\).\nPhần trăm khối lượng của \\(^{35}\\text{Cl}\\) trong HCl:\n\\(\\%m_{^{35}\\text{Cl}} = \\frac{26{,}25}{36{,}5} \\times 100\\% \\approx 71{,}92\\%\\)."}];

        let totalTimeSeconds = 15 * 60;
        let timeRemaining = totalTimeSeconds;
        let lastResultData = null;
        let hasSentResults = false;

        function startExam() {
            const nameInput = document.getElementById('studentName');
            const classInput = document.getElementById('studentClass');
            const name = nameInput.value.trim();
            const sClass = classInput.value.trim();

            if (!name) {
                alert('Vui lòng nhập Họ và tên của bạn!');
                nameInput.focus();
                return;
            }
            if (!sClass) {
                alert('Vui lòng nhập Tên lớp của bạn!');
                classInput.focus();
                return;
            }

            window.sName = name;
            window.sClass = sClass;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = sClass;

            document.getElementById('welcomeBox').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            document.getElementById('timerBadge').style.display = 'inline-flex';

            renderQuestions();
            startTimer();

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
                    submitExam();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                document.getElementById('timerText').innerText = 
                    `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function formatContent(str) {
            if (!str) return '';
            return String(str).replace(/\n/g, '<br>');
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            part1Data.forEach((q, idx) => {
                html += `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-header">
                        <span class="question-tag">Câu ${idx + 1}</span>
                        <div>${formatContent(q.question)}</div>
                    </div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([k, v]) => `
                            <div class="option-item" id="opt-${q.id}-${k}" onclick="selectOption(${q.id}, '${k}')">
                                <span class="option-label">${k}</span>
                                <div style="flex: 1;">${formatContent(v)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${q.id}">
                        <div class="explanation-title"><i class="fa-solid fa-lightbulb"></i> Hướng dẫn giải chi tiết (Đáp án ${q.answer}):</div>
                        <div>${formatContent(q.explanation)}</div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectOption(qId, key) {
            if (examSubmitted) return;
            userPart1[qId] = key;
            ['A', 'B', 'C', 'D'].forEach(k => {
                const el = document.getElementById(`opt-${qId}-${k}`);
                if (el) {
                    if (k === key) el.classList.add('selected');
                    else el.classList.remove('selected');
                }
            });
        }

        function confirmSubmit() {
            const answeredCount = Object.keys(userPart1).length;
            if (answeredCount < part1Data.length) {
                const unans = part1Data.length - answeredCount;
                if (!confirm(`Bạn còn ${unans} câu chưa chọn đáp án. Bạn có chắc chắn muốn nộp bài ngay không?`)) {
                    return;
                }
            } else {
                if (!confirm('Bạn có chắc chắn muốn nộp bài thi không?')) {
                    return;
                }
            }
            submitExam();
        }

        function submitExam() {
            if (examSubmitted) return;
            examSubmitted = true;
            clearInterval(timerInterval);

            document.getElementById('btnSubmit').style.display = 'none';

            let totalCorrect = 0;
            let totalIncorrect = 0;

            part1Data.forEach(q => {
                const userAns = userPart1[q.id];
                const isCorrect = (userAns === q.answer);
                if (isCorrect) {
                    totalCorrect++;
                } else {
                    totalIncorrect++;
                }

                Object.keys(q.options).forEach(k => {
                    const el = document.getElementById(`opt-${q.id}-${k}`);
                    if (el) {
                        if (k === q.answer) el.classList.add('correct');
                        else if (k === userAns) el.classList.add('incorrect');
                    }
                });

                const expEl = document.getElementById(`exp-${q.id}`);
                if (expEl) expEl.classList.add('show');
            });

            const score = ((totalCorrect / part1Data.length) * 10).toFixed(2);
            const timeSpentSecs = totalTimeSeconds - timeRemaining;
            const spentMins = Math.floor(timeSpentSecs / 60);
            const spentSecs = timeSpentSecs % 60;
            const tSpent = `${spentMins < 10 ? '0' : ''}${spentMins}:${spentSecs < 10 ? '0' : ''}${spentSecs}`;

            document.getElementById('resultScore').innerText = score;
            document.getElementById('correctNum').innerText = totalCorrect;
            document.getElementById('incorrectNum').innerText = totalIncorrect;
            document.getElementById('timeSpent').innerText = tSpent;

            let feedback = '';
            if (score >= 9.0) feedback = 'Xuất sắc! Bạn nắm rất vững kiến thức Cấu tạo nguyên tử!';
            else if (score >= 7.0) feedback = 'Khá tốt! Hãy xem lại các câu giải thích để hoàn thiện hơn.';
            else if (score >= 5.0) feedback = 'Đạt yêu cầu cơ bản. Cần ôn kỹ lại cấu hình electron và bài toán hạt.';
            else feedback = 'Cần cố gắng nhiều hơn. Hãy đọc kỹ phần giải thích chi tiết bên dưới nhé!';
            document.getElementById('resultFeedback').innerText = feedback;

            document.getElementById('resultCard').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (score >= 8.0 && window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            const sName = (typeof window.sName !== 'undefined' && window.sName) || 
                          (document.getElementById('displayName') && document.getElementById('displayName').innerText.trim()) || 
                          'Học sinh';
            const sClass = (typeof window.sClass !== 'undefined' && window.sClass) || 
                           (document.getElementById('displayClass') && document.getElementById('displayClass').innerText.trim()) || 
                           '10';

            const payload = {
                timestamp: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                time: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                subject: "Hóa học",
                monHoc: "Hóa học",
                chuyenMuc: "vatli102.com/hoa/",
                sourceUrl: window.location.href,
                sourceDomain: window.location.hostname,
                name: sName,
                studentName: sName,
                hoTen: sName,
                fullName: sName,
                className: sClass,
                studentClass: sClass,
                class: sClass,
                lop: sClass,
                score: String(score),
                totalScore: String(score),
                diem: String(score),
                diemSo: String(score),
                grade: `${score}/10`,
                correctCount: String(totalCorrect),
                correct: `${totalCorrect}/${part1Data.length} câu`,
                soCauDung: String(totalCorrect),
                incorrectCount: String(totalIncorrect),
                soCauSai: String(totalIncorrect),
                tongSoCau: String(part1Data.length),
                timeSpent: tSpent,
                thoiGian: tSpent,
                examTitle: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 04",
                lesson: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 04",
                tenBai: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 04",
                deThi: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 04"
            };

            sendResultsToGoogleSheet(payload);
        }

        function sendResultsToGoogleSheet(data) {
            const host = window.location.hostname.toLowerCase();
            const isVatli102 = (host === 'vatli102.com' || host === 'www.vatli102.com');
            const statusEl = document.getElementById("sheetSyncStatus");

            if (!isVatli102) {
                console.warn("Chặn gửi Google Sheet: Domain " + host + " không thuộc vatli102.com");
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-info" style="color: #0284c7;"></i> <strong>Thông báo:</strong> Kết quả lưu chính thức khi làm bài trên website <strong>vatli102.com</strong>.';
                }
                return;
            }

            if (hasSentResults) return;
            hasSentResults = true;
            lastResultData = data;

            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tự động lưu kết quả vào Google Sheet của giáo viên...';
            }

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(() => {
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> <strong>Đã lưu kết quả thành công</strong> vào sổ điểm Google Sheet của giáo viên!';
                }
            })
            .catch(err => {
                console.error("Lỗi đồng bộ Google Sheet:", err);
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> Đã gửi kết quả bài làm vào hệ thống.';
                }
            });
        }
    </script>
</body>
</html>
