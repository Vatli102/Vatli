    <script>
        const part1Data = [{"id": 1, "question": "Nguyên tử gồm hạt nhân mang điện tích dương và vỏ nguyên tử mang điện tích âm. Các hạt cấu tạo nên hạt nhân nguyên tử là", "options": {"A": "proton và electron.", "B": "proton và neutron.", "C": "electron và neutron.", "D": "proton, electron và neutron."}, "answer": "B", "explanation": "Hạt nhân nguyên tử được cấu tạo bởi hai loại hạt là proton (mang điện tích dương) và neutron (không mang điện). Vỏ nguyên tử được cấu tạo bởi các hạt electron (mang điện tích âm)."}, {"id": 2, "question": "Hạt mang điện tích âm trong nguyên tử là", "options": {"A": "neutron.", "B": "proton.", "C": "electron.", "D": "hạt alpha (\\(\\alpha\\))."}, "answer": "C", "explanation": "Trong nguyên tử, electron (e) là hạt mang điện tích âm (\\(-1\\) hay \\(-1{,}602 \\times 10^{-19}\\text{ C}\\)), proton (p) mang điện tích dương (\\(+1\\) hay \\(+1{,}602 \\times 10^{-19}\\text{ C}\\)), còn neutron (n) không mang điện."}, {"id": 3, "question": "Kí hiệu nguyên tử nào sau đây cho biết nguyên tử đó có số hiệu nguyên tử bằng 11 và số khối bằng 23?", "options": {"A": "\\(^{23}_{11}\\text{Na}\\).", "B": "\\(^{11}_{23}\\text{Na}\\).", "C": "\\(^{12}_{11}\\text{Na}\\).", "D": "\\(^{11}_{12}\\text{Na}\\)."}, "answer": "A", "explanation": "Kí hiệu nguyên tử chuẩn có dạng \\(^{A}_{Z}\\text{X}\\), trong đó \\(Z\\) là số hiệu nguyên tử (viết ở phía dưới bên trái), \\(A\\) là số khối (viết ở phía trên bên trái). Do đó nguyên tử có \\(Z = 11\\), \\(A = 23\\) được kí hiệu là \\(^{23}_{11}\\text{Na}\\)."}, {"id": 4, "question": "Các đồng vị của cùng một nguyên tố hóa học là những nguyên tử có cùng", "options": {"A": "số neutron nhưng khác nhau về số proton.", "B": "số khối nhưng khác nhau về số proton.", "C": "số proton nhưng khác nhau về số neutron.", "D": "tổng số hạt proton và neutron."}, "answer": "C", "explanation": "Đồng vị là những nguyên tử có cùng số proton (cùng số hiệu nguyên tử \\(Z\\)) nhưng khác nhau về số neutron (\\(N\\)), do đó số khối \\(A = Z + N\\) khác nhau."}, {"id": 5, "question": "Số orbital nguyên tử (AO) có trong phân lớp p là", "options": {"A": "1.", "B": "3.", "C": "5.", "D": "7."}, "answer": "B", "explanation": "Phân lớp s có 1 orbital (chứa tối đa 2e), phân lớp p có 3 orbital (\\(p_x, p_y, p_z\\), chứa tối đa 6e), phân lớp d có 5 orbital (tối đa 10e), phân lớp f có 7 orbital (tối đa 14e)."}, {"id": 6, "question": "Nguyên tử của nguyên tố X có số hiệu nguyên tử \\(Z = 17\\). Cấu hình electron của nguyên tử X ở trạng thái cơ bản là", "options": {"A": "\\(1s^2 2s^2 2p^6 3s^2 3p^5\\).", "B": "\\(1s^2 2s^2 2p^6 3s^1 3p^6\\).", "C": "\\(1s^2 2s^2 2p^6 3s^2 3p^6\\).", "D": "\\(1s^2 2s^2 2p^6 3s^2 3p^4\\)."}, "answer": "A", "explanation": "Nguyên tử X có \\(Z = 17\\) nên có 17 electron. Trật tự mức năng lượng và phân bố electron vào các phân lớp: \\(1s^2 2s^2 2p^6 3s^2 3p^5\\)."}, {"id": 7, "question": "Cấu hình electron lớp ngoài cùng của nguyên tử phosphorus (P, \\(Z = 15\\)) ở trạng thái cơ bản là \\(3s^2 3p^3\\). Phát biểu nào sau đây đúng?", "options": {"A": "Nguyên tử phosphorus có 3 electron lớp ngoài cùng và là kim loại.", "B": "Nguyên tử phosphorus có 5 electron lớp ngoài cùng và là phi kim.", "C": "Nguyên tử phosphorus có 3 electron hóa trị và là khí hiếm.", "D": "Nguyên tử phosphorus có 2 electron lớp ngoài cùng và là kim loại."}, "answer": "B", "explanation": "Nguyên tử P có cấu hình electron đầy đủ là \\(1s^2 2s^2 2p^6 3s^2 3p^3\\). Lớp ngoài cùng là lớp thứ 3 (\\(n = 3\\)) gồm \\(2 + 3 = 5\\) electron. Các nguyên tử có 5, 6, 7 electron ở lớp ngoài cùng thường là nguyên tử của nguyên tố phi kim. Do đó P là phi kim."}, {"id": 8, "question": "Ion \\(\\text{Al}^{3+}\\) được tạo thành khi nguyên tử aluminium (Al, \\(Z = 13\\), \\(A = 27\\)) nhường đi 3 electron. Số hạt proton, neutron và electron trong ion \\(\\text{Al}^{3+}\\) lần lượt là", "options": {"A": "13 proton, 14 neutron, 10 electron.", "B": "13 proton, 14 neutron, 13 electron.", "C": "10 proton, 14 neutron, 10 electron.", "D": "13 proton, 27 neutron, 10 electron."}, "answer": "A", "explanation": "Nguyên tử Al có \\(Z = 13\\) nên có 13 proton. Số neutron \\(N = A - Z = 27 - 13 = 14\\). Khi nguyên tử Al nhường 3 electron để tạo thành cation \\(\\text{Al}^{3+}\\), số electron còn lại là \\(13 - 3 = 10\\). Hạt nhân không thay đổi nên số proton vẫn là 13 và số neutron vẫn là 14."}, {"id": 9, "question": "Nguyên tử của nguyên tố Y có tổng số electron ở các phân lớp p là 11. Vị trí và tính chất của nguyên tố Y là", "options": {"A": "Y có \\(Z = 17\\), là phi kim.", "B": "Y có \\(Z = 15\\), là kim loại.", "C": "Y có \\(Z = 16\\), là phi kim.", "D": "Y có \\(Z = 18\\), là khí hiếm."}, "answer": "A", "explanation": "Nguyên tử Y có tổng số electron ở các phân lớp p bằng 11: phân lớp \\(2p\\) bão hòa chứa tối đa 6e, phân lớp \\(3p\\) tiếp theo chứa \\(11 - 6 = 5\\text{e}\\). Cấu hình electron đầy đủ: \\(1s^2 2s^2 2p^6 3s^2 3p^5\\). Tổng số electron là \\(2 + 2 + 6 + 2 + 5 = 17 \\Rightarrow Z = 17\\) (Chlorine). Lớp ngoài cùng có 7 electron nên Y là một phi kim điển hình."}, {"id": 10, "question": "Trong tự nhiên, nguyên tố chlorine có hai đồng vị bền là \\(^{35}\\text{Cl}\\) (chiếm \\(75{,}77\\%\\)) và \\(^{37}\\text{Cl}\\) (chiếm \\(24{,}23\\%\\)). Nguyên tử khối trung bình của chlorine là", "options": {"A": "35,48 amu.", "B": "35,75 amu.", "C": "36,00 amu.", "D": "35,24 amu."}, "answer": "A", "explanation": "Áp dụng công thức tính nguyên tử khối trung bình:\n\\(\\bar{A} = \\frac{35 \\times 75{,}77 + 37 \\times 24{,}23}{100} = \\frac{2651{,}95 + 896{,}51}{100} = 35{,}4846 \\approx 35{,}48\\text{ amu}\\)."}, {"id": 11, "question": "Một nguyên tử của nguyên tố X có tổng số hạt cơ bản (proton, neutron, electron) là 40 hạt. Trong đó, số hạt mang điện nhiều hơn số hạt không mang điện là 12 hạt. Số khối của nguyên tử X là", "options": {"A": "26.", "B": "27.", "C": "28.", "D": "23."}, "answer": "B", "explanation": "Gọi số proton, neutron, electron trong nguyên tử X lần lượt là P, N, E (\\(P = E\\) do nguyên tử trung hòa điện).\nTheo bài ra:\n- Tổng số hạt: \\(2P + N = 40\\) (1)\n- Số hạt mang điện nhiều hơn số hạt không mang điện là 12: \\(2P - N = 12\\) (2)\nCộng (1) và (2): \\(4P = 52 \\Rightarrow P = 13\\).\nThay \\(P = 13\\) vào (1): \\(N = 40 - 2 \\times 13 = 14\\).\nSố khối của X là: \\(A = P + N = 13 + 14 = 27\\) (X là Aluminium, Al)."}, {"id": 12, "question": "Nguyên tố copper (đồng) có hai đồng vị bền trong tự nhiên là \\(^{63}\\text{Cu}\\) và \\(^{65}\\text{Cu}\\). Biết nguyên tử khối trung bình của copper là \\(63{,}54\\text{ amu}\\). Phần trăm khối lượng của đồng vị \\(^{63}\\text{Cu}\\) trong phân tử copper(II) sulfate (\\(\\text{CuSO}_4\\)) là (cho khối lượng nguyên tử \\(S = 32\\), \\(O = 16\\))", "options": {"A": "28,83%.", "B": "39,83%.", "C": "73,00%.", "D": "11,00%."}, "answer": "A", "explanation": "Gọi x là thành phần % số nguyên tử của đồng vị \\(^{63}\\text{Cu}\\) trong tự nhiên:\n\\(\\bar{A}_{\\text{Cu}} = \\frac{63x + 65(100 - x)}{100} = 63{,}54 \\Rightarrow -2x + 6500 = 6354 \\Rightarrow 2x = 146 \\Rightarrow x = 73\\%\\).\nKhối lượng phân tử của \\(\\text{CuSO}_4\\):\n\\(M_{\\text{CuSO}_4} = 63{,}54 + 32 + 4 \\times 16 = 159{,}54\\text{ g/mol}\\).\nTrong 1 mol \\(\\text{CuSO}_4\\) có 1 mol nguyên tử Cu.\nKhối lượng của đồng vị \\(^{63}\\text{Cu}\\) trong 1 mol \\(\\text{CuSO}_4\\) là:\n\\(m_{^{63}\\text{Cu}} = 1 \\times 73\\% \\times 63 = 45{,}99\\text{ gam}\\).\nPhần trăm khối lượng của \\(^{63}\\text{Cu}\\) trong \\(\\text{CuSO}_4\\):\n\\(\\%m_{^{63}\\text{Cu}} = \\frac{45{,}99}{159{,}54} \\times 100\\% \\approx 28{,}83\\%\\)."}];
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwRRiM81mghvA7cInvJgb4rPLzWOAE3s44wer0BJcURQ4hWwoykS19pkNQ9LyzH6Q8lTQ/exec";

        let userPart1 = {};
        let examSubmitted = false;
        let timerInterval = null;
        let totalTimeSeconds = 15 * 60;
        let timeRemaining = totalTimeSeconds;
        let lastResultData = null;
        let hasSentResults = false;

        function startExam() {
            const nameInput = document.getElementById('studentName');
            const classInput = document.getElementById('studentClass');
            const name = nameInput.value.trim();
            const sClass = classInput.value.trim();

            if (!name) {
                alert('Vui lòng nhập Họ và tên của bạn!');
                nameInput.focus();
                return;
            }
            if (!sClass) {
                alert('Vui lòng nhập Tên lớp của bạn!');
                classInput.focus();
                return;
            }

            window.sName = name;
            window.sClass = sClass;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = sClass;

            document.getElementById('welcomeBox').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            document.getElementById('timerBadge').style.display = 'inline-flex';

            renderQuestions();
            startTimer();

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
                    submitExam();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                document.getElementById('timerText').innerText = 
                    `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function formatContent(str) {
            if (!str) return '';
            return String(str).replace(/\n/g, '<br>');
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            part1Data.forEach((q, idx) => {
                html += `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-header">
                        <span class="question-tag">Câu ${idx + 1}</span>
                        <div>${formatContent(q.question)}</div>
                    </div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([k, v]) => `
                            <div class="option-item" id="opt-${q.id}-${k}" onclick="selectOption(${q.id}, '${k}')">
                                <span class="option-label">${k}</span>
                                <div style="flex: 1;">${formatContent(v)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${q.id}">
                        <div class="explanation-title"><i class="fa-solid fa-lightbulb"></i> Hướng dẫn giải chi tiết (Đáp án ${q.answer}):</div>
                        <div>${formatContent(q.explanation)}</div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectOption(qId, key) {
            if (examSubmitted) return;
            userPart1[qId] = key;
            ['A', 'B', 'C', 'D'].forEach(k => {
                const el = document.getElementById(`opt-${qId}-${k}`);
                if (el) {
                    if (k === key) el.classList.add('selected');
                    else el.classList.remove('selected');
                }
            });
        }

        function confirmSubmit() {
            const answeredCount = Object.keys(userPart1).length;
            if (answeredCount < part1Data.length) {
                const unans = part1Data.length - answeredCount;
                if (!confirm(`Bạn còn ${unans} câu chưa chọn đáp án. Bạn có chắc chắn muốn nộp bài ngay không?`)) {
                    return;
                }
            } else {
                if (!confirm('Bạn có chắc chắn muốn nộp bài thi không?')) {
                    return;
                }
            }
            submitExam();
        }

        function submitExam() {
            if (examSubmitted) return;
            examSubmitted = true;
            clearInterval(timerInterval);

            document.getElementById('btnSubmit').style.display = 'none';

            let totalCorrect = 0;
            let totalIncorrect = 0;

            part1Data.forEach(q => {
                const userAns = userPart1[q.id];
                const isCorrect = (userAns === q.answer);
                if (isCorrect) {
                    totalCorrect++;
                } else {
                    totalIncorrect++;
                }

                Object.keys(q.options).forEach(k => {
                    const el = document.getElementById(`opt-${q.id}-${k}`);
                    if (el) {
                        if (k === q.answer) el.classList.add('correct');
                        else if (k === userAns) el.classList.add('incorrect');
                    }
                });

                const expEl = document.getElementById(`exp-${q.id}`);
                if (expEl) expEl.classList.add('show');
            });

            const score = ((totalCorrect / part1Data.length) * 10).toFixed(2);
            const timeSpentSecs = totalTimeSeconds - timeRemaining;
            const spentMins = Math.floor(timeSpentSecs / 60);
            const spentSecs = timeSpentSecs % 60;
            const tSpent = `${spentMins < 10 ? '0' : ''}${spentMins}:${spentSecs < 10 ? '0' : ''}${spentSecs}`;

            // Display Results
            document.getElementById('resultScore').innerText = score;
            document.getElementById('correctNum').innerText = totalCorrect;
            document.getElementById('incorrectNum').innerText = totalIncorrect;
            document.getElementById('timeSpent').innerText = tSpent;

            let feedback = '';
            if (score >= 9.0) feedback = 'Xuất sắc! Bạn nắm rất vững kiến thức Cấu tạo nguyên tử!';
            else if (score >= 7.0) feedback = 'Khá tốt! Hãy xem lại các câu giải thích để hoàn thiện hơn.';
            else if (score >= 5.0) feedback = 'Đạt yêu cầu cơ bản. Cần ôn kỹ lại cấu hình electron và bài toán hạt.';
            else feedback = 'Cần cố gắng nhiều hơn. Hãy đọc kỹ phần giải thích chi tiết bên dưới nhé!';
            document.getElementById('resultFeedback').innerText = feedback;

            document.getElementById('resultCard').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (score >= 8.0 && window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            // Google Sheet Sync with Single-Submission Lock and Alias Matrix
            const sName = (typeof window.sName !== 'undefined' && window.sName) || 
                          (document.getElementById('displayName') && document.getElementById('displayName').innerText.trim()) || 
                          'Học sinh';
            const sClass = (typeof window.sClass !== 'undefined' && window.sClass) || 
                           (document.getElementById('displayClass') && document.getElementById('displayClass').innerText.trim()) || 
                           '10';

            const payload = {
                timestamp: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                time: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                subject: "Hóa học",
                monHoc: "Hóa học",
                chuyenMuc: "vatli102.com/hoa/",
                sourceUrl: window.location.href,
                sourceDomain: window.location.hostname,
                name: sName,
                studentName: sName,
                hoTen: sName,
                fullName: sName,
                className: sClass,
                studentClass: sClass,
                class: sClass,
                lop: sClass,
                score: String(score),
                totalScore: String(score),
                diem: String(score),
                diemSo: String(score),
                grade: `${score}/10`,
                correctCount: String(totalCorrect),
                correct: `${totalCorrect}/${part1Data.length} câu`,
                soCauDung: String(totalCorrect),
                incorrectCount: String(totalIncorrect),
                soCauSai: String(totalIncorrect),
                tongSoCau: String(part1Data.length),
                timeSpent: tSpent,
                thoiGian: tSpent,
                examTitle: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - CHƯƠNG 1: CẤU TẠO NGUYÊN TỬ",
                lesson: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - CHƯƠNG 1: CẤU TẠO NGUYÊN TỬ",
                tenBai: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - CHƯƠNG 1: CẤU TẠO NGUYÊN TỬ",
                deThi: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - CHƯƠNG 1: CẤU TẠO NGUYÊN TỬ"
            };

            sendResultsToGoogleSheet(payload);
        }

        function sendResultsToGoogleSheet(data) {
            const host = window.location.hostname.toLowerCase();
            const isVatli102 = (host === 'vatli102.com' || host === 'www.vatli102.com');
            const statusEl = document.getElementById("sheetSyncStatus");

            if (!isVatli102) {
                console.warn("Chặn gửi Google Sheet: Domain " + host + " không thuộc vatli102.com");
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-info" style="color: #0284c7;"></i> <strong>Thông báo:</strong> Kết quả lưu chính thức khi làm bài trên website <strong>vatli102.com</strong>.';
                }
                return;
            }

            if (hasSentResults) return;
            hasSentResults = true;
            lastResultData = data;

            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tự động lưu kết quả vào Google Sheet của giáo viên...';
            }

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(() => {
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> <strong>Đã lưu kết quả thành công</strong> vào sổ điểm Google Sheet của giáo viên!';
                }
            })
            .catch(err => {
                console.error("Lỗi đồng bộ Google Sheet:", err);
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> Đã gửi kết quả bài làm vào hệ thống.';
                }
            });
        }
    </script>
