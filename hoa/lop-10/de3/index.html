    <script>
        const part1Data = [{"id": 1, "question": "Hạt nhân của hầu hết các nguyên tử đều được tạo nên bởi các hạt", "options": {"A": "proton và electron.", "B": "proton và neutron.", "C": "neutron và electron.", "D": "proton, neutron và electron."}, "answer": "B", "explanation": "Ngoại trừ nguyên tử đồng vị phổ biến nhất của hydrogen (\\(^{1}_1\\text{H}\\)) chỉ có 1 proton và không có neutron, hạt nhân của hầu hết các nguyên tử đều được tạo nên bởi hai loại hạt là proton và neutron."}, {"id": 2, "question": "Hạt không mang điện trong nguyên tử là", "options": {"A": "proton.", "B": "electron.", "C": "neutron.", "D": "hạt alpha."}, "answer": "C", "explanation": "Trong ba loại hạt cơ bản, proton mang điện tích +1, electron mang điện tích -1, còn neutron là hạt trung hòa về điện (điện tích bằng 0)."}, {"id": 3, "question": "Cho kí hiệu nguyên tử \\(^{56}_{26}\\text{Fe}\\). Số electron có trong nguyên tử iron (sắt) ở trạng thái trung hòa là", "options": {"A": "26.", "B": "30.", "C": "56.", "D": "82."}, "answer": "A", "explanation": "Kí hiệu \\(^{56}_{26}\\text{Fe}\\) có số hiệu nguyên tử Z = 26. Vì nguyên tử trung hòa về điện nên số electron bằng số proton = 26."}, {"id": 4, "question": "Phát biểu nào sau đây đúng về các đồng vị của cùng một nguyên tố hóa học?", "options": {"A": "Các đồng vị có tính chất hóa học cơ bản giống nhau vì có cùng số electron ở vỏ nguyên tử.", "B": "Các đồng vị có cùng số khối A nhưng khác nhau về số hiệu nguyên tử Z.", "C": "Các đồng vị có số proton khác nhau nhưng có cùng số neutron.", "D": "Các đồng vị có khối lượng nguyên tử hoàn toàn bằng nhau."}, "answer": "A", "explanation": "Các đồng vị có cùng số proton nên có cùng số electron và cấu hình electron lớp vỏ, do đó các đồng vị của cùng một nguyên tố có tính chất hóa học cơ bản giống nhau."}, {"id": 5, "question": "Số electron tối đa có thể phân bố trong lớp thứ hai (\\(n = 2\\), lớp L) của nguyên tử là", "options": {"A": "2.", "B": "8.", "C": "18.", "D": "32."}, "answer": "B", "explanation": "Số electron tối đa trong lớp n được tính theo công thức \\(2n^2\\). Với lớp thứ hai (n = 2): số e tối đa là \\(2 \\times 2^2 = 8\\) electron (gồm phân lớp \\(2s^2\\) và \\(2p^6\\))."}, {"id": 6, "question": "Cấu hình electron nào sau đây là cấu hình electron của nguyên tử khí hiếm neon (Ne, \\(Z = 10\\)) ở trạng thái cơ bản?", "options": {"A": "\\(1s^2 2s^2 2p^6\\).", "B": "\\(1s^2 2s^2 2p^4\\).", "C": "\\(1s^2 2s^2 2p^6 3s^2\\).", "D": "\\(1s^2 2s^2 2p^5\\)."}, "answer": "A", "explanation": "Nguyên tử neon có Z = 10. Cấu hình electron ở trạng thái cơ bản là \\(1s^2 2s^2 2p^6\\). Lớp ngoài cùng (lớp 2) có 8 electron bão hòa bền vững, đặc trưng cho khí hiếm."}, {"id": 7, "question": "Cấu hình electron lớp ngoài cùng của nguyên tử calcium (Ca, \\(Z = 20\\)) ở trạng thái cơ bản là \\(4s^2\\). Bản chất nguyên tố và số electron hóa trị của calcium là", "options": {"A": "Kim loại, có 2 electron hóa trị.", "B": "Phi kim, có 2 electron hóa trị.", "C": "Khí hiếm, có 8 electron hóa trị.", "D": "Kim loại, có 4 electron hóa trị."}, "answer": "A", "explanation": "Cấu hình electron đầy đủ của Ca: \\([\\text{Ar}]4s^2\\). Lớp ngoài cùng là lớp thứ 4 có 2 electron, dễ nhường đi 2 electron trong các phản ứng hóa học nên calcium là kim loại, có 2 electron hóa trị."}, {"id": 8, "question": "Ion chloride (\\(\\text{Cl}^{-}\\)) được hình thành khi nguyên tử chlorine (\\(Z = 17\\), \\(A = 35\\)) nhận thêm 1 electron. Số hạt proton, neutron và electron trong ion \\(\\text{Cl}^{-}\\) lần lượt là", "options": {"A": "17 proton, 18 neutron, 18 electron.", "B": "17 proton, 18 neutron, 17 electron.", "C": "17 proton, 18 neutron, 16 electron.", "D": "18 proton, 18 neutron, 18 electron."}, "answer": "A", "explanation": "Hạt nhân giữ nguyên: số proton = 17, số neutron N = 35 - 17 = 18. Số electron ban đầu là 17, khi nhận thêm 1 electron tạo anion \\(\\text{Cl}^{-}\\) thì số electron là 17 + 1 = 18."}, {"id": 9, "question": "Một nguyên tử X có tổng số electron ở các phân lớp s là 6 và ở các phân lớp p là 12. Số hiệu nguyên tử của X là", "options": {"A": "18.", "B": "16.", "C": "20.", "D": "17."}, "answer": "A", "explanation": "Các phân lớp s bão hòa gồm \\(1s^2, 2s^2, 3s^2\\) (tổng 6e). Các phân lớp p bão hòa gồm \\(2p^6, 3p^6\\) (tổng 12e). Cấu hình: \\(1s^2 2s^2 2p^6 3s^2 3p^6\\). Số electron = 6 + 12 = 18 => Z = 18 (Argon)."}, {"id": 10, "question": "Trong tự nhiên, nguyên tố boron có hai đồng vị bền là \\(^{10}\\text{B}\\) (nguyên tử khối là 10) và \\(^{11}\\text{B}\\) (nguyên tử khối là 11). Biết nguyên tử khối trung bình của boron là 10,81 amu. Phần trăm số nguyên tử của đồng vị \\(^{11}\\text{B}\\) trong tự nhiên là", "options": {"A": "81,00%.", "B": "19,00%.", "C": "75,00%.", "D": "80,00%."}, "answer": "A", "explanation": "Gọi y là phần trăm số nguyên tử của đồng vị \\(^{11}\\text{B}\\) (y > 0). Khi đó phần trăm của \\(^{10}\\text{B}\\) là \\(100 - y\\).\n\\(\\bar{A} = \\frac{10(100 - y) + 11y}{100} = 10{,}81 \\Rightarrow 1000 + y = 1081 \\Rightarrow y = 81\\%\\)."}, {"id": 11, "question": "Hạt nhân nguyên tử của nguyên tố Y có tổng số hạt mang điện là 24 và số hạt không mang điện là 28. Số khối A và số electron của nguyên tử Y ở trạng thái trung hòa lần lượt là", "options": {"A": "52 và 24.", "B": "52 và 28.", "C": "50 và 24.", "D": "56 và 24."}, "answer": "A", "explanation": "Trong hạt nhân, hạt mang điện là proton nên P = 24. Hạt không mang điện là neutron nên N = 28. Số khối A = P + N = 24 + 28 = 52. Do nguyên tử trung hòa điện nên số electron E = P = 24 (Chromium, Cr)."}, {"id": 12, "question": "Trong tự nhiên, nguyên tố lithium có hai đồng vị bền là \\(^{6}\\text{Li}\\) (nguyên tử khối là 6, chiếm \\(7{,}5\\%\\)) và \\(^{7}\\text{Li}\\) (nguyên tử khối là 7, chiếm \\(92{,}5\\%\\)). Phần trăm khối lượng của đồng vị \\(^{7}\\text{Li}\\) trong hợp chất lithium chloride (\\(\\text{LiCl}\\), biết nguyên tử khối trung bình của chlorine bằng 35,5) là", "options": {"A": "15,26%.", "B": "16,38%.", "C": "1,06%.", "D": "92,50%."}, "answer": "A", "explanation": "Nguyên tử khối trung bình của Li:\n\\(\\bar{A}_{\\text{Li}} = \\frac{6 \\times 7{,}5 + 7 \\times 92{,}5}{100} = 6{,}925\\text{ amu}\\).\nKhối lượng phân tử của \\(\\text{LiCl}\\):\n\\(M = 6{,}925 + 35{,}5 = 42{,}425\\text{ g/mol}\\).\nKhối lượng của \\(^{7}\\text{Li}\\) trong 1 mol \\(\\text{LiCl}\\) là: \\(m = 1 \\times 92{,}5\\% \\times 7 = 6{,}475\\text{ gam}\\).\nPhần trăm khối lượng của \\(^{7}\\text{Li}\\) trong \\(\\text{LiCl}\\):\n\\(\\%m_{^{7}\\text{Li}} = \\frac{6{,}475}{42{,}425} \\times 100\\% \\approx 15{,}26\\%\\)."}];
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwRRiM81mghvA7cInvJgb4rPLzWOAE3s44wer0BJcURQ4hWwoykS19pkNQ9LyzH6Q8lTQ/exec";

            const sClass = classInput.value.trim();

            if (!name) {
                alert('Vui lòng nhập Họ và tên của bạn!');
                nameInput.focus();
                return;
            }
            if (!sClass) {
                alert('Vui lòng nhập Tên lớp của bạn!');
                classInput.focus();
                return;
            }

            window.sName = name;
            window.sClass = sClass;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = sClass;

            document.getElementById('welcomeBox').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            document.getElementById('timerBadge').style.display = 'inline-flex';

            renderQuestions();
            startTimer();

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
                    submitExam();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                document.getElementById('timerText').innerText = 
                    `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function formatContent(str) {
            if (!str) return '';
            return String(str).replace(/\n/g, '<br>');
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            part1Data.forEach((q, idx) => {
                html += `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-header">
                        <span class="question-tag">Câu ${idx + 1}</span>
                        <div>${formatContent(q.question)}</div>
                    </div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([k, v]) => `
                            <div class="option-item" id="opt-${q.id}-${k}" onclick="selectOption(${q.id}, '${k}')">
                                <span class="option-label">${k}</span>
                                <div style="flex: 1;">${formatContent(v)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${q.id}">
                        <div class="explanation-title"><i class="fa-solid fa-lightbulb"></i> Hướng dẫn giải chi tiết (Đáp án ${q.answer}):</div>
                        <div>${formatContent(q.explanation)}</div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectOption(qId, key) {
            if (examSubmitted) return;
            userPart1[qId] = key;
            ['A', 'B', 'C', 'D'].forEach(k => {
                const el = document.getElementById(`opt-${qId}-${k}`);
                if (el) {
                    if (k === key) el.classList.add('selected');
                    else el.classList.remove('selected');
                }
            });
        }

        function confirmSubmit() {
            const answeredCount = Object.keys(userPart1).length;
            if (answeredCount < part1Data.length) {
                const unans = part1Data.length - answeredCount;
                if (!confirm(`Bạn còn ${unans} câu chưa chọn đáp án. Bạn có chắc chắn muốn nộp bài ngay không?`)) {
                    return;
                }
            } else {
                if (!confirm('Bạn có chắc chắn muốn nộp bài thi không?')) {
                    return;
                }
            }
            submitExam();
        }

        function submitExam() {
            if (examSubmitted) return;
            examSubmitted = true;
            clearInterval(timerInterval);

            document.getElementById('btnSubmit').style.display = 'none';

            let totalCorrect = 0;
            let totalIncorrect = 0;

            part1Data.forEach(q => {
                const userAns = userPart1[q.id];
                const isCorrect = (userAns === q.answer);
                if (isCorrect) {
                    totalCorrect++;
                } else {
                    totalIncorrect++;
                }

                Object.keys(q.options).forEach(k => {
                    const el = document.getElementById(`opt-${q.id}-${k}`);
                    if (el) {
                        if (k === q.answer) el.classList.add('correct');
                        else if (k === userAns) el.classList.add('incorrect');
                    }
                });

                const expEl = document.getElementById(`exp-${q.id}`);
                if (expEl) expEl.classList.add('show');
            });

            const score = ((totalCorrect / part1Data.length) * 10).toFixed(2);
            const timeSpentSecs = totalTimeSeconds - timeRemaining;
            const spentMins = Math.floor(timeSpentSecs / 60);
            const spentSecs = timeSpentSecs % 60;
            const tSpent = `${spentMins < 10 ? '0' : ''}${spentMins}:${spentSecs < 10 ? '0' : ''}${spentSecs}`;

            document.getElementById('resultScore').innerText = score;
            document.getElementById('correctNum').innerText = totalCorrect;
            document.getElementById('incorrectNum').innerText = totalIncorrect;
            document.getElementById('timeSpent').innerText = tSpent;

            let feedback = '';
            if (score >= 9.0) feedback = 'Xuất sắc! Bạn nắm rất vững kiến thức Cấu tạo nguyên tử!';
            else if (score >= 7.0) feedback = 'Khá tốt! Hãy xem lại các câu giải thích để hoàn thiện hơn.';
            else if (score >= 5.0) feedback = 'Đạt yêu cầu cơ bản. Cần ôn kỹ lại cấu hình electron và bài toán hạt.';
            else feedback = 'Cần cố gắng nhiều hơn. Hãy đọc kỹ phần giải thích chi tiết bên dưới nhé!';
            document.getElementById('resultFeedback').innerText = feedback;

            document.getElementById('resultCard').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (score >= 8.0 && window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            const sName = (typeof window.sName !== 'undefined' && window.sName) || 
                          (document.getElementById('displayName') && document.getElementById('displayName').innerText.trim()) || 
                          'Học sinh';
            const sClass = (typeof window.sClass !== 'undefined' && window.sClass) || 
                           (document.getElementById('displayClass') && document.getElementById('displayClass').innerText.trim()) || 
                           '10';

            const payload = {
                timestamp: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                time: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                subject: "Hóa học",
                monHoc: "Hóa học",
                chuyenMuc: "vatli102.com/hoa/",
                sourceUrl: window.location.href,
                sourceDomain: window.location.hostname,
                name: sName,
                studentName: sName,
                hoTen: sName,
                fullName: sName,
                className: sClass,
                studentClass: sClass,
                class: sClass,
                lop: sClass,
                score: String(score),
                totalScore: String(score),
                diem: String(score),
                diemSo: String(score),
                grade: `${score}/10`,
                correctCount: String(totalCorrect),
                correct: `${totalCorrect}/${part1Data.length} câu`,
                soCauDung: String(totalCorrect),
                incorrectCount: String(totalIncorrect),
                soCauSai: String(totalIncorrect),
                tongSoCau: String(part1Data.length),
                timeSpent: tSpent,
                thoiGian: tSpent,
                examTitle: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 03",
                lesson: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 03",
                tenBai: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 03",
                deThi: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 10 - ĐỀ SỐ 03"
            };

            sendResultsToGoogleSheet(payload);
        }

        function sendResultsToGoogleSheet(data) {
            const host = window.location.hostname.toLowerCase();
            const isVatli102 = (host === 'vatli102.com' || host === 'www.vatli102.com');
            const statusEl = document.getElementById("sheetSyncStatus");

            if (!isVatli102) {
                console.warn("Chặn gửi Google Sheet: Domain " + host + " không thuộc vatli102.com");
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-info" style="color: #0284c7;"></i> <strong>Thông báo:</strong> Kết quả lưu chính thức khi làm bài trên website <strong>vatli102.com</strong>.';
                }
                return;
            }

            if (hasSentResults) return;
            hasSentResults = true;
            lastResultData = data;

            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tự động lưu kết quả vào Google Sheet của giáo viên...';
            }

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(() => {
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> <strong>Đã lưu kết quả thành công</strong> vào sổ điểm Google Sheet của giáo viên!';
                }
            })
            .catch(err => {
                console.error("Lỗi đồng bộ Google Sheet:", err);
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> Đã gửi kết quả bài làm vào hệ thống.';
                }
            });
        }
    </script>
</body>
