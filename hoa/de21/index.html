    <script>
        const part1Data = [{"id": 1, "question": "Carbohydrate nào sau đây có trong máu người với nồng độ hầu như không đổi, khoảng 0,1% (tương đương 4,4 – 7,2 mmol/L)?", "options": {"A": "Fructose.", "B": "Glucose.", "C": "Saccharose.", "D": "Cellulose."}, "answer": "B", "explanation": "Trong máu người luôn có một lượng nhỏ glucose với nồng độ hầu như không đổi khoảng 0,1% (tương đương 4,4 - 7,2 mmol/L). Glucose đóng vai trò cung cấp năng lượng chủ yếu cho các hoạt động sống của tế bào trong cơ thể, đặc biệt là tế bào não và tế bào hồng cầu. Nếu nồng độ glucose trong máu giảm dưới mức này sẽ gây hạ đường huyết, còn nếu tăng cao kéo dài sẽ dẫn tới bệnh tiểu đường."}, {"id": 2, "question": "Cho các chất sau: glucose, saccharose, glycerol, cellulose. Dung dịch chất nào vừa hòa tan được \\(\\text{Cu(OH)}_2\\) ở nhiệt độ phòng tạo phức chất màu xanh lam, vừa tham gia phản ứng tráng bạc với thuốc thử Tollens?", "options": {"A": "Saccharose.", "B": "Glycerol.", "C": "Glucose.", "D": "Cellulose."}, "answer": "C", "explanation": "Phân tích đặc điểm từng chất:\n- Glucose (\\(\\text{C}_6\\text{H}_{12}\\text{O}_6\\)) phân tử ở dạng mạch hở chứa 5 nhóm -OH kề nhau và 1 nhóm -CHO. Nhờ có các nhóm -OH kề nhau, glucose hòa tan \\(\\text{Cu(OH)}_2\\) ở nhiệt độ phòng tạo dung dịch màu xanh lam; nhờ có nhóm -CHO, glucose tham gia phản ứng tráng bạc với thuốc thử Tollens ([Ag(NH3)2]OH) khi đun nóng.\n- Saccharose và glycerol hòa tan được \\(\\text{Cu(OH)}_2\\) tạo dung dịch màu xanh lam nhưng không có nhóm -CHO nên không có phản ứng tráng bạc.\n- Cellulose không tan trong nước và không có các phản ứng trên."}, {"id": 3, "question": "Lên men m gam glucose để sản xuất ethanol với hiệu suất cả quá trình đạt 80%. Toàn bộ lượng khí \\(\\text{CO}_2\\) sinh ra được hấp thụ hết vào dung dịch \\(\\text{Ca(OH)}_2\\) dư, thu được 40 gam kết tủa trắng. Giá trị của m là", "options": {"A": "45,0.", "B": "36,0.", "C": "28,8.", "D": "56,25."}, "answer": "A", "explanation": "Phương trình hóa học lên men rượu:\n\\(\\text{C}_6\\text{H}_{12}\\text{O}_6 \\xrightarrow{\\text{men rượu, } 30-35^\\circ\\text{C}} 2\\text{C}_2\\text{H}_5\\text{OH} + 2\\text{CO}_2\\)\nHấp thụ khí \\(\\text{CO}_2\\) vào dung dịch \\(\\text{Ca(OH)}_2\\) dư:\n\\(\\text{CO}_2 + \\text{Ca(OH)}_2 \\rightarrow \\text{CaCO}_3\\downarrow + \\text{H}_2\\text{O}\\)\nSố mol kết tủa \\(\\text{CaCO}_3\\):\n\\(n_{\\text{CaCO}_3} = \\frac{40}{100} = 0{,}4\\text{ mol} \\Rightarrow n_{\\text{CO}_2} = 0{,}4\\text{ mol}\\).\nTheo phương trình phản ứng lên men:\n\\(n_{\\text{glucose (phản ứng)}} = \\frac{1}{2} n_{\\text{CO}_2} = 0{,}2\\text{ mol}\\).\nVì hiệu suất toàn bộ quá trình đạt 80%, lượng glucose ban đầu cần lấy là:\n\\(n_{\\text{glucose (ban đầu)}} = \\frac{0{,}2}{80\\%} = 0{,}25\\text{ mol}\\).\nKhối lượng glucose cần dùng là:\n\\(m = 0{,}25 \\times 180 = 45{,}0\\text{ gam}\\)."}, {"id": 4, "question": "Chất nào sau đây thuộc loại amine bậc hai?", "options": {"A": "\\(\\text{CH}_3\\text{CH}_2\\text{NH}_2\\).", "B": "\\((\\text{CH}_3)_3\\text{N}\\).", "C": "\\(\\text{C}_6\\text{H}_5\\text{NH}_2\\).", "D": "\\(\\text{CH}_3\\text{NHCH}_3\\)."}, "answer": "D", "explanation": "Bậc của amine được xác định bằng số nguyên tử hydrogen trong phân tử ammonia (\\(\\text{NH}_3\\)) bị thay thế bởi gốc hydrocarbon:\n- Amine bậc hai có dạng \\(\\text{R-NH-R'}\\). Chất \\(\\text{CH}_3\\text{NHCH}_3\\) (dimethylamine) có 2 gốc methyl thay thế 2 nguyên tử H nên thuộc loại amine bậc hai.\n- \\(\\text{CH}_3\\text{CH}_2\\text{NH}_2\\) (ethylamine) và \\(\\text{C}_6\\text{H}_5\\text{NH}_2\\) (aniline) là amine bậc một.\n- \\((\\text{CH}_3)_3\\text{N}\\) (trimethylamine) là amine bậc ba."}, {"id": 5, "question": "Cho các chất sau: aniline (1), methylamine (2), ammonia (3), dimethylamine (4). Thứ tự sắp xếp các chất theo chiều tăng dần lực base từ trái sang phải là", "options": {"A": "(4) < (2) < (3) < (1).", "B": "(1) < (3) < (2) < (4).", "C": "(1) < (2) < (3) < (4).", "D": "(3) < (1) < (2) < (4)."}, "answer": "B", "explanation": "Lực base của amine phụ thuộc vào mật độ electron trên nguyên tử nitrogen:\n- Aniline (1): Gốc phenyl (\\(-\\text{C}_6\\text{H}_5\\)) hút electron làm giảm mật độ electron trên N, do đó tính base rất yếu (yếu hơn \\(\\text{NH}_3\\), không làm đổi màu quỳ tím).\n- Ammonia (3): Có lực base trung bình.\n- Methylamine (2): Có 1 nhóm methyl đẩy electron làm tăng mật độ electron trên N, do đó tính base mạnh hơn ammonia.\n- Dimethylamine (4): Có 2 nhóm methyl cùng đẩy electron làm mật độ electron trên N càng lớn, do đó tính base mạnh hơn methylamine.\nThứ tự tăng dần lực base: Aniline (1) < Ammonia (3) < Methylamine (2) < Dimethylamine (4)."}, {"id": 6, "question": "Cho 4,5 gam một amine no, đơn chức, mạch hở X tác dụng vừa đủ với 100 mL dung dịch HCl 1M, thu được dung dịch chứa muối ammonium chloride khan. Công thức phân tử của X là", "options": {"A": "\\(\\text{CH}_5\\text{N}\\).", "B": "\\(\\text{C}_3\\text{H}_9\\text{N}\\).", "C": "\\(\\text{C}_2\\text{H}_7\\text{N}\\).", "D": "\\(\\text{C}_4\\text{H}_{11}\\text{N}\\)."}, "answer": "C", "explanation": "Số mol HCl phản ứng:\n\\(n_{\\text{HCl}} = 0{,}1 \\times 1 = 0{,}1\\text{ mol}\\).\nAmine X no, đơn chức, mạch hở phản ứng với HCl theo tỉ lệ mol 1 : 1:\n\\(\\text{X} + \\text{HCl} \\rightarrow \\text{X}\\cdot\\text{HCl}\n\\Rightarrow n_X = n_{\\text{HCl}} = 0{,}1\\text{ mol}\\).\nKhối lượng mol phân tử của amine X là:\n\\(M_X = \\frac{m_X}{n_X} = \\frac{4{,}5}{0{,}1} = 45\\text{ g/mol}\\).\nCông thức phân tử tổng quát của amine no, đơn chức, mạch hở là \\(\\text{C}_n\\text{H}_{2n+3}\\text{N}\\) (với \\(n \\ge 1\\)):\n\\(14n + 17 = 45 \\Rightarrow 14n = 28 \\Rightarrow n = 2\\).\nVậy công thức phân tử của X là \\(\\text{C}_2\\text{H}_7\\text{N}\\) (ethylamine hoặc dimethylamine)."}, {"id": 7, "question": "Phân tử amino acid nào sau đây có chứa 1 nhóm amino (\\(-\\text{NH}_2\\)), 1 nhóm carboxyl (\\(-\\text{COOH}\\)) và có phân tử khối bằng 89 amu?", "options": {"A": "Glycine.", "B": "Alanine.", "C": "Valine.", "D": "Glutamic acid."}, "answer": "B", "explanation": "Phân tích đặc điểm các amino acid:\n- Alanine (2-aminopropanoic acid) có công thức phân tử là \\(\\text{C}_3\\text{H}_7\\text{NO}_2\\), cấu tạo thu gọn \\(\\text{CH}_3\\text{-CH(NH}_2\\text{)-COOH}\\), phân tử khối: \\(M = 3 \\times 12 + 7 + 14 + 32 = 89\\text{ amu}\\).\n- Glycine (\\(\\text{H}_2\\text{N-CH}_2\\text{-COOH}\\)) có \\(M = 75\\text{ amu}\\).\n- Valine (\\((\\text{CH}_3)_2\\text{CH-CH(NH}_2\\text{)-COOH}\\)) có \\(M = 117\\text{ amu}\\).\n- Glutamic acid (\\(\\text{HOOC-CH}_2\\text{-CH}_2\\text{-CH(NH}_2\\text{)-COOH}\\)) có \\(M = 147\\text{ amu}\\)."}, {"id": 8, "question": "Phân tử tetrapeptide mạch hở Gly-Ala-Val-Ala có số liên kết peptide là", "options": {"A": "4.", "B": "2.", "C": "1.", "D": "3."}, "answer": "D", "explanation": "Liên kết peptide là liên kết -CO-NH- giữa hai đơn vị \\(\\alpha\\)-amino acid. Trong một peptide mạch hở gồm n gốc \\(\\alpha\\)-amino acid thì có \\(n - 1\\) liên kết peptide.\nTetrapeptide Gly-Ala-Val-Ala được cấu tạo từ 4 gốc amino acid: Gly -CO-NH- Ala -CO-NH- Val -CO-NH- Ala.\nDo đó số liên kết peptide trong phân tử là: \\(4 - 1 = 3\\) liên kết."}, {"id": 9, "question": "Dung dịch của chất nào sau đây làm quỳ tím chuyển sang màu hồng (đỏ nhạt)?", "options": {"A": "Glutamic acid.", "B": "Glycine.", "C": "Lysine.", "D": "Alanine."}, "answer": "A", "explanation": "Môi trường dung dịch của amino acid \\((\\text{H}_2\\text{N})_x\\text{-R-(COOH)}_y\\) phụ thuộc vào tương quan giữa số nhóm carboxyl (tính acid) và số nhóm amino (tính base):\n- Glutamic acid có 2 nhóm -COOH và 1 nhóm \\(-\\text{NH}_2\\) (\\(y > x\\)) nên dung dịch có tính acid (\\(\\text{pH} < 7\\)), làm quỳ tím chuyển sang màu hồng.\n- Glycine và alanine đều có 1 nhóm -COOH và 1 nhóm \\(-\\text{NH}_2\\) (\\(x = y\\)) nên dung dịch gần như trung tính, không làm đổi màu quỳ tím.\n- Lysine có 1 nhóm -COOH và 2 nhóm \\(-\\text{NH}_2\\) (\\(x > y\\)) nên dung dịch có tính base, làm quỳ tím hóa xanh."}, {"id": 10, "question": "Cho 7,5 gam glycine (\\(\\text{H}_2\\text{N-CH}_2\\text{-COOH}\\)) phản ứng hoàn toàn với dung dịch NaOH vừa đủ. Cô cạn cẩn thận dung dịch sau phản ứng, thu được m gam muối khan sodium glycinate. Giá trị của m là", "options": {"A": "8,2.", "B": "9,7.", "C": "9,5.", "D": "11,2."}, "answer": "B", "explanation": "Số mol glycine tham gia phản ứng:\n\\(n_{\\text{Gly}} = \\frac{7{,}5}{75} = 0{,}1\\text{ mol}\\).\nPhương trình hóa học của phản ứng:\n\\(\\text{H}_2\\text{N-CH}_2\\text{-COOH} + \\text{NaOH} \\rightarrow \\text{H}_2\\text{N-CH}_2\\text{-COONa} + \\text{H}_2\\text{O}\\)\nTheo phương trình phản ứng:\n\\(n_{\\text{muối}} = n_{\\text{Gly}} = 0{,}1\\text{ mol}\\).\nKhối lượng mol của muối sodium glycinate (\\(\\text{H}_2\\text{N-CH}_2\\text{-COONa}\\)) là:\n\\(M_{\\text{muối}} = 14 + 2 + 14 + 12 + 32 + 23 = 97\\text{ g/mol}\\).\nKhối lượng muối khan thu được là:\n\\(m = 0{,}1 \\times 97 = 9{,}7\\text{ gam}\\)."}];
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwRRiM81mghvA7cInvJgb4rPLzWOAE3s44wer0BJcURQ4hWwoykS19pkNQ9LyzH6Q8lTQ/exec";

        let userPart1 = {};
        let examSubmitted = false;
        let timerInterval = null;
        let totalTimeSeconds = 15 * 60;
        let timeRemaining = totalTimeSeconds;
        let lastResultData = null;
        let hasSentResults = false;

        function startExam() {
            const nameInput = document.getElementById('studentName');
            const classInput = document.getElementById('studentClass');
            const name = nameInput.value.trim();
            const sClass = classInput.value.trim();

            if (!name) {
                alert('Vui lòng nhập Họ và tên của bạn!');
                nameInput.focus();
                return;
            }
            if (!sClass) {
                alert('Vui lòng nhập Tên lớp của bạn!');
                classInput.focus();
                return;
            }

            window.sName = name;
            window.sClass = sClass;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = sClass;

            document.getElementById('welcomeBox').style.display = 'none';
            document.getElementById('examArea').style.display = 'block';
            document.getElementById('timerBadge').style.display = 'inline-flex';

            renderQuestions();
            startTimer();

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert('Đã hết 15 phút làm bài! Hệ thống tự động nộp bài.');
                    submitExam();
                    return;
                }
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                document.getElementById('timerText').innerText = 
                    `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        function formatContent(str) {
            if (!str) return '';
            return String(str).replace(/\n/g, '<br>');
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            part1Data.forEach((q, idx) => {
                html += `
                <div class="question-card" id="card-${q.id}">
                    <div class="question-header">
                        <span class="question-tag">Câu ${idx + 1}</span>
                        <div>${formatContent(q.question)}</div>
                    </div>
                    <div class="options-grid">
                        ${Object.entries(q.options).map(([k, v]) => `
                            <div class="option-item" id="opt-${q.id}-${k}" onclick="selectOption(${q.id}, '${k}')">
                                <span class="option-label">${k}</span>
                                <div style="flex: 1;">${formatContent(v)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${q.id}">
                        <div class="explanation-title"><i class="fa-solid fa-lightbulb"></i> Hướng dẫn giải chi tiết (Đáp án ${q.answer}):</div>
                        <div>${formatContent(q.explanation)}</div>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function selectOption(qId, key) {
            if (examSubmitted) return;
            userPart1[qId] = key;
            ['A', 'B', 'C', 'D'].forEach(k => {
                const el = document.getElementById(`opt-${qId}-${k}`);
                if (el) {
                    if (k === key) el.classList.add('selected');
                    else el.classList.remove('selected');
                }
            });
        }

        function confirmSubmit() {
            const answeredCount = Object.keys(userPart1).length;
            if (answeredCount < part1Data.length) {
                const unans = part1Data.length - answeredCount;
                if (!confirm(`Bạn còn ${unans} câu chưa chọn đáp án. Bạn có chắc chắn muốn nộp bài ngay không?`)) {
                    return;
                }
            } else {
                if (!confirm('Bạn có chắc chắn muốn nộp bài thi không?')) {
                    return;
                }
            }
            submitExam();
        }

        function submitExam() {
            if (examSubmitted) return;
            examSubmitted = true;
            clearInterval(timerInterval);

            document.getElementById('btnSubmit').style.display = 'none';

            let totalCorrect = 0;
            let totalIncorrect = 0;

            part1Data.forEach(q => {
                const userAns = userPart1[q.id];
                const isCorrect = (userAns === q.answer);
                if (isCorrect) {
                    totalCorrect++;
                } else {
                    totalIncorrect++;
                }

                Object.keys(q.options).forEach(k => {
                    const el = document.getElementById(`opt-${q.id}-${k}`);
                    if (el) {
                        if (k === q.answer) el.classList.add('correct');
                        else if (k === userAns) el.classList.add('incorrect');
                    }
                });

                const expEl = document.getElementById(`exp-${q.id}`);
                if (expEl) expEl.classList.add('show');
            });

            const score = ((totalCorrect / part1Data.length) * 10).toFixed(2);
            const timeSpentSecs = totalTimeSeconds - timeRemaining;
            const spentMins = Math.floor(timeSpentSecs / 60);
            const spentSecs = timeSpentSecs % 60;
            const tSpent = `${spentMins < 10 ? '0' : ''}${spentMins}:${spentSecs < 10 ? '0' : ''}${spentSecs}`;

            // Display Results
            document.getElementById('resultScore').innerText = score;
            document.getElementById('correctNum').innerText = totalCorrect;
            document.getElementById('incorrectNum').innerText = totalIncorrect;
            document.getElementById('timeSpent').innerText = tSpent;

            let feedback = '';
            if (score >= 9.0) feedback = 'Xuất sắc! Bạn nắm rất vững kiến thức Carbohydrate, Amine và Amino acid!';
            else if (score >= 7.0) feedback = 'Khá tốt! Hãy đọc kỹ phần giải thích các câu sai để ghi nhớ lâu hơn.';
            else if (score >= 5.0) feedback = 'Đạt yêu cầu cơ bản. Cần củng cố lại lý thuyết peptide và lực base amine.';
            else feedback = 'Cần cố gắng ôn tập nhiều hơn. Hãy đọc kỹ phần giải thích chi tiết bên dưới nhé!';
            document.getElementById('resultFeedback').innerText = feedback;

            document.getElementById('resultCard').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (score >= 8.0 && window.confetti) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            // Google Sheet Sync with Single-Submission Lock and Alias Matrix
            const sName = (typeof window.sName !== 'undefined' && window.sName) || 
                          (document.getElementById('displayName') && document.getElementById('displayName').innerText.trim()) || 
                          'Học sinh';
            const sClass = (typeof window.sClass !== 'undefined' && window.sClass) || 
                           (document.getElementById('displayClass') && document.getElementById('displayClass').innerText.trim()) || 
                           '12';

            const payload = {
                timestamp: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                time: new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" }),
                subject: "Hóa học",
                monHoc: "Hóa học",
                chuyenMuc: "vatli102.com/hoa/",
                sourceUrl: window.location.href,
                sourceDomain: window.location.hostname,
                name: sName,
                studentName: sName,
                hoTen: sName,
                fullName: sName,
                className: sClass,
                studentClass: sClass,
                class: sClass,
                lop: sClass,
                score: String(score),
                totalScore: String(score),
                diem: String(score),
                diemSo: String(score),
                grade: `${score}/10`,
                correctCount: String(totalCorrect),
                correct: `${totalCorrect}/${part1Data.length} câu`,
                soCauDung: String(totalCorrect),
                incorrectCount: String(totalIncorrect),
                soCauSai: String(totalIncorrect),
                tongSoCau: String(part1Data.length),
                timeSpent: tSpent,
                thoiGian: tSpent,
                examTitle: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 12 - ĐỀ SỐ 21",
                lesson: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 12 - ĐỀ SỐ 21",
                tenBai: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 12 - ĐỀ SỐ 21",
                deThi: "ĐỀ KIỂM TRA 15 PHÚT HÓA HỌC 12 - ĐỀ SỐ 21"
            };

            sendResultsToGoogleSheet(payload);
        }

        function sendResultsToGoogleSheet(data) {
            const host = window.location.hostname.toLowerCase();
            const isVatli102 = (host === 'vatli102.com' || host === 'www.vatli102.com');
            const statusEl = document.getElementById("sheetSyncStatus");

            if (!isVatli102) {
                console.warn("Chặn gửi Google Sheet: Domain " + host + " không thuộc vatli102.com");
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-info" style="color: #4f46e5;"></i> <strong>Thông báo:</strong> Kết quả lưu chính thức khi làm bài trên website <strong>vatli102.com</strong>.';
                }
                return;
            }

            if (hasSentResults) return;
            hasSentResults = true;
            lastResultData = data;

            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tự động lưu kết quả vào Google Sheet của giáo viên...';
            }

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(() => {
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> <strong>Đã lưu kết quả thành công</strong> vào sổ điểm Google Sheet của giáo viên!';
                }
            })
            .catch(err => {
                console.error("Lỗi đồng bộ Google Sheet:", err);
                if (statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #16a34a;"></i> Đã gửi kết quả bài làm vào hệ thống.';
                }
            });
        }
    </script>
