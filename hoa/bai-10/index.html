      "explain": "Cấu hình của M²⁺ là 1s² 2s² 2p⁶ (có 10 electron). Do nguyên tử M đã nhường 2 electron để tạo M²⁺ nên số electron của nguyên tử M ban đầu là 10 + 2 = 12 electron. Do đó số hiệu nguyên tử Z = 12 (Magnesium, Mg)."

    const GAS_URL = "https://script.google.com/macros/s/AKfycbwRRiM81mghvA7cInvJgb4rPLzWOAE3s44wer0BJcURQ4hWwoykS19pkNQ9LyzH6Q8lTQ/exec";

    let answers = {
      part1: {},
      part2: {},
      part3: {}
    };

    // Render đề thi
    function renderQuiz() {
      // Phần 1
      const p1Box = document.getElementById('part1Container');
      p1Box.innerHTML = QUIZ.part1.map(q => `
        <div class="question-card" id="card_p1_${q.id}">
          <div class="question-header"><span class="q-number">Câu ${q.id}:</span> ${q.question}</div>
          <div class="options-grid">
            ${q.options.map((opt, idx) => {
              const letter = opt.substring(0, 1);
              return `
                <div class="option-item" onclick="selectP1(${q.id}, '${letter}', this)">
                  <input type="radio" name="p1_${q.id}" value="${letter}">
                  <span>${opt}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div class="explain-box" id="exp_p1_${q.id}">
            <b>Đáp án đúng: ${q.answer}</b><br>
            <i>${q.explain}</i>
          </div>
        </div>
      `).join('');

      // Phần 2
      const p2Box = document.getElementById('part2Container');
      p2Box.innerHTML = QUIZ.part2.map(q => `
        <div class="question-card" id="card_p2_${q.id}">
          <div class="question-header"><span class="q-number">Câu ${q.id}:</span> ${q.context}</div>
          <table class="tf-table">
            <thead>
              <tr>
                <th style="width: 70%;">Phát biểu</th>
                <th style="width: 30%; text-align: center;">Chọn Đúng / Sai</th>
              </tr>
            </thead>
            <tbody>
              ${q.sub_questions.map(sub => `
                <tr>
                  <td><b>${sub.label})</b> ${sub.text}</td>
                  <td style="text-align: center;">
                    <div class="tf-btn-group">
                      <button type="button" class="tf-btn" id="btn_tf_${q.id}_${sub.label}_true" onclick="selectP2(${q.id}, '${sub.label}', 'Đúng')">ĐÚNG</button>
                      <button type="button" class="tf-btn" id="btn_tf_${q.id}_${sub.label}_false" onclick="selectP2(${q.id}, '${sub.label}', 'Sai')">SAI</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div class="explain-box" id="exp_p2_${q.id}">
            <b>Đáp án chi tiết:</b><br>
            ${q.sub_questions.map(s => `${s.label}) <b>${s.answer}</b> - <i>${s.explain}</i>`).join('<br>')}
          </div>
        </div>
      `).join('');

      // Phần 3
      const p3Box = document.getElementById('part3Container');
      p3Box.innerHTML = QUIZ.part3.map(q => `
        <div class="question-card" id="card_p3_${q.id}">
          <div class="question-header"><span class="q-number">Câu ${q.id}:</span> ${q.question}</div>
          <div>
            <label style="font-size: 0.9rem; font-weight: 500;">Nhập đáp số (dạng số):</label><br>
            <input type="text" class="short-input" id="inp_p3_${q.id}" placeholder="Nhập số..." oninput="selectP3(${q.id}, this.value)">
          </div>
          <div class="explain-box" id="exp_p3_${q.id}">
            <b>Đáp số đúng: ${q.answer}</b><br>
            <i>${q.explain}</i>
          </div>
        </div>
      `).join('');

      if (window.MathJax) {
        MathJax.typesetPromise();
      }
    }

    function selectP1(qId, val, elem) {
      answers.part1[qId] = val;
      const card = document.getElementById(`card_p1_${qId}`);
      card.querySelectorAll('.option-item').forEach(it => it.classList.remove('selected'));
      elem.classList.add('selected');
      const radio = elem.querySelector('input[type="radio"]');
      if (radio) radio.checked = true;
      updateProgress();
    }

    function selectP2(qId, subLabel, val) {
      if (!answers.part2[qId]) answers.part2[qId] = {};
      answers.part2[qId][subLabel] = val;
      const btnT = document.getElementById(`btn_tf_${qId}_${subLabel}_true`);
      const btnF = document.getElementById(`btn_tf_${qId}_${subLabel}_false`);
      if (val === 'Đúng') {
        btnT.className = 'tf-btn selected-true';
        btnF.className = 'tf-btn';
      } else {
        btnT.className = 'tf-btn';
        btnF.className = 'tf-btn selected-false';
      }
      updateProgress();
    }

    function selectP3(qId, val) {
      if (val.trim()) {
        answers.part3[qId] = val.trim();
      } else {
        delete answers.part3[qId];
      }
      updateProgress();
    }

    function updateProgress() {
      let count = Object.keys(answers.part1).length;
      for (let k in answers.part2) {
        if (Object.keys(answers.part2[k]).length === 4) count++;
      }
      count += Object.keys(answers.part3).length;
      const total = 16 + 2 + 4; // 22 câu
      const pct = Math.round((count / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').innerText = `${count}/${total} câu`;
    }

    // Đồng hồ đếm ngược 45 phút
    let secondsLeft = 45 * 60;
    const timerInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert('Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.');
        submitQuiz();
        return;
      }
      const mins = Math.floor(secondsLeft / 60);
      const secs = secondsLeft % 60;
      document.getElementById('timeLeft').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }, 1000);

    function submitQuiz() {
      const name = document.getElementById('studentName').value.trim();
      const sClass = document.getElementById('studentClass').value.trim();
      if (!name || !sClass) {
        alert('Vui lòng nhập đầy đủ Họ và tên cùng Lớp học trước khi nộp bài!');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      clearInterval(timerInterval);

      // Chấm điểm
      // Phần 1: 16 câu x 0.25đ = 4.0 điểm
      let p1Score = 0;
      QUIZ.part1.forEach(q => {
        if (answers.part1[q.id] === q.answer) p1Score += 0.25;
      });

      // Phần 2: 2 câu x 1.0đ = 2.0 điểm
      // Chuẩn thi tốt nghiệp THPT: Đúng 1 ý: 0.1đ, Đúng 2 ý: 0.25đ, Đúng 3 ý: 0.5đ, Đúng 4 ý: 1.0đ
      let p2Score = 0;
      QUIZ.part2.forEach(q => {
        let correctSubs = 0;
        q.sub_questions.forEach(sub => {
          if (answers.part2[q.id] && answers.part2[q.id][sub.label] === sub.answer) {
            correctSubs++;
          }
        });
        if (correctSubs === 1) p2Score += 0.1;
        else if (correctSubs === 2) p2Score += 0.25;
        else if (correctSubs === 3) p2Score += 0.5;
        else if (correctSubs === 4) p2Score += 1.0;
      });

      // Phần 3: 4 câu x 0.5đ = 2.0 điểm
      let p3Score = 0;
      QUIZ.part3.forEach(q => {
        if (answers.part3[q.id] && answers.part3[q.id].toLowerCase() === q.answer.toLowerCase()) {
          p3Score += 0.5;
        }
      });

      // Tổng điểm trắc nghiệm trên thang 8.0 (hoặc quy đổi thang 10: (p1+p2+p3) / 8.0 * 10)
      const rawTotal = p1Score + p2Score + p3Score;
      const finalScore10 = ((rawTotal / 8.0) * 10).toFixed(2);

      // Hiển thị Popup
      document.getElementById('resStudentInfo').innerText = `Học sinh: ${name} - Lớp: ${sClass}`;
      document.getElementById('resScore').innerText = `${finalScore10} / 10`;
      document.getElementById('resDetails').innerText = 
        `Điểm quy đổi: ${finalScore10}đ (P1: ${p1Score.toFixed(2)}/4.0đ | P2: ${p2Score.toFixed(2)}/2.0đ | P3: ${p3Score.toFixed(2)}/2.0đ)`;
      document.getElementById('resultModal').style.display = 'flex';

      // Đồng bộ về Google Sheet qua Google Apps Script
      const payload = {
        bai: "BÀI 10: QUY TẮC OCTET",
        ho_ten: name,
        lop: sClass,
        truong: document.getElementById('studentSchool').value.trim(),
        diem_10: finalScore10,
        diem_goc: rawTotal.toFixed(2),
        thoi_gian_con: document.getElementById('timeLeft').innerText,
        chi_tiet: JSON.stringify(answers)
      };

      try {
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          console.log("Đã đồng bộ kết quả lên Google Sheet thành công!");
        }).catch(err => console.log("Lỗi gửi Sheet:", err));
      } catch (e) {
        console.log("Không thể kết nối GAS:", e);
      }
    }

    function closeModalAndReview() {
      document.getElementById('resultModal').style.display = 'none';
      document.querySelectorAll('.explain-box').forEach(b => b.style.display = 'block');
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerText = 'ĐÃ NỘP BÀI - ĐANG XEM LỜI GIẢI';
      document.getElementById('btnSubmit').style.background = '#64748b';
      window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
  </script>
