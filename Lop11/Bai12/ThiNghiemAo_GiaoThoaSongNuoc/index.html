<head>
  <meta charset="utf-8">

  <title>Thí nghiệm ảo Giao thoa sóng nước 3D | Vatli102.com</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SL0GEVWWHM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SL0GEVWWHM');
  </script>
  <meta name="description" content="Thí nghiệm ảo mô phỏng giao thoa sóng nước 3D tương tác cao. Khảo sát 1, 2, 4 nguồn sóng, cực đại hyperbol, cực tiểu triệt tiêu bám sát SGK Vật lí 11 Kết nối tri thức.">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <div id="errors" class="errors" hidden></div>
  <!-- Static fallback (the only text outside strings.js): shown when no script can run at all,
       e.g. index.html opened as file:// or JavaScript disabled, so the page is never blank. -->
  <div id="boot-fail" class="boot-fail">
    <p>Không chạy được ứng dụng. Hãy mở trang qua máy chủ web (trong thư mục này chạy
      <code>py -m http.server 8000</code> rồi mở http://localhost:8000), dùng Chrome hoặc Edge bản mới và bật JavaScript.</p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('boot-fail');
      el.hidden = true;
      var check = function () {
        if (!window.__rippleStarted && !window.__rippleErrorShown) el.hidden = false;
      };
      if (location.protocol === 'file:') check(); else setTimeout(check, 6000);
    })();
  </script>
  <!-- errors.js is its own module graph so it still runs when main.js fails to load -->
  <script type="module" src="js/ui/errors.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
